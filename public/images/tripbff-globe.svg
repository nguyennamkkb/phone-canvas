<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230" role="img" aria-label="Smiling globe mascot with confetti">
  <!-- confetti: small circles / squares / diamonds in teal red yellow blue -->
  <g>
    <circle cx="118" cy="26" r="6" fill="none" stroke="#38b6c9" stroke-width="3"/>
    <rect x="196" y="30" width="10" height="10" rx="1" fill="#f0524a" transform="rotate(18 201 35)"/>
    <rect x="248" y="22" width="11" height="11" rx="1" fill="#f5b90d" transform="rotate(-12 253 27)"/>
    <rect x="62" y="66" width="15" height="15" rx="1" fill="none" stroke="#4a6cf5" stroke-width="4"/>
    <rect x="292" y="72" width="14" height="14" rx="1" fill="#f5b90d" transform="rotate(45 299 79)"/>
    <circle cx="92" cy="112" r="5" fill="none" stroke="#38b6c9" stroke-width="3"/>
    <rect x="308" y="128" width="10" height="10" rx="1" fill="#f0524a" transform="rotate(14 313 133)"/>
    <rect x="70" y="160" width="10" height="10" rx="1" fill="#f0524a" transform="rotate(-16 75 165)"/>
    <rect x="272" y="172" width="16" height="7" rx="1" fill="#4a6cf5" transform="rotate(38 280 175)"/>
  </g>
  <!-- gray ellipse shadow -->
  <ellipse cx="188" cy="204" rx="46" ry="10" fill="#e4e6ec"/>
  <!-- legs -->
  <path d="M168 176 q-2 12 -8 16 q8 6 16 2 q4 -8 2 -16 z" fill="#3aa7e0"/>
  <path d="M204 176 q2 12 8 16 q-8 6 -16 2 q-4 -8 -2 -16 z" fill="#3aa7e0"/>
  <!-- arms -->
  <path d="M128 138 q-14 4 -20 16 q-3 7 4 8 q9 -8 20 -12 z" fill="#3aa768"/>
  <path d="M248 128 q14 -2 20 -12 q3 -6 -3 -8 q-8 6 -21 8 z" fill="#3aa768"/>
  <!-- blue sphere -->
  <circle cx="188" cy="122" r="62" fill="#54c4f5"/>
  <path d="M148 90 q20 -18 52 -16 q-30 8 -44 30 q-8 12 -8 30 q-12 -20 0 -44z" fill="#7bd8fa"/>
  <!-- green patches -->
  <path d="M188 62 q26 0 40 14 q-10 10 -24 8 q-16 -2 -24 -12 q2 -6 8 -10z" fill="#3aa768"/>
  <path d="M238 96 q10 18 6 40 q-4 20 -18 30 q-8 -12 -6 -26 q3 -20 8 -30 q4 -8 10 -14z" fill="#3aa768"/>
  <path d="M140 140 q10 -8 22 -4 q-2 10 -12 12 q-10 2 -14 -2 q0 -4 4 -6z" fill="#3aa768"/>
  <!-- eyes -->
  <ellipse cx="172" cy="116" rx="11" ry="13" fill="#ffffff"/>
  <ellipse cx="204" cy="116" rx="11" ry="13" fill="#ffffff"/>
  <ellipse cx="172" cy="118" rx="6" ry="8" fill="#2b2440"/>
  <ellipse cx="204" cy="118" rx="6" ry="8" fill="#2b2440"/>
  <circle cx="174" cy="115" r="2" fill="#ffffff"/>
  <circle cx="206" cy="115" r="2" fill="#ffffff"/>
  <!-- smile -->
  <path d="M182 140 q7 6 14 0 q-2 8 -7 8 q-5 0 -7 -8z" fill="#ffffff"/>
</svg>
