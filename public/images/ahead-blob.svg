<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180" role="img" aria-label="Blob mascot with sparkles">
  <!-- dark purple seat bar -->
  <rect x="90" y="132" width="160" height="18" rx="9" fill="#2e1a72"/>
  <!-- lavender blob -->
  <path d="M120 132 q-6 -60 50 -62 q56 -2 52 62 z" fill="#d9c7f5"/>
  <!-- eyes -->
  <circle cx="155" cy="88" r="13" fill="#3a1040"/>
  <circle cx="195" cy="88" r="13" fill="#3a1040"/>
  <circle cx="159" cy="84" r="4" fill="#ffffff"/>
  <circle cx="199" cy="84" r="4" fill="#ffffff"/>
  <!-- tiny smile -->
  <path d="M168 106 q7 6 14 0" stroke="#3a1040" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- yellow 4-point sparkle -->
  <path d="M78 42 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6 z" fill="#ffc61a"/>
  <!-- small yellow dot -->
  <circle cx="66" cy="78" r="7" fill="#ffc61a"/>
  <!-- lavender zigzag arrow -->
  <polyline points="218,52 232,40 244,50 258,36 272,44 288,26" fill="none" stroke="#b9a5e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="218" cy="52" r="5" fill="#b9a5e8"/>
  <circle cx="244" cy="50" r="5" fill="#b9a5e8"/>
  <circle cx="272" cy="44" r="5" fill="#b9a5e8"/>
  <circle cx="288" cy="26" r="6" fill="#b9a5e8"/>
</svg>
