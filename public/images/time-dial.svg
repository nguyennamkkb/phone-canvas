<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Analog dial at about 4:20">
  <!-- hairline outer ring -->
  <circle cx="75" cy="75" r="66" fill="none" stroke="#d8d6e0" stroke-width="1"/>
  <!-- 12/3/6/9 numerals (art text, part of the dial graphic) -->
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="11" fill="#8e8e93" text-anchor="middle">
    <text x="75" y="28">12</text>
    <text x="127" y="79">3</text>
    <text x="75" y="131">6</text>
    <text x="23" y="79">9</text>
  </g>
  <!-- hands, angles measured from the collage crop by ray-cast (center 537,693):
       minute 0deg/12:00 len~17px, hour 62deg/04:10 len~10px, second 219deg/07:38 len~29px -->
  <line x1="75" y1="75" x2="75" y2="34" stroke="#1b1a22" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="75" x2="93" y2="84" stroke="#1b1a22" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="75" x2="48" y2="107" stroke="#4f3d9e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="75" cy="75" r="3.5" fill="#1b1a22"/>
</svg>
