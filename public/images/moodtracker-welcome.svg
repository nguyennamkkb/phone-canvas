<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 360" fill="none">
  <!--
    Onboarding art, reference style: flat shapes with a thick black outline,
    loose doodles at the card edges, one peach shadow ellipse doing the ground.
    Draw order is the drawing — the card covers the blob and the leaves.
  -->

  <!-- doodles, behind everything -->
  <circle cx="368" cy="26" r="34" fill="#F4B6AE" />
  <circle cx="42" cy="80" r="16" stroke="#F3CC27" stroke-width="3.5" />
  <circle cx="352" cy="266" r="18" stroke="#F0A8AD" stroke-width="3.5" />
  <circle cx="330" cy="152" r="6" fill="#9DB584" />
  <circle cx="46" cy="240" r="6" fill="#2B2B29" />
  <path d="M312 108c9-11 17 5 26-6" stroke="#2B2B29" stroke-width="3.5" stroke-linecap="round" />
  <path d="M54 302c9-11 17 5 26-6" stroke="#2B2B29" stroke-width="3.5" stroke-linecap="round" />
  <path d="M296 322h14M306 334h9" stroke="#2B2B29" stroke-width="3.5" stroke-linecap="round" />
  <path d="M64 156h13M74 168h8" stroke="#2B2B29" stroke-width="3.5" stroke-linecap="round" />

  <!-- ground -->
  <ellipse cx="198" cy="300" rx="96" ry="19" fill="#F0A8AD" transform="rotate(-8 198 300)" />

  <!-- sage leaves, fanning right -->
  <ellipse cx="300" cy="180" rx="58" ry="13" fill="#9DB584" transform="rotate(-24 300 180)" />
  <ellipse cx="309" cy="208" rx="56" ry="12" fill="#8FB072" transform="rotate(-4 309 208)" />
  <ellipse cx="302" cy="234" rx="52" ry="11" fill="#A6BC8C" transform="rotate(15 302 234)" />

  <!-- lilac blob behind the card, with a stem -->
  <ellipse cx="112" cy="198" rx="44" ry="66" fill="#8B7FD0" transform="rotate(-16 112 198)" />
  <path d="M104 134c-6-16 4-26 14-30" stroke="#6F63B8" stroke-width="7" stroke-linecap="round" />

  <!-- the journal card -->
  <rect
    x="120"
    y="116"
    width="156"
    height="186"
    rx="16"
    fill="#FFFDF7"
    stroke="#2B2B29"
    stroke-width="7"
    transform="rotate(-15 198 209)"
  />

  <!-- one mood face, front and centre -->
  <circle cx="198" cy="214" r="62" fill="#F3CC27" stroke="#2B2B29" stroke-width="7" />
  <circle cx="177" cy="201" r="7.5" fill="#2B2B29" />
  <circle cx="219" cy="201" r="7.5" fill="#2B2B29" />
  <path
    d="M173 229c9 17 41 17 50 0"
    stroke="#2B2B29"
    stroke-width="7.5"
    stroke-linecap="round"
  />

  <!-- doodles on the card -->
  <path d="M156 150c10-9 19 7 29-2" stroke="#2B2B29" stroke-width="3.5" stroke-linecap="round" />
  <path d="M236 172h12" stroke="#2B2B29" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="246" cy="256" r="7" stroke="#2B2B29" stroke-width="3.5" />
</svg>
