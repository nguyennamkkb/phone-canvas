<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 330" width="390" height="330" role="img" aria-label="Red bank card tilted with sparkles">
  <defs>
    <linearGradient id="mb-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="0.62" stop-color="#1b2b4d"/>
      <stop offset="1" stop-color="#1b2b4d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mb-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4503c"/>
      <stop offset="0.45" stop-color="#ef2d3a"/>
      <stop offset="0.8" stop-color="#e8622a"/>
      <stop offset="1" stop-color="#f0832b"/>
    </linearGradient>
  </defs>
  <!-- dark navy backdrop wash -->
  <rect x="0" y="0" width="390" height="252" fill="url(#mb-navy)"/>
  <!-- tilted card: skewed rect composition (bake tilt, no CSS transform) -->
  <g>
    <path d="M40 84 L330 20 Q354 16 358 40 L372 216 Q376 240 352 246 L62 312 Q38 316 34 292 L20 116 Q16 92 40 84z" fill="url(#mb-card)"/>
    <!-- gray chip -->
    <g transform="rotate(-12 130 130)">
      <rect x="96" y="108" width="62" height="46" rx="8" fill="#c9cdd4"/>
      <path d="M96 123 h62 M96 139 h62 M117 108 v46 M138 108 v46" stroke="#a9afb8" stroke-width="3"/>
    </g>
    <!-- overlapping circles bottom-right -->
    <circle cx="248" cy="232" r="27" fill="#8a8f98"/>
    <circle cx="274" cy="236" r="27" fill="#dfe3e8"/>
    <!-- white 4-point sparkles -->
    <g fill="#ffffff">
      <path d="M60 48 q4 30 32 35 q-28 5 -32 35 q-4 -30 -32 -35 q28 -5 32 -35z"/>
      <path d="M316 36 q3 20 22 23 q-19 4 -22 23 q-3 -19 -22 -23 q19 -3 22 -23z"/>
      <path d="M342 128 q3 22 24 25 q-21 4 -24 25 q-3 -21 -24 -25 q21 -3 24 -25z"/>
    </g>
  </g>
</svg>
