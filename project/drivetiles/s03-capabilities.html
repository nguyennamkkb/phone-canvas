<!-- S03 — Onboarding: what you can build. Three concrete outcome cards,
     CTA always visible. Page 2 of 3. -->
<div class="screen">
  <div class="body" style="padding: var(--s4) var(--s5); gap: var(--s4)">
    <div class="col" style="gap: var(--s1); align-items: center">
      <span class="dt-onb-title" style="font-size: var(--t-title1); line-height: var(--lh-title1); letter-spacing: var(--track-title1)">Build what you glance at</span>
      <span class="dt-onb-copy">Three kinds of tiles cover almost every drive.</span>
    </div>
    <div class="col" style="gap: var(--card-gap)">
      <div class="dt-card is-row">
        <img
          class="art"
          src="/images/dt-cap-time.svg"
          data-asset="CapabilityTime"
          width="84"
          height="84"
          alt="Clock with weather tile"
        />
        <div class="col grow" style="gap: 0">
          <span class="dt-card-title">Time &amp; Weather</span>
          <span class="dt-card-sub">Clock, date, live conditions at a glance.</span>
        </div>
      </div>
      <div class="dt-card is-row">
        <img
          class="art"
          src="/images/dt-cap-photo.svg"
          data-asset="CapabilityPhoto"
          width="84"
          height="84"
          alt="Framed photo with quote chip"
        />
        <div class="col grow" style="gap: 0">
          <span class="dt-card-title">Photo &amp; Quote</span>
          <span class="dt-card-sub">A memory on screen, with words that move you.</span>
        </div>
      </div>
      <div class="dt-card is-row">
        <img
          class="art"
          src="/images/dt-cap-trip.svg"
          data-asset="CapabilityTrip"
          width="84"
          height="84"
          alt="Route ending in a destination pin"
        />
        <div class="col grow" style="gap: 0">
          <span class="dt-card-title">Trip &amp; Location</span>
          <span class="dt-card-sub">ETA, distance, and where you are headed.</span>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="dots" aria-label="Page 2 of 3">
      <span class="dot"></span>
      <span class="dot is-active"></span>
      <span class="dot"></span>
    </div>
    <button class="dt-cta is-primary">Continue</button>
  </div>
</div>
