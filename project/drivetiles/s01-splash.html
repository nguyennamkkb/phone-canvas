<!-- S01 — Splash: brand entry + restore state. Logo, product mark,
     loading caption. No interactive CTA (spec). Cold-start primary state. -->
<div class="screen dt-splash">
  <div class="body dt-splash-body">
    <img
      class="art"
      src="/images/dt-mark.svg"
      data-asset="DriveTilesMark"
      width="120"
      height="120"
      alt="DriveTiles product mark"
    />
    <div class="col" style="gap: var(--s1); align-items: center">
      <span class="dt-splash-name">DriveTiles</span>
      <span class="dt-splash-tag">Loading your tiles…</span>
    </div>
  </div>
</div>
