<!-- S02 — Onboarding Welcome: the core promise. Hero car display +
     widget tiles, one primary CTA, quiet secondary. Page 1 of 3. -->
<div class="screen">
  <div class="body" style="padding: var(--s4) var(--s5); gap: var(--s4)">
    <div class="dt-hero-art row" style="justify-content: center">
      <img
        class="art"
        src="/images/dt-hero.svg"
        data-asset="OnboardingHero"
        width="300"
        height="300"
        alt="Car display with two DriveTiles widgets"
      />
    </div>
    <div class="col" style="gap: var(--s2); align-items: center">
      <span class="dt-onb-title">Your drive. Your glance.</span>
      <span class="dt-onb-copy">Widgets your car can actually show — built on your iPhone in minutes.</span>
    </div>
    <div class="spacer"></div>
    <div class="dots" aria-label="Page 1 of 3">
      <span class="dot is-active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="col" style="gap: var(--s2)">
      <button class="dt-cta is-primary">Create my first widget</button>
      <button class="dt-cta is-quiet">Maybe later</button>
    </div>
  </div>
</div>
