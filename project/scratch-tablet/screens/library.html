<!-- pc {"title":"Thư viện","deviceId":"ipad-11"} -->
<div class="screen" style="background-color: var(--bg); flex-direction: row">
  <div class="sidebar" style="padding: var(--s4) var(--s3)">
    <div class="sidebar-head">Thư viện</div>
    <button class="sidebar-item is-active" aria-current="page" aria-label="Sách nói">
      <span class="icon icon-sm" data-symbol="book"></span>
      <span>Sách nói</span>
    </button>
    <button class="sidebar-item" aria-label="Đã tải về">
      <span class="icon icon-sm" data-symbol="download"></span>
      <span>Đã tải về</span>
    </button>
    <button class="sidebar-item" aria-label="Yêu thích">
      <span class="icon icon-sm" data-symbol="heart"></span>
      <span>Yêu thích</span>
    </button>
    <button class="sidebar-item" aria-label="Lịch sử nghe">
      <span class="icon icon-sm" data-symbol="clock"></span>
      <span>Lịch sử nghe</span>
    </button>
    <button class="sidebar-item" aria-label="Cài đặt">
      <span class="icon icon-sm" data-symbol="gear"></span>
      <span>Cài đặt</span>
    </button>
  </div>
  <div class="col" style="flex: 1 1 auto; min-width: 0; gap: 0">
    <div class="t-title2" style="padding: var(--s4) var(--s4) var(--s2)">Sách nói</div>
    <div class="split" style="flex: 1 1 auto; min-height: 0; padding: 0 var(--s4) var(--s4); gap: var(--s4)">
      <div class="pane-lead paper-card" style="gap: var(--s2)">
        <div class="row" style="gap: var(--s3); align-items: center">
          <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
            <span class="icon icon-sm" data-symbol="book"></span>
          </span>
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Nhà giả kim</div>
            <div class="t-subhead t-secondary">còn 2 giờ 14 phút</div>
          </div>
        </div>
        <div class="row" style="gap: var(--s3); align-items: center">
          <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
            <span class="icon icon-sm" data-symbol="book"></span>
          </span>
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Đắc nhân tâm</div>
            <div class="t-subhead t-secondary">còn 5 giờ 40 phút</div>
          </div>
        </div>
        <div class="row" style="gap: var(--s3); align-items: center">
          <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
            <span class="icon icon-sm" data-symbol="microphone"></span>
          </span>
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Hiểu về trái tim</div>
            <div class="t-subhead t-secondary">xong · nghe lại</div>
          </div>
        </div>
      </div>
      <div class="pane-trail paper-card" style="gap: var(--s2); align-items: center; justify-content: center">
        <div class="t-title3">Chọn một cuốn bên trái</div>
        <div class="t-subhead t-secondary">Chi tiết và nút nghe hiện ở đây.</div>
        <button class="btn btn-primary">Nghe tiếp Nhà giả kim</button>
      </div>
    </div>
  </div>
</div>
