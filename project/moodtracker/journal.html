<div class="screen">
  <div class="body mt-body">
    <div class="row" style="justify-content: space-between">
      <span class="mt-h1">Journal</span>
      <button class="mt-round" aria-label="New entry">
        <span class="icon icon-sm" data-symbol="pencil"></span>
      </button>
    </div>

    <div class="searchbar">
      <span class="icon icon-sm" data-symbol="magnifyingglass"></span>
      <span>Search entries…</span>
    </div>

    <div class="col" style="gap: var(--s3)">
      <span class="mt-section-title">This week</span>
      <div class="row" style="gap: var(--s2)">
        <div class="face-cell">
          <img class="art" src="/images/mood-bad.svg" data-asset="MoodBad" width="40" height="40" alt="Low" />
          <span class="t-caption t-secondary">Mon</span>
        </div>
        <div class="face-cell">
          <img class="art" src="/images/mood-okay.svg" data-asset="MoodOkay" width="40" height="40" alt="Okay" />
          <span class="t-caption t-secondary">Tue</span>
        </div>
        <div class="face-cell">
          <img class="art" src="/images/mood-good.svg" data-asset="MoodGood" width="40" height="40" alt="Good" />
          <span class="t-caption t-secondary">Wed</span>
        </div>
        <div class="face-cell">
          <img class="art" src="/images/mood-good.svg" data-asset="MoodGood" width="40" height="40" alt="Good" />
          <span class="t-caption t-secondary">Thu</span>
        </div>
        <div class="face-cell">
          <img class="art" src="/images/mood-great.svg" data-asset="MoodGreat" width="40" height="40" alt="Great" />
          <span class="t-caption t-secondary">Fri</span>
        </div>
        <div class="face-cell">
          <img class="art" src="/images/mood-awful.svg" data-asset="MoodAwful" width="40" height="40" alt="Awful" />
          <span class="t-caption t-secondary">Sat</span>
        </div>
        <div class="face-cell">
          <img class="art" src="/images/mood-good.svg" data-asset="MoodGood" width="40" height="40" alt="Good" />
          <span class="t-caption t-secondary">Sun</span>
        </div>
      </div>
    </div>

    <div class="row" style="gap: var(--s2)">
      <span class="chip is-active">All</span>
      <span class="chip">Good</span>
      <span class="chip">Okay</span>
      <span class="chip">Low</span>
    </div>

    <div class="mt-group">
      <div class="mt-group-row mt-entry">
        <span class="mood-dot is-4"></span>
        <div class="col grow" style="gap: var(--s2)">
          <div class="row" style="justify-content: space-between">
            <span class="mt-card-title">Today · Good</span>
                      </div>
          <span class="mt-entry-text">Shipped the launch video, energy held up.</span>
          <div class="row">
            <span class="mt-entry-when">Wed, 22 Jan</span>
            <span class="chip">Work</span>
          </div>
        </div>
      </div>

      <div class="mt-group-row mt-entry">
        <span class="mood-dot is-3"></span>
        <div class="col grow" style="gap: var(--s2)">
          <div class="row" style="justify-content: space-between">
            <span class="mt-card-title">Yesterday · Okay</span>
                      </div>
          <span class="mt-entry-text">Slow morning, a walk fixed the afternoon.</span>
          <div class="row">
            <span class="mt-entry-when">Tue, 21 Jan</span>
            <span class="chip">Health</span>
          </div>
        </div>
      </div>

      <div class="mt-group-row mt-entry">
        <span class="mood-dot is-2"></span>
        <div class="col grow" style="gap: var(--s2)">
          <div class="row" style="justify-content: space-between">
            <span class="mt-card-title">Monday · Low</span>
                      </div>
          <span class="mt-entry-text">Skipped lunch, crashed at 3pm.</span>
          <div class="row">
            <span class="mt-entry-when">Mon, 20 Jan</span>
            <span class="chip">Reflection</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-tabdock">
    <nav class="mt-tabbar" role="tablist" aria-label="Sections">
      <button class="mt-tab" role="tab" aria-selected="false">
        <span class="icon icon-sm" data-symbol="house"></span>
        Today
      </button>
      <button class="mt-tab is-active" role="tab" aria-selected="true">
        <span class="icon icon-sm" data-symbol="bubble.left"></span>
        Journal
      </button>
      <button class="mt-tab" role="tab" aria-selected="false">
        <span class="icon icon-sm" data-symbol="chart.bar"></span>
        Insights
      </button>
      <button class="mt-tab" role="tab" aria-selected="false">
        <span class="icon icon-sm" data-symbol="person"></span>
        Profile
      </button>
    </nav>
  </div>
</div>
