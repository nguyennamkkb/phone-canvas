<!-- pc {"title":"Settings"} -->
<div class="screen" data-tab-active="settings" style="background-color: var(--bg); background-image: radial-gradient(circle 110px at 335px 70px, var(--peach-deep) 0%, var(--peach-deep) 55%, transparent 100%); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed">
  <div class="body">
    <!-- identity strip: goal plus plan status orient the visit (EI-008) -->
    <div class="mt-hero">
      <div class="t-page">Settings</div>
      <div class="mt-card">
        <div class="row" style="gap: var(--s3)">
          <span class="icon icon-sm" data-symbol="flame" style="color: var(--accent)"></span>
          <div class="grow col" style="gap: 0">
            <div class="t-caption" style="color: var(--label-2)">Daily goal</div>
            <div class="t-headline">Walk 10 minutes</div>
          </div>
        </div>
        <button class="mt-rowline is-last" style="min-height: var(--touch-min)">
          <span class="icon icon-sm" data-symbol="crown" style="color: var(--amber)"></span>
          <span class="grow t-body">MoodTracker Plus</span>
          <span class="t-caption" style="color: var(--label-2)">Free</span>
          <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
        </button>
      </div>
    </div>

    <div class="mt-sheet">
      <!-- preference rows: values summarized, editing delegates (FS-034 §3.2) -->
      <div class="mt-card">
        <div class="t-headline">Preferences</div>
        <div class="mt-rows">
          <button class="mt-rowline">
            <span class="icon icon-sm" data-symbol="bell" style="color: var(--accent)"></span>
            <span class="grow t-body">Reminders</span>
            <span class="t-caption" style="color: var(--label-2)">9:00 PM</span>
            <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
          </button>
          <button class="mt-rowline">
            <span class="icon icon-sm" data-symbol="lock" style="color: var(--accent)"></span>
            <span class="grow t-body">Privacy &amp; data</span>
            <span class="t-caption" style="color: var(--label-2)">On-device · iCloud</span>
            <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
          </button>
          <button class="mt-rowline is-last">
            <span class="icon icon-sm" data-symbol="tag" style="color: var(--accent)"></span>
            <span class="grow t-body">Tags</span>
            <span class="t-caption" style="color: var(--label-2)">12 tags</span>
            <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
          </button>
        </div>
      </div>

      <!-- support rows: rare moments, out of the daily path -->
      <div class="mt-card">
        <div class="t-headline">Support</div>
        <div class="mt-rows">
          <button class="mt-rowline">
            <span class="icon icon-sm" data-symbol="star" style="color: var(--accent)"></span>
            <span class="grow t-body">Rate MoodTracker</span>
            <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
          </button>
          <button class="mt-rowline">
            <span class="icon icon-sm" data-symbol="questionmark.circle" style="color: var(--accent)"></span>
            <span class="grow t-body">Help &amp; contact</span>
            <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
          </button>
          <button class="mt-rowline is-last">
            <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath" style="color: var(--accent)"></span>
            <span class="grow t-body">Replay tour</span>
            <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--label-2)"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- @component app-tabs -->
</div>
