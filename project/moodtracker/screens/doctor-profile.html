<!-- pc {"title":"Doctor Profile"} -->
<div class="screen" data-tab-active="profile" style="background-color: var(--bg); background-image: radial-gradient(circle 110px at 335px 70px, var(--peach-deep) 0%, var(--peach-deep) 55%, transparent 100%); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed">
  <div class="body">
    <div class="mt-sheet" style="border-radius: 32px 32px 0 0; padding-top: var(--s8)">
      <!-- Avatar overlapping top edge -->
      <div class="row" style="justify-content: center; margin-top: calc(-1 * var(--s8) - 56px)">
        <img class="art" src="/project/moodtracker/assets/mascot-avatar.svg" data-asset="MascotAvatar" width="112" height="112" alt="Dr Kalm Ness avatar" />
      </div>

      <div class="col" style="gap: var(--s2); align-items: center; text-align: center">
        <div class="t-page">Dr Kalm Ness</div>
        <div class="row" style="gap: var(--s1); align-items: center">
          <span class="icon icon-sm" data-symbol="star.fill" style="color: var(--amber)"></span>
          <span class="t-subhead" style="color: var(--label-2)">4.9 (24 ulasan)</span>
        </div>
      </div>

      <!-- Stats row -->
      <div class="row" style="gap: var(--s3); padding: var(--s4) 0">
        <div class="grow col" style="gap: 0; align-items: center">
          <div class="t-headline">4 Years</div>
          <div class="t-caption" style="color: var(--label-2)">Experience</div>
        </div>
        <div style="width: 1px; background: var(--divider)"></div>
        <div class="grow col" style="gap: 0; align-items: center">
          <div class="t-headline">$50.00</div>
          <div class="t-caption" style="color: var(--label-2)">/Hour</div>
        </div>
        <div style="width: 1px; background: var(--divider)"></div>
        <div class="grow col" style="gap: 0; align-items: center">
          <div class="t-headline">40</div>
          <div class="t-caption" style="color: var(--label-2)">Konsultasi</div>
        </div>
      </div>

      <!-- Profil Singkat -->
      <div class="col" style="gap: var(--s3)">
        <div class="row" style="gap: var(--s2); align-items: center">
          <span class="icon icon-sm" data-symbol="person.text.rectangle" style="color: var(--accent)"></span>
          <div class="t-headline">Profil Singkat</div>
        </div>
        <p class="t-body" style="color: var(--label-2)">Dr. Kalm Ness is a highly respected and experienced psychologist, known for his calm and empathetic approach to mental health care.</p>
      </div>

      <!-- Chat Session -->
      <div class="mt-card">
        <div class="row" style="gap: var(--s3); align-items: center">
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Chat Session</div>
            <div class="t-caption" style="color: var(--label-2)">$50.00 / Hour</div>
          </div>
          <button class="icon icon-sm" data-symbol="bubble.left" style="color: var(--accent); min-width: var(--touch-min); min-height: var(--touch-min); border: 0; background: var(--coral-soft); border-radius: var(--r-full); cursor: pointer" aria-label="Chat session"></button>
        </div>
      </div>

      <!-- Video Call Session -->
      <div class="mt-card">
        <div class="row" style="gap: var(--s3); align-items: center">
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Video Call Session</div>
            <div class="t-caption" style="color: var(--label-2)">$50.00 / Hour</div>
          </div>
          <button class="icon icon-sm" data-symbol="video" style="color: var(--accent); min-width: var(--touch-min); min-height: var(--touch-min); border: 0; background: var(--coral-soft); border-radius: var(--r-full); cursor: pointer" aria-label="Video call"></button>
        </div>
      </div>

      <!-- Booking CTA -->
      <button class="mt-stone" style="background: var(--amber-cta); min-height: 56px">Booking Konsultasi</button>
    </div>
  </div>

  <!-- @component app-tabs -->
</div>
