<!-- pc {"title":"Onboarding"} -->
<div class="screen" style="background-color: var(--bg); background-image: radial-gradient(circle 110px at 60px 60px, var(--peach-deep) 0%, var(--peach-deep) 55%, transparent 100%); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed">
  <div class="body-fixed" style="padding-top: var(--s4); padding-bottom: var(--s4)">
    <div class="art-block" style="height: 300px; margin-bottom: var(--s4)">
      <img class="art" src="/project/moodtracker/assets/mascot-onboarding.svg" data-asset="MascotOnboarding" width="260" height="260" alt="Mascot with lightbulb" />
    </div>

    <div class="mt-sheet" style="border-radius: 32px 32px 0 0; padding: var(--s5) var(--s5) var(--s4)">
      <h1 class="t-display" style="color: var(--label)">Find clarity with insightful psychology</h1>
      <p class="t-subhead" style="color: var(--label-2)">Understand yourself more deeply with insights from psychologists</p>

      <div class="spacer" style="min-height: var(--s4)"></div>

      <div class="row" style="justify-content: space-between; align-items: center">
        <div class="dots">
          <i class="dot is-filled"></i><i class="dot"></i><i class="dot"></i>
        </div>
        <div class="row" style="gap: var(--s2)">
          <button class="t-subhead" style="min-height: var(--touch-min); padding: 0 var(--s4); border: 0; border-radius: var(--r-full); background: var(--coral-soft); color: var(--accent); font: inherit; cursor: pointer; flex: 0 0 auto">Skip</button>
          <button class="mt-stone" style="min-height: 56px; padding: 0 var(--s6); width: auto; flex: 0 0 auto">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>
