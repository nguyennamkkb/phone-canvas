<!-- pc {"title":"Player"} -->
<!-- FS-012 Player — Full. Expanded FROM the Now Playing bar (FS-011) or pushed
     FROM the reader's Listen segment — never from a tab, because this app has
     no tab bar (Overview.md §2 D6). So it owes a back affordance and
     `chevron.left` is the honest one: dismissing returns to FS-005 with
     playback CONTINUING, never stopping (FS-012 §2).

     Hierarchy follows FS-012 §8 exactly, and its Counter Hypothesis is the
     thing being refused: the TRANSPORT is the IMMEDIATE element and the only
     thing that gets the primary plane. The passage identity is CONTEXTUAL —
     a user who opened the expanded player tapped something to get here; they
     are configuring an ongoing recitation, not admiring a title card. So the
     identity sits on the ambient plane and the transport carries the weight.

     NO ARCH. EI-004 rations the mihrab to the verse-aligned translation on
     FS-006 alone. Every plane below is a plain `nr-card` / `nr-setting`.

     Origin rendered here is `player` with `isPlaying` true and a drill
     engaged — the values match the sibling screens so the domain reads as one
     session: speed 0.75× (FS-015's rendered tier), drill 1:1–1:7 × 5
     (FS-014's rendered drill), queue EMPTY (FS-012 §5 `queue_empty` — the
     next control is disabled and the queue row names the reason in place,
     acceptance #5). Timer is off: an absent timer is a value, not a gap, so
     the row says "Off" rather than hiding.

     Band: `.body-fixed` + identity pinned above the scroller + transport
     pinned below. The identity does NOT scroll away (FS-012 §3.1 — losing
     sight of what is loaded while reconfiguring it invites changing the
     wrong thing), and the five rows scroll between identity and transport
     (FS-012 §3.3). Output route sits directly above transport (§3.4).

     Every row states its CURRENT VALUE (F10 trust surface) and opens its own
     context — four configurations are never collapsed into one sheet
     (FS-012 §3.3 grouping justification). State is never colour-alone: the
     engaged repeat pairs brass text with the filled `is-on` plane + a glyph;
     the disabled next pairs dimming with `disabled` + an aria-label that says
     why. -->
<div class="screen" style="background-color: var(--bg)">
  <button data-slot="back" class="nr-icon-btn" aria-label="Back to the reader, playback continues">
    <span class="icon icon-sm" data-symbol="chevron.left"></span>
  </button>
  <span data-slot="title" class="nav-title">Player</span>

  <div class="body-fixed" style="gap: var(--s3); padding: var(--s2) var(--s5) calc(var(--s5) + var(--safe-bottom))">
    <!-- IDENTITY REGION — CONTEXTUAL (FS-012 §8). Pinned, never scrolls.
         Tapping it opens FS-013 to CHANGE the reciter — a change of identity,
         not a display area — so the whole region is one 44pt+ target with a
         single intent (FS-012 §3.1). The cover is PROJECT-DRAWN
         (cover-reciter.svg), reused from the reader's Now Playing bar at the
         large size so the domain reads as one session. -->
    <button class="nr-card is-quiet" style="width: 100%; padding: var(--s3) var(--s4); text-align: left" aria-label="Change reciter — now playing Mishary Rashid Alafasy, Al-Baqarah verse 255">
      <span class="row" style="gap: var(--s3); align-items: center">
        <img class="art nr-cover" src="/project/noor/assets/cover-reciter.svg" width="40" height="40" alt="" data-asset="CoverReciter" />
        <span class="grow col" style="gap: 0">
          <span class="nr-eyebrow">Now playing</span>
          <span class="nr-row-title">Al-Baqarah · 2:255</span>
          <span class="nr-row-sub">Mishary Rashid Alafasy</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--label-3)"></span>
      </span>
    </button>

    <!-- The one scroller: four settings rows + output route, in FS-012 §8
         order — Repeat (CONTEXTUAL, the setting most likely changed mid-
         session) first, then Speed, Timer, Queue, Output (all SECONDARY).
         Each row is a full-width `.nr-setting` with its own aria-label, so no
         two rows share a label (a11y §6). Values reuse the sibling screens'
         rendered state verbatim. -->
    <div class="col nr-scroll" style="gap: var(--s2)">
      <button class="nr-setting is-on" aria-label="Repeat — whole range 1:1 to 1:7, 5 times, no silence. Change repeat settings">
        <span class="icon icon-sm" data-symbol="repeat" style="color: var(--accent)"></span>
        <span class="grow col" style="gap: 0">
          <span class="nr-row-title">Repeat</span>
          <span class="nr-setting-val is-on">1:1–1:7 · 5 reps · 0 s gap</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--label-3)"></span>
      </button>

      <button class="nr-setting" aria-label="Speed — 0.75 times. Change playback speed">
        <span class="icon icon-sm" data-symbol="bolt.fill" style="color: var(--label-2)"></span>
        <span class="grow col" style="gap: 0">
          <span class="nr-row-title">Speed</span>
          <span class="nr-setting-val">0.75× — slow study</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--label-3)"></span>
      </button>

      <button class="nr-setting" aria-label="Sleep timer — off. Set a sleep timer">
        <span class="icon icon-sm" data-symbol="timer" style="color: var(--label-2)"></span>
        <span class="grow col" style="gap: 0">
          <span class="nr-row-title">Sleep timer</span>
          <span class="nr-setting-val">Off</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--label-3)"></span>
      </button>

      <button class="nr-setting" aria-label="Queue — nothing queued after this passage. Open the queue builder">
        <span class="icon icon-sm" data-symbol="list.bullet" style="color: var(--label-2)"></span>
        <span class="grow col" style="gap: 0">
          <span class="nr-row-title">Queue</span>
          <span class="nr-setting-val">Nothing queued after this</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--label-3)"></span>
      </button>

      <button class="nr-setting" aria-label="Output — iPhone speaker. Change audio output">
        <span class="icon icon-sm" data-symbol="speaker.wave.2" style="color: var(--label-2)"></span>
        <span class="grow col" style="gap: 0">
          <span class="nr-row-title">Output</span>
          <span class="nr-setting-val">iPhone speaker</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--label-3)"></span>
      </button>
    </div>

    <!-- TRANSPORT REGION — IMMEDIATE, pinned in the thumb zone (§3.2). The
         position readout is NOT a target: it reports, so it is inert text
         above a seek bar that IS tappable (COMP / SeekBar keeps its padded
         44pt row here, because this thumb scrubs). The 72pt primary is the
         screen's one primary action; prev/next are 44pt with 12pt gaps.
         Next is DISABLED with the reason in its own label — an unexplained
         dead control is exactly what FS-012 §7 forbids. -->
    <div class="col" style="gap: var(--s2)">
      <div class="row" style="gap: var(--s2)">
        <span class="nr-setting-val">0:42</span>
        <span class="nr-seek" style="flex: 1 1 auto; width: auto; min-width: 0; cursor: pointer" role="slider" aria-label="Position in passage — 42 seconds of 1 minute 34" aria-valuemin="0" aria-valuemax="94" aria-valuenow="42">
          <span class="nr-seek-track">
            <span class="nr-seek-fill" style="width: 45%"></span>
            <span class="nr-seek-thumb" style="left: 45%"></span>
          </span>
        </span>
        <span class="nr-setting-val">1:34</span>
      </div>

      <div class="row" style="gap: var(--s3); align-items: center; justify-content: center">
        <button class="nr-transport" aria-label="Previous verse">
          <span class="icon icon-sm" data-symbol="backward.fill"></span>
        </button>
        <button class="nr-transport is-lg" aria-label="Pause">
          <span class="icon icon-sm" data-symbol="pause.fill"></span>
        </button>
        <button class="nr-transport" disabled aria-label="Next verse — disabled, nothing is queued after this passage" style="color: var(--disabled)">
          <span class="icon icon-sm" data-symbol="forward.fill"></span>
        </button>
      </div>
    </div>
  </div>
</div>
