<!-- FS-027 Progress — Khatmah. Pushed from the reader's progress destination
     carrying the current position — never from a tab, because this app has no
     tab bar (Overview.md §2 D6). Back pops and WRITES NOTHING: progress is
     recorded by reading, not by visiting — a curious opener must not advance
     their own position (§2).

     Hierarchy follows FS-027 §8 exactly, and its Counter Hypothesis is the
     thing being doubly refused: the COMPLETION is IMMEDIATE (proportion +
     location, one pinned group), and there is NO STREAK and NO days-active
     counter anywhere on this screen. A streak renders absence as a broken
     count — the anxiety mechanic PRD §7.6 bars and EI-007 forbids — and the
     TODO line's "days-active" does not override the FS: §3 defines exactly
     four sections and none of them counts days. Leading with Continue would
     compound it by telling the user what to do before what they have done.

     Completion + current-juz are ONE pinned group (§3 grouping): a proportion
     without a location is abstract, a location without a proportion is a
     label. Both inert reports — tapping a number implies a destination that
     does not exist; continuing is the separate explicit control below (§3.1).
     The juz list scrolls beneath; completed rows keep the same 44pt target
     as incomplete ones so position never implies importance (§3.3). State is
     never colour-alone: complete pairs brass + checkmark glyph + the word.

     NO ARCH (EI-004 rations the mihrab to FS-006 alone). No card borders.

     Origin rendered: Juz 15, 43% read, at Al-Hijr 15:32. All 30 juz rows render — the list is the real object, not a sample; rows
     above the current juz read complete, below it unread. rows above the current juz read complete,
     below it read unread. Continue is CONTEXTUAL and thumb-zone pinned: the
     exit the report enables, never the subject.

     Band: `.body-fixed` + completion group pinned above the single `.body`
     scroller (§3.1: the figure never scrolls away). The juz list AND
     Continue live INSIDE that scroller, Continue as its final element —
     one honest deviation from §3.4's pinned control, stated here. Reason:
     a 30-row list plus a flex-pinned sibling overflows the 844pt frame by
     ~50pt through no fault of the content (measured: pinned Continue
     bottomed at 858pt on an 844pt frame while the scroller refused to
     yield its share). The pinned-scroller pattern only holds while the
     list fits; at 30 rows the control that must never overlap the final
     juz row is safest BEHIND it in the same scroll. It still clears the
     home indicator and still sits in the thumb zone when reached —
     surah-index (114 rows, nothing pinned) already reads this way. -->
