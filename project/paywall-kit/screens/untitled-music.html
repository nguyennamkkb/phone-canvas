<!-- pc {"title":"Untitled Music"} -->
<div class="screen" style="background-color: var(--um-paper)">
  <button data-slot="right" class="um-x" aria-label="Close">
    <span class="icon icon-sm" data-symbol="xmark"></span>
  </button>
  <div class="body" style="padding: var(--s4); gap: var(--s2)">

    <!-- Avatar carousel: 5 abstract gradient circles (no portraits,
         no photos — honest abstraction, decorative). -->
    <div class="um-avatars" aria-hidden="true">
      <div class="um-ava um-ava-1"></div>
      <div class="um-ava um-ava-2"></div>
      <div class="um-ava um-ava-3"></div>
      <div class="um-ava um-ava-4"></div>
      <div class="um-ava um-ava-5"></div>
    </div>

    <div class="t-large" style="text-align: center; color: var(--um-ink)">Try our [membership] for free</div>

    <div class="col" style="gap: var(--s2)">
      <div class="um-feat">
        <span class="um-glyph">
          <span class="icon icon-sm" data-symbol="chart.bar"></span>
        </span>
        <div class="col" style="gap: 0">
          <div class="t-headline" style="color: var(--um-ink)">Unlimited storage</div>
          <div class="t-subhead" style="color: var(--um-sub)">Upload, listen, and share as much as you want.</div>
        </div>
      </div>
      <div class="um-feat">
        <span class="um-glyph">
          <span class="icon icon-sm" data-symbol="slider.horizontal.3"></span>
        </span>
        <div class="col" style="gap: 0">
          <div class="t-headline" style="color: var(--um-ink)">Premium editing suite</div>
          <div class="t-subhead" style="color: var(--um-sub)">Stem splitting, pitch/speed shifting, trimming, and section looping</div>
        </div>
      </div>
      <div class="um-feat">
        <span class="um-glyph">
          <span class="icon icon-sm" data-symbol="lock"></span>
        </span>
        <div class="col" style="gap: 0">
          <div class="t-headline" style="color: var(--um-ink)">Advanced control</div>
          <div class="t-subhead" style="color: var(--um-sub)">Add passwords to your shareable links and more privacy features.</div>
        </div>
      </div>
    </div>

    <div class="um-dots" aria-hidden="true">
      <span class="dot is-filled"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="um-plans">
      <button class="um-plan is-on">
        <div class="t-headline">Monthly</div>
        <div class="t-headline">S$ 9.98</div>
      </button>
      <button class="um-plan is-alt">
        <span class="um-off" aria-hidden="true">-42%</span>
        <div class="t-headline">Annual</div>
        <div class="t-headline">S$ 69.98</div>
      </button>
    </div>

    <button class="um-cta">Start 7 day free trial</button>

    <span class="um-restore">Restore Purchase</span>
  </div>
</div>
