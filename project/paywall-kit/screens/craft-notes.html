<!-- pc {"title":"Craft Notes","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--cn-blue); background-image: linear-gradient(180deg, var(--cn-blue) 0%, var(--cn-blue) 55%, var(--cn-sky) 100%); background-size: cover; background-position: center; background-repeat: no-repeat">
  <div class="body" style="padding: 0 var(--s4) var(--s4); gap: var(--s2)">
    <div class="row" style="gap: 0; padding-top: var(--s4)">
      <span class="cn-brand">
        <span class="cn-mark">
          <span class="icon icon-xs" data-symbol="square.grid.2x2"></span>
        </span>
        <span>craft</span>
      </span>
      <div class="spacer"></div>
      <button class="cn-x" aria-label="Close">
        <span class="icon icon-sm" data-symbol="xmark"></span>
      </button>
    </div>

    <div class="cn-dots" aria-hidden="true">
      <span class="dot is-active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="cn-title" style="text-align: center; color: var(--cn-paper); padding: 0 var(--s4)">Create notes and docs without limits</div>

    <!-- Fanned doc cards: single SVG art (tilt lives inside the asset, so
         the subset transform ban is respected). -->
    <img class="art" src="/images/craft-fan.svg" width="390" height="400" alt="Fanned doc cards" style="margin: 0 calc(-1 * var(--s4))" />

    <div class="cn-sheet col" style="gap: var(--s2)">
      <span class="cn-tag">Try Craft Plus</span>
      <div class="t-body" style="color: var(--cn-ink)">Start your 14-day free trial, cancel anytime.</div>
      <div class="col" style="gap: 0">
        <div class="cn-price">$129.98 billed annually</div>
        <div class="t-body" style="color: var(--cn-sub)">$10.83 / month</div>
      </div>
      <button class="cn-cta">Continue</button>
    </div>
  </div>
</div>
