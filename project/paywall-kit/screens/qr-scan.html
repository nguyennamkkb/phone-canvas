<!-- pc {"title":"QR Scanner"} -->
<div class="screen" style="background-color: var(--qs-paper)">
  <div class="body-fixed" style="padding: var(--s4); gap: var(--s2)">
    <div class="row" style="gap: 0">
      <span class="qs-link">Cancel</span>
      <div class="spacer"></div>
      <span class="qs-link">Restore</span>
    </div>

    <img class="art qs-hero" src="/images/qr-scan-hero.svg" width="340" height="300" alt="QRScanHero" />

    <div class="col" style="gap: 0">
      <div class="qs-headline qs-headline-blue">Continue</div>
      <div class="qs-headline">to Scan your QR Code</div>
    </div>

    <div class="col" style="gap: var(--s1)">
      <div class="qs-benefit">
        <span class="qs-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="col" style="gap: 0">
          <div class="t-headline" style="color: var(--qs-ink)">Endless Scans &amp; Export</div>
          <div class="t-footnote" style="color: var(--qs-sub)">Unlimited QR scanning and sharing</div>
        </div>
      </div>
      <div class="qs-benefit">
        <span class="qs-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="col" style="gap: 0">
          <div class="t-headline" style="color: var(--qs-ink)">3 days free, then $6.99 / week</div>
          <div class="t-footnote" style="color: var(--qs-sub)">Cancel anytime before</div>
        </div>
      </div>
      <div class="qs-benefit">
        <span class="qs-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="col" style="gap: 0">
          <div class="t-headline" style="color: var(--qs-ink)">Smart QR Scanner with AI</div>
          <div class="t-footnote" style="color: var(--qs-sub)">AI security checks for each QR scan</div>
        </div>
      </div>
    </div>

    <button class="qs-cta">Continue</button>

    <div class="row" style="gap: var(--s2); align-items: center; justify-content: center">
      <span class="qs-trust-check">
        <span class="icon icon-xs" data-symbol="checkmark"></span>
      </span>
      <span class="t-footnote" style="color: var(--qs-ink)">No Payment Now</span>
    </div>
  </div>
</div>
