<!-- pc {"title":"Trick or Treat 99% Off","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--cy-bg); background-image: url(/project/paywall-kit/assets/candy-night.png); background-size: cover; background-position: center; background-repeat: no-repeat">
  <button class="hw-x cy-x" data-slot="right" aria-label="Close">
    <span class="icon icon-xs" data-symbol="xmark"></span>
  </button>

  <div class="body-fixed" style="padding: 0 var(--s4) calc(var(--safe-bottom) + var(--s4)); gap: var(--s2)">
    <div class="col" style="gap: var(--s1); align-items: center">
      <img class="art" src="/project/paywall-kit/assets/candy-wordmark.png" width="206" height="122" alt="TrickOrTreatWordmark" />
      <div class="cy-sub">Unlock Premium Features</div>
    </div>

    <div class="row" style="gap: 0; justify-content: center">
      <img class="art" src="/project/paywall-kit/assets/candy-bucket.png" width="140" height="162" alt="TrickOrTreatBucket" />
    </div>

    <div class="col" style="gap: 0; padding-top: var(--s5)">
      <div class="cy-price">Only <span class="cy-accent">$0.99</span> for the first week</div>
      <div class="cy-price-sm">then <span class="cy-accent">$24.99</span>/week</div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center; padding-top: var(--s5)">
      <div class="cy-offer">Offer ends in</div>
      <div class="row" style="gap: 0; justify-content: center">
        <div class="cy-cell">
          <div class="cy-num">02</div>
          <div class="cy-cap">hours</div>
        </div>
        <div class="cy-colon">:</div>
        <div class="cy-cell">
          <div class="cy-num">14</div>
          <div class="cy-cap">minutes</div>
        </div>
        <div class="cy-colon">:</div>
        <div class="cy-cell">
          <div class="cy-num">59</div>
          <div class="cy-cap">seconds</div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s1)">
      <button class="cy-cta">Claim Limited Offer</button>
      <div class="cy-legal">The subscription renews automatically till you turn it off.</div>
      <div class="cy-legal">Please see our <b>Privacy Policy</b> and <b>EULA</b></div>
    </div>
  </div>
</div>
