<!-- pc {"title":"Duolingo Compare","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--dl-deep); background-image: linear-gradient(180deg, var(--dl-navy) 0%, var(--dl-mid) 55%, var(--dl-plum) 100%); background-size: cover; background-position: center; background-repeat: no-repeat">
  <div class="body" style="padding: 0; gap: 0">
    <div class="col" style="gap: var(--s2); align-items: center; padding: var(--s6) var(--s4) 60px">
      <div class="dl-headline" style="text-align: center">Super learners are <span class="dl-green">4.2x</span> more likely to finish the French course!</div>
    </div>

    <!-- White compare sheet, full-bleed. Owl straddles the sheet top edge
         as first sheet element with negative top margin (declared). -->
    <div class="dm-sheet col" style="gap: var(--s3); margin: 0 calc(-1 * var(--s4)) calc(-1 * var(--s4))">
      <div class="row" style="gap: 0; justify-content: center">
        <img class="art dm-owl" src="/images/duo-owl.svg" width="140" height="154" alt="DuoOwl" />
      </div>

      <div class="dm-table">
        <div class="dm-trow">
          <div class="dm-tlabel"></div>
          <div class="dm-tcell"><span class="dm-freecap">FREE</span></div>
          <div class="dm-tcell is-super is-first"><span class="dm-superpill">SUPER</span></div>
        </div>
        <div class="dm-trow">
          <div class="dm-tlabel"><span class="t-body" style="color: var(--dm-ink)">Learning content</span></div>
          <div class="dm-tcell"><span class="icon icon-sm dm-check-free" data-symbol="checkmark"></span></div>
          <div class="dm-tcell is-super"><span class="icon icon-sm dm-check-super" data-symbol="checkmark"></span></div>
        </div>
        <div class="dm-trow">
          <div class="dm-tlabel"><span class="t-body" style="color: var(--dm-ink)">Unlimited Hearts</span></div>
          <div class="dm-tcell"><span class="t-headline dm-dash">–</span></div>
          <div class="dm-tcell is-super"><span class="icon icon-sm dm-check-super" data-symbol="checkmark"></span></div>
        </div>
        <div class="dm-trow">
          <div class="dm-tlabel"><span class="t-body" style="color: var(--dm-ink)">No ads</span></div>
          <div class="dm-tcell"><span class="t-headline dm-dash">–</span></div>
          <div class="dm-tcell is-super"><span class="icon icon-sm dm-check-super" data-symbol="checkmark"></span></div>
        </div>
        <div class="dm-trow">
          <div class="dm-tlabel"><span class="t-body" style="color: var(--dm-ink)">Skills practice</span></div>
          <div class="dm-tcell"><span class="t-headline dm-dash">–</span></div>
          <div class="dm-tcell is-super"><span class="icon icon-sm dm-check-super" data-symbol="checkmark"></span></div>
        </div>
        <div class="dm-trow">
          <div class="dm-tlabel"><span class="t-body" style="color: var(--dm-ink)">Mistakes review</span></div>
          <div class="dm-tcell"><span class="t-headline dm-dash">–</span></div>
          <div class="dm-tcell is-super"><span class="icon icon-sm dm-check-super" data-symbol="checkmark"></span></div>
        </div>
        <div class="dm-trow">
          <div class="dm-tlabel"><span class="t-body" style="color: var(--dm-ink)">Free challenge entry</span></div>
          <div class="dm-tcell"><span class="t-headline dm-dash">–</span></div>
          <div class="dm-tcell is-super is-last"><span class="icon icon-sm dm-check-super" data-symbol="checkmark"></span></div>
        </div>
      </div>

      <button class="dm-cta">START MY FREE WEEK</button>

      <span class="dm-no">NO THANKS</span>
    </div>
  </div>
</div>
