<!-- pc {"title":"Ahead Pro","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--am-bg)">
  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <img class="art am-hero" src="/images/ahead-blob.svg" width="340" height="180" alt="AheadBlob" />

    <div class="am-title" style="text-align: center">Become a better manager with Ahead Pro!</div>

    <div class="col" style="gap: var(--s3)">
      <div class="am-row">
        <span class="am-tile is-lilac">
          <span class="icon icon-sm" data-symbol="clock"></span>
        </span>
        <div class="t-headline" style="color: var(--am-ink)">Step-by-step personalized learning plan</div>
      </div>
      <div class="am-row">
        <span class="am-tile is-green">
          <span class="icon icon-sm" data-symbol="face.smiling"></span>
        </span>
        <div class="t-headline" style="color: var(--am-ink)">5 min daily activities</div>
      </div>
      <div class="am-row">
        <span class="am-tile is-gold">
          <span class="icon icon-sm" data-symbol="sparkles"></span>
        </span>
        <div class="t-headline" style="color: var(--am-ink)">200k+ lives of people like you changed</div>
      </div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center">
      <div class="row" style="gap: var(--s3); align-items: center; justify-content: center">
        <span class="icon icon-lg am-laurel" data-symbol="sparkles"></span>
        <div class="col" style="gap: 0; align-items: center">
          <div class="t-headline" style="color: var(--am-ink)">APP OF THE DAY</div>
          <div class="t-subhead" style="color: var(--am-mute)">+20 COUNTRIES</div>
        </div>
        <span class="icon icon-lg am-laurel" data-symbol="sparkles"></span>
      </div>
      <div class="row" style="gap: var(--s1); align-items: center; justify-content: center">
        <span class="icon icon-sm am-star" data-symbol="star"></span>
        <span class="icon icon-sm am-star" data-symbol="star"></span>
        <span class="icon icon-sm am-star" data-symbol="star"></span>
        <span class="icon icon-sm am-star" data-symbol="star"></span>
        <span class="icon icon-sm am-star" data-symbol="star"></span>
        <span class="t-headline" style="color: var(--am-ink)">2K+ REVIEWS</span>
      </div>
    </div>

    <div class="row" style="gap: var(--s2); align-items: center; justify-content: center">
      <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath" style="color: var(--am-ink)"></span>
      <span class="t-headline" style="color: var(--am-ink)">Restore purchases</span>
    </div>

    <div class="spacer"></div>

    <button class="am-cta">Continue</button>
  </div>
</div>
