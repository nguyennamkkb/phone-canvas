<!-- pc {"title":"Midnight Brew 99% Off","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--po-bg); background-image: url(/project/paywall-kit/assets/potion-night.png); background-size: cover; background-position: center; background-repeat: no-repeat">
  <button class="hw-x po-x" data-slot="right" aria-label="Close">
    <span class="icon icon-xs" data-symbol="xmark"></span>
  </button>

  <div class="body-fixed" style="padding: 0 var(--s4) calc(var(--safe-bottom) + var(--s4)); gap: var(--s2)">
    <div class="col" style="gap: var(--s1); align-items: center">
      <img class="art" src="/project/paywall-kit/assets/potion-wordmark.png" width="210" height="114" alt="MidnightBrewWordmark" />
      <div class="po-sub">Unlock Premium Features</div>
    </div>

    <div class="row" style="gap: 0; justify-content: center">
      <img class="art" src="/project/paywall-kit/assets/potion-flask.png" width="132" height="176" alt="MidnightBrewFlask" />
    </div>

    <div class="col" style="gap: 0; padding-top: var(--s5)">
      <div class="po-price">Only <span class="po-accent">$0.99</span> for the first week</div>
      <div class="po-price-sm">then <span class="po-accent">$24.99</span>/week</div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center; padding-top: var(--s5)">
      <div class="po-offer">Offer ends in</div>
      <div class="row" style="gap: 0; justify-content: center">
        <div class="po-cell">
          <div class="po-num">02</div>
          <div class="po-cap">hours</div>
        </div>
        <div class="po-colon">:</div>
        <div class="po-cell">
          <div class="po-num">14</div>
          <div class="po-cap">minutes</div>
        </div>
        <div class="po-colon">:</div>
        <div class="po-cell">
          <div class="po-num">59</div>
          <div class="po-cap">seconds</div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s1)">
      <button class="po-cta">Claim Limited Offer</button>
      <div class="po-legal">The subscription renews automatically till you turn it off.</div>
      <div class="po-legal">Please see our <b>Privacy Policy</b> and <b>EULA</b></div>
    </div>
  </div>
</div>
