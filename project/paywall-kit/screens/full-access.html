<!-- pc {"title":"Full Access"} -->
<div class="screen" style="background-color: var(--fa-paper)">
  <div class="body-fixed" style="padding: var(--s4); gap: var(--s4)">
    <div class="row" style="gap: 0">
      <button class="fa-x" aria-label="Close">
        <span class="icon icon-sm" data-symbol="xmark"></span>
      </button>
    </div>

    <div class="t-display" style="color: var(--fa-blue-ink); font-size: 40px; line-height: 44px">FULL ACCESS</div>

    <div class="col" style="gap: var(--s3)">
      <div class="fa-benefit">
        <span class="fa-check">
          <span class="icon icon-sm" data-symbol="checkmark"></span>
        </span>
        <div class="t-headline" style="color: var(--fa-blue-ink)">Unlock Screen Mirroring</div>
      </div>
      <div class="fa-benefit">
        <span class="fa-check">
          <span class="icon icon-sm" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--fa-blue-ink)">Works with all TVs</div>
      </div>
      <div class="fa-benefit">
        <span class="fa-check">
          <span class="icon icon-sm" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--fa-blue-ink)">Zero Delay</div>
      </div>
      <div class="fa-benefit">
        <span class="fa-check">
          <span class="icon icon-sm" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--fa-blue-ink)">100% No Ads</div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s1); align-items: center">
      <div class="t-footnote" style="color: var(--fa-mute)">3-DAY FREE TRIAL, auto-renewal.</div>
      <div class="t-headline" style="color: var(--fa-blue-ink)">Then $6.99/week, cancel anytime.</div>
    </div>

    <div class="col" style="gap: var(--s2)">
      <button class="fa-cta">Start Free Trial</button>
      <button class="fa-plan is-yearly">
        <div class="t-headline">Yearly</div>
        <div class="spacer"></div>
        <div class="col" style="gap: 0; align-items: flex-end">
          <div class="t-headline">$29.99</div>
          <div class="t-caption" style="color: var(--fa-plan-sub)">Auto-renewal, cancel anytime.</div>
        </div>
      </button>
      <button class="fa-plan is-life">
        <div class="t-headline">Lifetime</div>
        <div class="spacer"></div>
        <div class="col" style="gap: 0; align-items: flex-end">
          <div class="t-headline">$34.99</div>
          <div class="t-caption" style="color: var(--fa-plan-sub)">Onetime payment</div>
        </div>
      </button>
    </div>

    <div class="row" style="gap: var(--s6); justify-content: center">
      <span class="fa-legal">Restore</span>
      <span class="fa-legal">Privacy Policy</span>
      <span class="fa-legal">Terms of Use</span>
    </div>
  </div>
</div>
