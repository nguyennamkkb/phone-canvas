<!-- pc {"title":"How Your Trial Works"} -->
<div class="screen" style="background-color: var(--hs-paper)">
  <div class="body" style="padding: 0; gap: 0">
    <div class="hs-top" style="gap: 0">
      <div class="row" style="gap: 0; justify-content: flex-end; padding: 0 var(--s4)">
        <button class="hs-x" aria-label="Close">
          <span class="icon icon-sm" data-symbol="xmark"></span>
        </button>
      </div>
      <div style="padding: 0 var(--s4)">
        <img class="art hs-hero" src="/images/headspace-sun.svg" width="390" height="220" alt="HeadspaceSun" />
      </div>
    </div>

    <div class="col" style="gap: var(--s3); padding: 0 var(--s4) var(--s4)">
      <div class="col" style="gap: var(--s2); align-items: center">
        <div class="hs-title" style="text-align: center">How your trial works</div>
        <div class="t-headline" style="color: var(--hs-sub); text-align: center">First 7 days free, then $12.99/month</div>
      </div>

      <div class="row" style="gap: 0; justify-content: center">
        <div class="hs-seg" role="tablist" aria-label="Billing period">
          <button class="hs-seg-opt" role="tab" aria-selected="false" tabindex="0">Annual</button>
          <button class="hs-seg-opt is-on" role="tab" aria-selected="true" tabindex="0">Monthly</button>
        </div>
      </div>

      <div class="col" style="gap: 0">
        <div class="row" style="gap: var(--s4); align-items: flex-start">
          <div class="col" style="gap: 0; align-items: center">
            <span class="hs-dot">
              <span class="icon icon-sm" data-symbol="lock"></span>
            </span>
            <div class="hs-rail"></div>
          </div>
          <div class="grow col" style="gap: var(--s1); padding-top: var(--s2)">
            <div class="t-headline" style="color: var(--hs-ink)">Today</div>
            <div class="t-body" style="color: var(--hs-sub)">Unlock our library of meditations, sleep sounds, and more.</div>
          </div>
        </div>
        <div class="row" style="gap: var(--s4); align-items: flex-start">
          <div class="col" style="gap: 0; align-items: center">
            <span class="hs-dot">
              <span class="icon icon-sm" data-symbol="bell"></span>
            </span>
            <div class="hs-rail"></div>
          </div>
          <div class="grow col" style="gap: var(--s1); padding-top: var(--s2)">
            <div class="t-headline" style="color: var(--hs-ink)">In 5 days</div>
            <div class="t-body" style="color: var(--hs-sub)">We'll send you a reminder that your trial is ending soon.</div>
          </div>
        </div>
        <div class="row" style="gap: var(--s4); align-items: flex-start">
          <div class="col" style="gap: 0; align-items: center">
            <span class="hs-dot">
              <span class="icon icon-sm" data-symbol="star"></span>
            </span>
          </div>
          <div class="grow col" style="gap: var(--s1); padding-top: var(--s2)">
            <div class="t-headline" style="color: var(--hs-ink)">In 7 days</div>
            <div class="t-body" style="color: var(--hs-sub)">You'll be charged on March 28, cancel anytime before.</div>
          </div>
        </div>
      </div>

      <div class="t-headline hs-restore" style="text-align: center">Restore Purchase</div>

      <button class="hs-cta">Start my free trial</button>
    </div>
  </div>
</div>
