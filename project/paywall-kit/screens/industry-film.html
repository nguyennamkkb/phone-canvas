<!-- pc {"title":"Industry Film","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--if-paper)">
  <div class="body-fixed" style="padding: var(--s4); gap: var(--s2)">
    <div class="row" style="gap: 0">
      <span class="if-skip">Skip</span>
    </div>

    <img class="art if-hero" src="/images/industry-film.svg" width="300" height="228" alt="IndustryFilm" />

    <div class="col" style="gap: var(--s2); align-items: center">
      <div class="t-title1" style="text-align: center; color: var(--if-ink)">Unlock Industry Pro</div>
      <div class="t-subhead" style="text-align: center; color: var(--if-sub)">Powerful tools for playback, breakdowns, collaboration, and more — built for real production workflows.</div>
    </div>

    <div class="col" style="gap: var(--s2); padding-top: var(--s4)">
      <button class="if-plan is-on">
        <span class="if-tag" aria-hidden="true">Save 44%</span>
        <div class="col" style="gap: 0; align-items: flex-start">
          <div class="t-headline">Industry Pro Yearly</div>
          <div class="t-subhead" style="color: var(--if-sub)">12 months for $99.99</div>
        </div>
        <div class="spacer"></div>
        <div class="t-headline">$8.33/mo</div>
      </button>
      <button class="if-plan">
        <div class="t-headline">Industry Pro Monthly</div>
        <div class="spacer"></div>
        <div class="t-headline">$14.99/mo</div>
      </button>
    </div>

    <div class="col" style="gap: var(--s1); align-items: center">
      <button class="if-cta">Try for $0.00</button>
      <div class="t-footnote" style="color: var(--if-sub)">Free for 14 days, cancel anytime.</div>
    </div>

    <span class="if-restore">Restore Purchases</span>
  </div>
</div>
