<!-- pc {"title":"One Cleaner"} -->
<div class="screen" style="background-color: var(--oc-paper)">
  <div class="body" style="padding: var(--s4); gap: var(--s3)">
    <div class="oc-top" style="gap: var(--s2)">
      <div class="col" style="gap: 0">
        <div class="row" style="gap: 0">
          <button class="oc-x" aria-label="Close">
            <span class="icon icon-sm" data-symbol="xmark"></span>
          </button>
        </div>
      </div>

      <div class="col" style="gap: var(--s2); align-items: center">
        <div class="oc-title" style="text-align: center">One Cleaner</div>
        <div class="t-title3" style="color: var(--oc-navy); text-align: center">Safely clean up your iPhone with one simple tap</div>
      </div>
    </div>

    <img class="art oc-icons" src="/images/one-cleaner-icons.svg" width="340" height="140" alt="OneCleanerIcons" />

    <div class="row" style="gap: 0">
      <span class="oc-caption" style="text-align: center">Photos</span>
      <span class="oc-caption" style="text-align: center">iCloud</span>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center">
      <div class="row oc-track" role="progressbar" aria-valuenow="48" aria-valuemin="0" aria-valuemax="100" aria-label="Storage used" style="gap: 0">
        <div class="oc-fill"></div>
        <div class="spacer"></div>
      </div>
      <div class="row" style="gap: var(--s2); justify-content: center">
        <span class="oc-storage">247GB / 512GB</span>
        <span class="oc-used">Used</span>
      </div>
    </div>

    <div class="oc-features" style="text-align: center">All Premium Cleaning Features</div>

    <div class="col" style="gap: var(--s1); align-items: center">
      <div class="t-title3" style="color: var(--oc-blue)">Start 3 Days Free Trial</div>
      <div class="t-subhead" style="color: var(--oc-sub); text-align: center">No Payment Now, Auto-renewable<br />Then $8.99/week. Easy to Cancel</div>
    </div>

    <button class="oc-cta">Continue</button>

    <div class="row" style="gap: var(--s3); justify-content: center">
      <span class="t-footnote oc-legal">Terms of Use</span>
      <span class="t-footnote oc-legal">Privacy Policy</span>
      <span class="t-footnote oc-legal">Restore purchases</span>
    </div>
  </div>
</div>
