<!-- pc {"title":"Cleaner Pro","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--cp-navy); background-image: linear-gradient(180deg, var(--cp-navy) 0%, var(--cp-indigo) 100%); background-size: cover; background-position: center; background-repeat: no-repeat">
  <div class="body-fixed" style="padding: var(--s4); gap: var(--s3)">
    <!-- Hero: composite graphic (CSS-positioned glyphs, zero assets). 3 nested
         squares + blue app icon (broom approximated by paintbrush glyph) +
         2 photo badges + 4 sparkles. Deviation declared in handback. -->
    <div class="cp-hero" aria-hidden="true">
      <div class="cp-nest cp-nest-1"></div>
      <div class="cp-nest cp-nest-2"></div>
      <div class="cp-nest cp-nest-3"></div>
      <span class="cp-app">
        <span class="icon icon-lg" data-symbol="paintbrush"></span>
      </span>
      <span class="cp-badge cp-badge-1">
        <span class="icon icon-sm" data-symbol="photo"></span>
      </span>
      <span class="cp-badge cp-badge-2">
        <span class="icon icon-sm" data-symbol="photo"></span>
      </span>
      <span class="icon cp-star cp-star-1" data-symbol="sparkles"></span>
      <span class="icon cp-star cp-star-2" data-symbol="sparkles"></span>
      <span class="icon cp-star cp-star-3" data-symbol="sparkles"></span>
      <span class="icon cp-star cp-star-4" data-symbol="sparkles"></span>
    </div>

    <div class="col" style="gap: 0; align-items: center">
      <div class="t-title2" style="color: var(--cp-ink)">Clean Up Your iPhone</div>
      <div class="t-title1" style="color: var(--cp-ink)">Fast &amp; Easy</div>
    </div>

    <div class="t-subhead" style="text-align: center; color: var(--cp-sub)">Get rid of junk, compress large videos, and clear contacts &amp; calendar. Ad-free.</div>

    <div class="col" style="gap: var(--s2); padding-top: var(--s4)">
      <button class="cp-plan is-on">
        <span class="cp-tag" aria-hidden="true">MOST POPULAR</span>
        <div class="col" style="gap: 0; align-items: flex-start">
          <div class="t-headline">Yearly</div>
        </div>
        <div class="spacer"></div>
        <div class="col" style="gap: 0; align-items: flex-end">
          <div class="t-headline">$34.99 per year</div>
          <div class="t-footnote" style="color: var(--cp-sub)">just $0.67/week</div>
        </div>
      </button>
      <button class="cp-plan">
        <div class="t-headline">Weekly</div>
        <div class="spacer"></div>
        <div class="col" style="gap: 0; align-items: flex-end">
          <div class="t-footnote" style="color: var(--cp-sub)">Free for 7 days</div>
          <div class="t-headline">then $6.99/week</div>
        </div>
      </button>
    </div>

    <div class="t-caption" style="text-align: center; color: var(--cp-sub)">Auto-renewable. Cancel anytime.</div>

    <div class="col" style="gap: var(--s2)">
      <button class="cp-cta">
        <span>Try for Free</span>
        <span class="icon icon-sm" data-symbol="chevron.right"></span>
      </button>
      <div class="cp-trust">
        <span class="icon icon-sm" data-symbol="shield.fill"></span>
        <span class="t-footnote" style="color: var(--cp-ink)">No payment now</span>
      </div>
    </div>

    <div class="row" style="gap: var(--s6); justify-content: center">
      <span class="cp-legal">Terms of Use</span>
      <span class="cp-legal">Privacy Policy</span>
      <span class="cp-legal">Restore</span>
    </div>
  </div>
</div>
