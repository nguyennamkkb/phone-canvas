<!-- pc {"title":"Premium Tools","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--ig-bg)">
  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="ig-top" style="gap: 0">
      <div class="row" style="gap: 0; justify-content: flex-end">
        <button class="ig-x" aria-label="Close">
          <span class="icon icon-sm" data-symbol="xmark"></span>
        </button>
      </div>
      <div class="ig-title">Premium tools for every kind of investor</div>
    </div>

    <!-- Hero: honest dashboard-collage simplification (declared): 2 overlapping
         dark cards with decorative green sparklines + gray/green text bars.
         No real data, no photo. -->
    <div class="ig-hero" aria-hidden="true">
      <div class="ig-dash ig-dash-back">
        <div class="ig-dash-head"></div>
        <div class="ig-trend" aria-hidden="true">
          <div class="ig-trend-bar" style="height: 30%"></div>
          <div class="ig-trend-bar" style="height: 45%"></div>
          <div class="ig-trend-bar" style="height: 38%"></div>
          <div class="ig-trend-bar" style="height: 60%"></div>
          <div class="ig-trend-bar" style="height: 52%"></div>
          <div class="ig-trend-bar" style="height: 75%"></div>
          <div class="ig-trend-bar" style="height: 64%"></div>
          <div class="ig-trend-bar" style="height: 90%"></div>
        </div>
        <div class="ig-bars">
          <div class="ig-bar" style="width: 82%"></div>
          <div class="ig-bar" style="width: 64%"></div>
          <div class="ig-bar ig-bar-green" style="width: 74%"></div>
          <div class="ig-bar" style="width: 52%"></div>
        </div>
      </div>
      <div class="ig-dash ig-dash-front">
        <div class="ig-dash-head"></div>
        <div class="ig-trend" aria-hidden="true">
          <div class="ig-trend-bar" style="height: 35%"></div>
          <div class="ig-trend-bar" style="height: 55%"></div>
          <div class="ig-trend-bar" style="height: 42%"></div>
          <div class="ig-trend-bar" style="height: 70%"></div>
          <div class="ig-trend-bar" style="height: 58%"></div>
          <div class="ig-trend-bar" style="height: 82%"></div>
          <div class="ig-trend-bar" style="height: 68%"></div>
          <div class="ig-trend-bar" style="height: 95%"></div>
        </div>
        <div class="ig-bars">
          <div class="ig-bar" style="width: 70%"></div>
          <div class="ig-bar ig-bar-green" style="width: 58%"></div>
          <div class="ig-bar" style="width: 78%"></div>
          <div class="ig-bar" style="width: 46%"></div>
        </div>
      </div>
    </div>

    <div class="ig-plan" style="text-align: center">Choose your plan</div>

    <div class="row" style="gap: var(--s4); align-items: center; justify-content: center">
      <div class="row" style="gap: var(--s2); align-items: center">
        <div class="ig-radio-hit" role="radio" aria-checked="false" aria-label="Monthly" tabindex="0">
          <div class="ig-radio" aria-hidden="true"></div>
        </div>
        <span class="t-headline" style="color: var(--ig-mute)">Monthly</span>
      </div>
      <div class="row" style="gap: var(--s2); align-items: center">
        <div class="ig-radio-hit is-on" role="radio" aria-checked="true" aria-label="Yearly" tabindex="0">
          <div class="ig-radio-dot" aria-hidden="true"></div>
        </div>
        <span class="t-headline" style="color: var(--ig-label)">Yearly</span>
      </div>
      <span class="t-headline" style="color: var(--ig-green)">20% off</span>
    </div>

    <div class="ig-gold">
      <span class="ig-tag">GOLD</span>
      <div class="ig-price">$39.95/mo</div>
      <div class="t-subhead" style="color: var(--ig-sub)">Billed $479.40 yearly — you save $120 a year</div>
      <button class="ig-cta">Start 7 day free trial</button>
    </div>

    <div class="col" style="gap: var(--s1); align-items: center">
      <div class="t-footnote" style="color: var(--ig-mute)">Auto-renewable. Cancel anytime.</div>
      <div class="row" style="gap: var(--s2); justify-content: center">
        <span class="t-footnote ig-legal">Restore</span>
        <span class="t-footnote" style="color: var(--ig-mute)">-</span>
        <span class="t-footnote ig-legal">Terms of Use</span>
        <span class="t-footnote" style="color: var(--ig-mute)">-</span>
        <span class="t-footnote ig-legal">Privacy Policy</span>
      </div>
    </div>
  </div>
</div>
