<!-- pc {"title":"Halloween 99% Off","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--hw-bg); background-image: url(/project/paywall-kit/assets/hw-night.jpg); background-size: cover; background-position: center; background-repeat: no-repeat">
  <button class="hw-x" data-slot="right" aria-label="Close">
    <span class="icon icon-xs" data-symbol="xmark"></span>
  </button>

  <div class="body-fixed" style="padding: 0 var(--s4) calc(var(--safe-bottom) + var(--s2)); gap: var(--s2)">
    <div class="col" style="gap: var(--s1); align-items: center">
      <img class="art" src="/project/paywall-kit/assets/hw-wordmark.png" width="244" height="79" alt="HalloweenWordmark" />
      <div class="hw-sub">Unlock Premium Features</div>
    </div>

    <div class="row" style="gap: 0; justify-content: center">
      <img class="art" src="/project/paywall-kit/assets/hw-ticket.png" width="326" height="187" alt="HalloweenTicket" />
    </div>

    <div class="col" style="gap: 0; padding-top: var(--s6)">
      <div class="hw-price">Only <span class="hw-accent">$0.99</span> for the first week</div>
      <div class="hw-price-sm">then <span class="hw-accent">$24.99</span>/week</div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center; padding-top: var(--s6)">
      <div class="hw-offer">Offer ends in</div>
      <div class="row" style="gap: 0; justify-content: center">
        <div class="hw-cell">
          <div class="hw-num">02</div>
          <div class="hw-cap">hours</div>
        </div>
        <div class="hw-colon">:</div>
        <div class="hw-cell">
          <div class="hw-num">14</div>
          <div class="hw-cap">minutes</div>
        </div>
        <div class="hw-colon">:</div>
        <div class="hw-cell">
          <div class="hw-num">59</div>
          <div class="hw-cap">seconds</div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s1)">
      <button class="hw-cta">Claim Limited Offer</button>
      <div class="hw-legal">The subscription renews automatically till you turn it off.</div>
      <div class="hw-legal">Please see our <b>Privacy Policy</b> and <b>EULA</b></div>
    </div>
  </div>
</div>
