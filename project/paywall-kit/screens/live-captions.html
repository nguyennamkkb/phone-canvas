<!-- pc {"title":"Live Captions"} -->
<div class="screen" style="background-color: var(--lc-paper)">
  <div class="body-fixed" style="padding: var(--s4); gap: var(--s2)">
    <div class="row" style="gap: 0; justify-content: flex-end">
      <button class="fa-x" aria-label="Close">
        <span class="icon icon-sm" data-symbol="xmark"></span>
      </button>
    </div>

    <!-- Hero: composite graphic (CSS-positioned glyphs, zero assets).
         Megaphone approximated by speaker glyph in orange + 2 mint bolts.
         Deviation from reference 3D art declared in handback. -->
    <div class="lc-hero" aria-hidden="true">
      <span class="icon lc-mega" data-symbol="speaker.wave.2"></span>
      <span class="icon lc-bolt lc-bolt-1" data-symbol="bolt.fill"></span>
      <span class="icon lc-bolt lc-bolt-2" data-symbol="bolt.fill"></span>
    </div>

    <div class="col" style="gap: 0">
      <div class="lc-headline">See speech in</div>
      <div class="lc-headline lc-headline-blue">real-time</div>
    </div>

    <div class="col" style="gap: var(--s1)">
      <div class="lc-benefit">
        <span class="lc-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="t-headline" style="color: var(--lc-ink)">3 Day Free Trial</div>
      </div>
      <div class="lc-benefit">
        <span class="lc-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--lc-ink)">Unlimited Basic Live Captions</div>
      </div>
      <div class="lc-benefit">
        <span class="lc-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--lc-ink)">10 Hours Pro Captions Per Month</div>
      </div>
      <div class="lc-benefit">
        <span class="lc-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--lc-ink)">Offline Transcription</div>
      </div>
      <div class="lc-benefit">
        <span class="lc-check">
          <span class="icon icon-xs" data-symbol="checkmark"></span>
        </span>
        <div class="t-body" style="color: var(--lc-ink)">Large Fonts w/ High Contrast</div>
      </div>
    </div>

    <div class="col" style="gap: 0; align-items: center">
      <div class="t-body" style="color: var(--lc-ink)">Try 3 days free, then $79.99/year</div>
      <div class="t-body" style="color: var(--lc-ink)">Cancel any time.</div>
    </div>

    <div class="col" style="gap: var(--s2)">
      <button class="lc-cta-primary">Try It Free</button>
      <button class="lc-cta-secondary">Subscribe Monthly - $9.99</button>
    </div>

    <div class="col" style="gap: var(--s2)">
      <div class="t-headline" style="color: var(--lc-ink)">Customers like...</div>
      <div class="row" style="gap: var(--s2); align-items: center">
        <span class="lc-chip">
          <span class="lc-mini">
            <span class="icon icon-xs" data-symbol="checkmark"></span>
          </span>
          <span class="t-subhead" style="color: var(--lc-ink)">Accuracy</span>
        </span>
        <span class="lc-chip">
          <span class="lc-mini">
            <span class="icon icon-xs" data-symbol="checkmark"></span>
          </span>
          <span class="t-subhead" style="color: var(--lc-ink)">Ease of use</span>
        </span>
      </div>
    </div>
  </div>
</div>
