<!-- pc {"title":"Free Trial Timeline","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--bg); background-image: linear-gradient(180deg, var(--pw-top) 0%, var(--pw-deep) 30%, var(--pw-mid) 52%, var(--pw-magenta) 74%, var(--pw-bot) 100%); background-size: cover; background-position: center; background-repeat: no-repeat">
  <div class="body" style="padding: var(--s4); gap: var(--s3)">
    <div class="col" style="gap: 0; align-items: center">
      <div class="pw-hero col" style="gap: 0; align-items: center">
        <img class="art pw-marquee" src="/project/paywall-kit/assets/marquee-super.svg" width="360" height="170" alt="MarqueeSuper" />
        <div class="col" style="gap: 0; align-items: center; margin-top: -90px">
          <div class="pw-word">PIC</div>
          <div class="pw-word">NIC</div>
        </div>
      </div>
    </div>

    <h1 class="t-title1" style="text-align: center">Start your 3-day FREE trial to continue.</h1>

    <div class="col" style="gap: 0">
      <!-- @component timeline-row -->
      <div class="row" style="gap: var(--s4); align-items: flex-start">
        <div class="col" style="gap: 0; align-items: center">
          <span class="pw-dot">
            <span class="icon icon-sm" data-symbol="bell"></span>
          </span>
          <div class="pw-rail-line"></div>
        </div>
        <div class="grow col" style="gap: var(--s1); padding-top: var(--s2)">
          <div class="t-headline">In 2 days</div>
          <div class="t-subhead" style="color: var(--label-2)">Continue enjoying the Premium Features</div>
        </div>
      </div>
      <div class="row" style="gap: var(--s4); align-items: flex-start">
        <div class="col" style="gap: 0; align-items: center">
          <span class="pw-dot">
            <span class="icon icon-sm" data-symbol="checkmark"></span>
          </span>
        </div>
        <div class="grow col" style="gap: var(--s1); padding-top: var(--s2)">
          <div class="t-headline">In 3 days</div>
          <div class="t-subhead" style="color: var(--label-2)">You will not be charged before. You can cancel earlier.</div>
        </div>
      </div>
    </div>

    <div class="t-headline" style="text-align: center">No payment due now</div>

    <div class="col" style="gap: var(--s2)">
      <!-- @component cta-pill -->
      <div class="t-subhead" style="text-align: center; color: var(--label-2)">3 days free, then 7,99 €/week</div>
    </div>
  </div>
</div>
