<!-- pc {"title":"Free Trial on Super","lightStatusBar":true} -->
<div class="screen" style="background-color: var(--dl-deep); background-image: linear-gradient(180deg, var(--dl-navy) 0%, var(--dl-mid) 55%, var(--dl-plum) 100%); background-size: cover; background-position: center; background-repeat: no-repeat">
  <div class="body" style="padding: 0; gap: 0">
    <div class="dl-top" style="gap: 0">
      <div class="row" style="gap: 0; align-items: center; padding: 0 var(--s4)">
        <button class="dl-x" aria-label="Close">
          <span class="icon" data-symbol="xmark"></span>
        </button>
        <div class="spacer"></div>
        <div class="dl-super" aria-hidden="true"><span>SUPER</span></div>
      </div>
      <div class="col" style="gap: var(--s6); align-items: center; padding: var(--s2) 0 0">
        <!-- Hero composite: frosted capsule + owl (white sticker halo baked
             into the svg) + sparkles. Capsule fades tube feel (no mask lane). -->
        <div class="dl-hero" aria-hidden="true">
          <div class="dl-capsule"></div>
          <img class="art dl-owl" src="/images/duo-owl.svg" width="200" height="220" alt="DuoOwl" />
          <span class="icon icon-sm dl-tw dl-tw-1" data-symbol="sparkles"></span>
          <span class="icon icon-xs dl-tw dl-tw-2" data-symbol="sparkles"></span>
        </div>
        <div class="dl-headline" style="text-align: center">Get started with a <span class="dl-green">7 day free trial</span> on Super</div>
      </div>
    </div>

    <div class="col" style="gap: var(--s3); padding: var(--s4)">
      <div class="col" style="gap: var(--s3)">
        <div class="dl-card">
          <div class="col" style="gap: 0">
            <div class="t-headline" style="color: var(--dl-card-ink)">Family Plan</div>
            <div class="t-subhead" style="color: var(--dl-mute)">12 mo - $119.99</div>
          </div>
          <div class="spacer"></div>
          <div class="t-headline" style="color: var(--dl-card-ink)">$9.99 / MO</div>
        </div>
        <div class="dl-card is-best">
          <span class="dl-tag">MOST POPULAR</span>
          <span class="dl-check">
            <span class="icon icon-xs" data-symbol="checkmark"></span>
          </span>
          <div class="col" style="gap: 0">
            <div class="t-headline" style="color: var(--dl-card-ink)">Individual</div>
            <div class="t-subhead" style="color: var(--dl-mute)">12 mo - $83.99</div>
          </div>
          <div class="spacer"></div>
          <div class="t-headline" style="color: var(--dl-card-ink)">$6.99 / MO</div>
        </div>
      </div>

      <div class="t-subhead" style="color: var(--dl-card-ink); text-align: center">Cancel anytime in the App Store</div>

      <button class="dl-cta">START MY FREE WEEK</button>

      <div class="t-headline dl-all" style="text-align: center">VIEW ALL PLANS</div>

      <div class="t-caption" style="color: var(--dl-mute); text-align: center">Your plan auto-renews each term. Cancel at least 24 hours before renewal.</div>
    </div>
  </div>
</div>
