<div class="scrim" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 var(--s10)">
  <div class="glass-strong col" style="width: 100%; gap: 0; border-radius: var(--r-xl); padding: var(--s5) 0 0">
    <div class="t-headline" style="text-align: center; padding: 0 var(--s4)">Delete conversation?</div>
    <div class="t-footnote t-secondary" style="text-align: center; padding: var(--s2) var(--s4) var(--s4)">This removes all messages. You cannot undo this action.</div>
    <div class="row" style="gap: 0; border-top: 1px solid var(--separator)">
      <button class="grow t-subhead" style="background: transparent; border: 0; justify-content: center; padding: var(--s3) 0; color: var(--accent)" aria-label="Cancel">Cancel</button>
      <button class="grow t-headline" style="background: transparent; border: 0; border-left: 1px solid var(--separator); justify-content: center; padding: var(--s3) 0; color: var(--danger)" aria-label="Delete">Delete</button>
    </div>
  </div>
</div>
