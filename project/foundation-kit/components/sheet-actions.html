<div class="sheet-panel">
  <div class="row" style="justify-content: center">
    <span class="grabber"></span>
  </div>
  <button class="action-row" aria-label="Share">
    <span class="icon icon-sm" data-symbol="square.and.arrow.up"></span>
    Share
  </button>
  <button class="action-row" aria-label="Edit">
    <span class="icon icon-sm" data-symbol="pencil"></span>
    Edit
  </button>
  <button class="action-row is-danger" aria-label="Delete">
    <span class="icon icon-sm" data-symbol="trash"></span>
    Delete
  </button>
</div>
