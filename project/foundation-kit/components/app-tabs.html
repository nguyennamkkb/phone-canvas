<!-- @anatomy name="app-tabs" purpose="Bo destination MAU de copy sang project moi; khong dung truc tiep o production." anatomy="button[data-tab=<slug>].tab > span.icon[data-symbol] + span Label (x4 mau: home/scan/diary/me)" variants="is-active do shell suy, khong khai tay" states="default/is-active; khong co disabled/loading" tokens="khong dung var — icon + text ke thua" regions="tab list mau; thay destination that truoc khi dung" platforms="phone day du 4 tab; cover cam tab ngang; watch/widget khong dung" interaction="tap chuyen destination, target la .tab" a11y="moi tab co icon + nhan chu; shell suy aria tu vi tri" examples="dung: copy file sang project moi roi doi destination; sai: dung bo mau lam tab that" -->
<!-- Bộ destination MẪU của foundation-kit — đây là bộ ví dụ để bạn copy sang
     project mới rồi thay bằng destination thật của app.

     Màn không chép lại danh sách này; màn chỉ khai destination đang mở bằng
     `data-tab-active="<slug>"` trên `.screen`. Shell suy ra `is-active`,
     `aria-current="page"`, `aria-label` và thứ tự "tab N trên M" từ vị trí
     thật trong bộ, nên xếp lại destination không phải sửa màn nào. -->
<button data-tab="home" class="tab">

  <span>Home</span>
</button>
<button data-tab="scan" class="tab">

</button>
<button data-tab="diary" class="tab">

  <span>Diary</span>
</button>
<button data-tab="me" class="tab">

</button>
