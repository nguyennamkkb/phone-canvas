<!-- pc {"title":"Foundation Showcase"} -->
<div class="screen" style="background-color: var(--bg)">
  <span data-slot="title" class="nav-title">Foundation</span>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Search</span>
      <!-- @component searchbar -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Filter</span>
      <!-- @component chip-row -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Rows · list</span>
      <!-- @component list-row -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Rows · card</span>
      <!-- @component row-card -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Reading · score</span>
      <!-- @component hero-score -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Actions · sheet</span>
      <!-- @component sheet-actions -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">State · empty</span>
      <!-- @component state-empty -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Buttons</span>
      <div class="row" style="gap: var(--s2)">
        <!-- @component button-content -->
      </div>
      <div class="row" style="gap: var(--s2); align-items: center">
        <!-- @component button-glass-round -->
        <!-- @component button-glass-pill -->
      </div>
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Controls · toggle</span>
      <!-- @component toggle -->
    </div>
    <div class="col" style="gap: var(--s2)">
      <span class="t-headline">Bars · nav + tab (shell-owned)</span>
      <p class="t-footnote t-secondary">Nav và tab bar do shell dựng — khai ruột bằng <code>data-slot</code> / <code>data-tab</code>, không dựng band.</p>
    </div>
    <div class="spacer"></div>
  </div>

  <button data-tab class="tab is-active" aria-label="Home, tab 1 trên 4">
    <span class="icon" data-symbol="house"></span>
    <span>Home</span>
  </button>
  <button data-tab class="tab" aria-label="Scan, tab 2 trên 4">
    <span class="icon" data-symbol="camera"></span>
    <span>Scan</span>
  </button>
  <button data-tab class="tab" aria-label="Diary, tab 3 trên 4">
    <span class="icon" data-symbol="list.bullet"></span>
    <span>Diary</span>
  </button>
  <button data-tab class="tab" aria-label="Me, tab 4 trên 4">
    <span class="icon" data-symbol="person"></span>
    <span>Me</span>
  </button>
</div>
