<!--
  T1 – Problem-Agitation Intro (KB3-M1). Tệp paid UA chưa biết app: chạm nỗi
  đau "màn hình nhỏ, mỏi mắt" trước khi giới thiệu màn lớn.

  Ảnh 3:4 là SÂN KHẤU so sánh: nửa trái — nheo mắt nhìn điện thoại; nửa phải —
  thư giãn xem TV lớn (cùng một bức ảnh trên hai màn, chỉ khác kích thước).
  Hai chip kích thước do app render nổi chéo hai góc, tự che ảnh (ảnh không
  chừa vùng trống): 6″ mờ --label-2 (phía nỗi đau) · 65″ rõ + chấm live --accent
  (phía giải pháp). Chấm live = ngôn ngữ trạng thái "đang chiếu" của KB1-M2.

  Tiêu đề: nhấn "10x" — đúng theo ĐƯỜNG CHÉO 65″/6″ ≈ 10.8, KHÔNG thêm đơn vị
  khác (L1 đã duyệt). Tiến trình 9 đoạn (KB1 là 8). CTA cùng vị trí mọi màn.

  Ảnh: ob_hero_problem_agitation — ĐÃ CÓ (master:
  project/smartscreen-kb3/assets/ob_hero_problem_agitation.png; bản hiển thị:
  public/images/ob_hero_problem_agitation.png, 896×1200 = chuẩn nhà như các
  hero KB1). Chips đặt cạnh chủ thể thay vì đè lên màn hình thiết bị — ảnh là
  thứ kể câu chuyện "cùng nội dung, màn lớn hơn".
-->
<div class="screen" style="background-color: var(--bg)">
  <div class="body-fixed" style="gap: 0">
    <div class="ob-steps" role="progressbar" aria-label="Step 1 of 9" aria-valuenow="1" aria-valuemin="1" aria-valuemax="9"><i class="ob-step is-done"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i></div>

    <div class="ob-scroll" style="gap: var(--s6); padding-top: var(--s4)">
      <div class="ob-hero">
        <img class="art ob-hero-img" src="/images/ob_hero_problem_agitation.png" width="342" height="456" alt="ob_hero_problem_agitation" data-asset="ob_hero_problem_agitation" />
        <span class="ob-float" style="top: 36%; left: var(--s4); color: var(--label-2)">6″</span>
        <span class="ob-float" style="top: 24%; right: var(--s4)"><span class="ob-live"></span>65″</span>
      </div>

      <div class="col" style="gap: var(--s2)">
        <h1 class="ob-display">Enjoy Your Content <span class="ob-hl">10x</span> Larger</h1>
        <p class="ob-lead">Stop squinting at your phone. Put photos, videos and your whole screen on the TV.</p>
      </div>
    </div>

    <div class="ob-foot">
      <button class="ob-cta">Continue <span class="icon icon-sm" data-symbol="arrow.right"></span></button>
    </div>
  </div>
</div>
