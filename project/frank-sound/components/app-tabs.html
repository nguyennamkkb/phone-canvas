<!-- Bộ destination của frank-sound — MỘT nguồn duy nhất.
     Màn không chép lại danh sách này; màn chỉ khai destination đang mở bằng
     `data-tab-active="<slug>"` trên `.screen`. Shell suy ra `is-active`,
     `aria-current="page"` và thứ tự "tab N trên M" từ vị trí thật trong bộ. -->
<button data-tab="discover" class="tab">
  <span class="icon" data-symbol="house"></span>
  <span>Khám phá</span>
</button>
<button data-tab="board" class="tab">
  <span class="icon" data-symbol="square.grid.2x2"></span>
  <span>Pha trò</span>
</button>
<button data-tab="timer" class="tab">
  <span class="icon" data-symbol="timer"></span>
  <span>Hẹn giờ</span>
</button>
<button data-tab="me" class="tab">
  <span class="icon" data-symbol="person"></span>
  <span>Tôi</span>
</button>
