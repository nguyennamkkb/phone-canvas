<!-- Bộ destination của frank-sound — MỘT nguồn duy nhất.
     Màn không chép lại danh sách này; màn chỉ khai destination đang mở bằng
     `data-tab-active="<slug>"` trên `.screen`. Shell suy ra `is-active`,
     `aria-current="page"` và thứ tự "tab N trên M" từ vị trí thật trong bộ. -->
