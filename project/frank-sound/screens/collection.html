<!-- pc {"title":"Pha trò"} -->
<div class="screen app-frank" style="background-color: var(--bg)" data-tab-active="board">
  <span data-slot="title" class="nav-title">Pha trò</span>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Trộn lại từ đầu">
    <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="col" style="gap: 0">
      <div class="t-footnote t-secondary">3 vị một lần bấm</div>
      <div class="t-title2">Công thức chọc cười</div>
    </div>

    <div class="col" style="gap: var(--s3)">
      <div class="paper-card" style="gap: var(--s3)">
        <div class="row" style="gap: var(--s3); align-items: center">
          <span class="pill-tag">Vị 1</span>
          <span class="icon icon-lg" data-symbol="bolt.fill" style="color: var(--cta)"></span>
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Còi hơi xe lửa</div>
            <div class="t-subhead t-secondary">mở màn choáng váng</div>
          </div>
          <button class="nav-round is-hollow" aria-label="Đổi vị 1">
            <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath"></span>
          </button>
        </div>
      </div>
      <div class="paper-card" style="gap: var(--s3)">
        <div class="row" style="gap: var(--s3); align-items: center">
          <span class="pill-tag">Vị 2</span>
          <span class="icon icon-lg" data-symbol="flame" style="color: var(--cta)"></span>
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Trống cổ vũ</div>
            <div class="t-subhead t-secondary">dồn dập không thở</div>
          </div>
          <button class="nav-round is-hollow" aria-label="Đổi vị 2">
            <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath"></span>
          </button>
        </div>
      </div>
      <div class="paper-card" style="gap: var(--s3)">
        <div class="row" style="gap: var(--s3); align-items: center">
          <span class="pill-tag">Vị 3</span>
          <span class="icon icon-lg" data-symbol="face.smiling" style="color: var(--cta)"></span>
          <div class="grow col" style="gap: 0">
            <div class="t-headline">Cười ha hả</div>
            <div class="t-subhead t-secondary">chốt hạ lăn lộn</div>
          </div>
          <button class="nav-round is-hollow" aria-label="Đổi vị 3">
            <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath"></span>
          </button>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-block">Trộn ngay</button>

    <div class="paper-card combo-card" style="gap: var(--s3)">
      <div class="row" style="gap: var(--s3); align-items: center">
        <span class="icon icon-sm" data-symbol="sparkles"></span>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Bom cười số 7</div>
          <div class="t-subhead t-secondary">còi ×2 + trống + cười · một chạm</div>
        </div>
        <button class="nav-round" aria-label="Phát Bom cười số 7">
          <span class="icon icon-sm" data-symbol="play.fill"></span>
        </button>
      </div>
      <div class="row" style="gap: var(--s3)">
        <button class="btn grow" aria-label="Lưu công thức">Lưu lại</button>
        <button class="btn grow" aria-label="Chia sẻ công thức">Chia sẻ</button>
      </div>
    </div>
  </div>

  <!-- @component app-tabs -->
</div>
