<!-- pc {"title":"Phòng thu"} -->
<div class="screen app-frank" style="background-color: var(--bg)">
  <button data-slot="back" class="nav-round is-hollow" aria-label="Quay lại">
    <span class="icon icon-sm" data-symbol="chevron.left"></span>
  </button>
  <span data-slot="title" class="nav-title">Phòng thu</span>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Xóa bản thu">
    <span class="icon icon-sm" data-symbol="trash"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4); align-items: center">
    <div class="col" style="gap: 0; align-items: center">
      <div class="t-score">0:07</div>
      <div class="t-subhead t-secondary">bản nháp · chưa lưu</div>
    </div>

    <button class="play-hero" style="width: 112px; height: 112px; border-radius: var(--r-full)" aria-label="Bắt đầu thu">
      <span class="icon" data-symbol="microphone" style="width: 48px; height: 48px"></span>
    </button>

    <div class="segmented-light" role="group" aria-label="Cao độ giọng" style="width: 100%">
      <button class="seg" style="height: auto; padding-top: var(--s2); padding-bottom: var(--s2)">Chipmunk</button>
      <button class="seg is-on" style="height: auto; padding-top: var(--s2); padding-bottom: var(--s2)">Thường</button>
      <button class="seg" style="height: auto; padding-top: var(--s2); padding-bottom: var(--s2)">Ông kẹ</button>
    </div>

    <div class="paper-card" style="gap: var(--s2); width: 100%">
      <span class="t-section">3 bản thu</span>
      <div class="row" style="gap: var(--s3); align-items: center">
        <button class="nav-round is-hollow" aria-label="Nghe Bản 3">
          <span class="icon icon-sm" data-symbol="play.fill"></span>
        </button>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Bản 3 · 0:07</div>
          <div class="t-subhead t-secondary">vừa xong · giọng Thường</div>
        </div>
        <span class="pill-tag">mới</span>
      </div>
      <div class="row" style="gap: var(--s3); align-items: center">
        <button class="nav-round is-hollow" aria-label="Nghe Bản 2">
          <span class="icon icon-sm" data-symbol="play.fill"></span>
        </button>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Bản 2 · 0:05</div>
          <div class="t-subhead t-secondary">hôm qua · giọng Chipmunk</div>
        </div>
      </div>
      <div class="row" style="gap: var(--s3); align-items: center">
        <button class="nav-round is-hollow" aria-label="Nghe Bản 1">
          <span class="icon icon-sm" data-symbol="play.fill"></span>
        </button>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Bản 1 · 0:09</div>
          <div class="t-subhead t-secondary">hôm qua · giọng Ông kẹ</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-block">Dùng bản này chọc bạn</button>
  </div>
</div>
