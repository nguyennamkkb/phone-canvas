<!-- pc {"title":"Hôm nay quậy gì"} -->
<div class="screen app-frank" style="background-color: var(--bg)" data-tab-active="discover">
  <span data-slot="title" class="nav-title">Khám phá</span>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Thu giọng mới">
    <span class="icon icon-sm" data-symbol="microphone"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <button class="pad pad-peach" style="width: 100%; padding: var(--s6) var(--s4)" aria-label="Phát âm của ngày: Còi hơi xe lửa">
      <span class="pill-tag">Âm của ngày</span>
      <span class="icon" data-symbol="bolt.fill" style="width: 64px; height: 64px"></span>
      <span class="t-title2">Còi hơi xe lửa</span>
      <span class="t-subhead t-secondary">2,1M lượt · chạm là kêu</span>
    </button>

    <div class="row" style="gap: var(--s2)">
      <button class="chip is-active">Thịnh hành</button>
      <button class="chip">Meme</button>
      <button class="chip">Động vật</button>
      <button class="chip">Cổ vũ</button>
    </div>

    <div class="row" style="gap: var(--s3); align-items: flex-start">
      <div class="col grow" style="gap: var(--s3)">
        <button class="pad pad-sun" aria-label="Phát Cười ha hả">
          <span class="icon icon-lg" data-symbol="face.smiling"></span>
          <span class="t-headline">Cười ha hả</span>
          <span class="t-footnote t-secondary">0:10</span>
        </button>
        <button class="pad pad-blue" aria-label="Phát Vỗ tay nhiệt liệt">
          <span class="icon icon-lg" data-symbol="hand.raised"></span>
          <span class="t-headline">Vỗ tay</span>
          <span class="t-footnote t-secondary">0:06</span>
        </button>
      </div>
      <div class="col grow" style="gap: var(--s3); margin-top: var(--s6)">
        <button class="pad pad-sage" aria-label="Phát Trống cổ vũ">
          <span class="icon icon-lg" data-symbol="flame"></span>
          <span class="t-headline">Trống cổ vũ</span>
          <span class="t-footnote t-secondary">0:08</span>
        </button>
        <button class="pad pad-lilac" aria-label="Phát Loa phóng thanh">
          <span class="icon icon-lg" data-symbol="speaker.wave.2"></span>
          <span class="t-headline">Loa phường</span>
          <span class="t-footnote t-secondary">0:05</span>
        </button>
      </div>
    </div>
  </div>

  <!-- @component app-tabs -->
</div>
