<!-- pc {"title":"Assistants AI","lightStatusBar":true,"deviceId":"iphone-16-pro"} -->
<div class="screen" data-tab-active="helper" style="background-color: var(--bg)">
  <div data-slot="back" class="row" style="gap: var(--s2); align-items: center" aria-label="Home AI Interior">
    <span class="row" style="width: 40px; height: 40px; border-radius: var(--r-full); background-color: var(--bg-elevated); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="house"></span></span>
    <span class="col" style="gap: 0">
      <span class="t-headline">HOME</span>
      <span class="t-caption t-secondary">AI INTERIOR</span>
    </span>
  </div>
  <button data-slot="right" aria-label="Go premium" style="width: 44px; height: 44px; border-radius: var(--r-md); background-color: var(--gold); color: var(--gold-ink); border: 0">
    <span class="icon icon-sm" data-symbol="crown"></span>
  </button>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Settings">
    <span class="icon icon-sm" data-symbol="gear"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="t-headline">Assistants AI</div>

    <div class="col" style="gap: var(--s2); align-items: center; padding: var(--s5) var(--s4) 0; border-radius: var(--corner-card); background-color: var(--card)">
      <div class="t-title3">House Stylist</div>
      <div class="t-subhead t-secondary" style="text-align: center">Generate suitable home decoration plans</div>
      <div class="row" style="gap: var(--s2); align-items: flex-end">
        <img class="art" src="/project/home-ai/assets/a1-1.jpg" width="85" height="60" alt="House styling sample 1" style="border-radius: var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a1-2.jpg" width="85" height="70" alt="House styling sample 2" style="border-radius: var(--r-full) var(--r-full) var(--corner-media) var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a1-3.jpg" width="85" height="60" alt="House styling sample 3" style="border-radius: var(--corner-media)" />
      </div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center; padding: var(--s5) var(--s4) 0; border-radius: var(--corner-card); background-color: var(--card)">
      <div class="t-title3">Garden Designer</div>
      <div class="t-subhead t-secondary" style="text-align: center">Design stunning gardens instantly</div>
      <div class="row" style="gap: var(--s2); align-items: flex-end">
        <img class="art" src="/project/home-ai/assets/a2-1.jpg" width="85" height="65" alt="Garden sample 1" style="border-radius: var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a2-2.jpg" width="85" height="75" alt="Garden sample 2" style="border-radius: var(--r-full) var(--r-full) var(--corner-media) var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a2-3.jpg" width="85" height="65" alt="Garden sample 3" style="border-radius: var(--corner-media)" />
      </div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center; padding: var(--s5) var(--s4) 0; border-radius: var(--corner-card); background-color: var(--card)">
      <div class="t-title3">Exterior Architect</div>
      <div class="t-subhead t-secondary" style="text-align: center">Redesign your home's exterior effortlessly</div>
      <div class="row" style="gap: var(--s2); align-items: flex-end">
        <img class="art" src="/project/home-ai/assets/a3-1.jpg" width="85" height="60" alt="Exterior sample 1" style="border-radius: var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a3-2.jpg" width="85" height="70" alt="Exterior sample 2" style="border-radius: var(--r-full) var(--r-full) var(--corner-media) var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a3-3.jpg" width="85" height="60" alt="Exterior sample 3" style="border-radius: var(--corner-media)" />
      </div>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center; padding: var(--s5) var(--s4) 0; border-radius: var(--corner-card); background-color: var(--card)">
      <div class="t-title3">Renovation Pro AI</div>
      <div class="t-subhead t-secondary" style="text-align: center">Smart renovation made simple</div>
      <div class="row" style="gap: var(--s2); align-items: flex-end">
        <img class="art" src="/project/home-ai/assets/a4-1.jpg" width="85" height="43" alt="Renovation sample 1" style="border-radius: var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a4-2.jpg" width="85" height="50" alt="Renovation sample 2" style="border-radius: var(--r-full) var(--r-full) var(--corner-media) var(--corner-media)" />
        <img class="art" src="/project/home-ai/assets/a4-3.jpg" width="85" height="43" alt="Renovation sample 3" style="border-radius: var(--corner-media)" />
      </div>
    </div>
  </div>
  <!-- @component app-tabs -->
</div>
