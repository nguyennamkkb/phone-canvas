<!-- pc {"title":"Upload photo","lightStatusBar":true,"deviceId":"iphone-16-pro"} -->
<div class="screen" style="background-color: var(--bg)">
  <button data-slot="back" class="nav-round is-hollow" aria-label="Back">
    <span class="icon icon-sm" data-symbol="arrow.left"></span>
  </button>
  <span data-slot="title" class="row" style="gap: var(--s2); align-items: center" aria-label="Step 1 of 2">
    <span class="row t-subhead" style="width: 32px; height: 32px; border-radius: var(--r-full); background-color: var(--label); color: var(--bg); align-items: center; justify-content: center">1</span>
    <span style="width: 24px; height: 2px; border-radius: var(--r-full); background-color: var(--hairline)"></span>
    <span class="row t-subhead t-secondary" style="width: 32px; height: 32px; border-radius: var(--r-full); border: 1px solid var(--hairline); align-items: center; justify-content: center">2</span>
  </span>
  <button data-slot="right" class="nav-round is-hollow" aria-label="More options">
    <span class="icon icon-sm" data-symbol="square.grid.2x2"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="t-headline">Upload photo of your place!</div>
    <div class="grow" style="min-height: 200px; border-radius: var(--corner-card); background-color: var(--bg-elevated)"></div>
    <div class="t-headline">Example photos</div>

    <div class="row" style="gap: var(--s3)">
      <div class="grow" style="height: 88px; border-radius: var(--corner-media); background-color: var(--bg-elevated)"></div>
      <div class="grow" style="height: 88px; border-radius: var(--corner-media); background-color: var(--bg-elevated)"></div>
      <div class="grow" style="position: relative; height: 88px; border-radius: var(--corner-media); background-color: var(--bg-elevated)">
        <span class="row" style="position: absolute; left: 50%; top: 50%; margin: -14px 0 0 -14px; width: 28px; height: 28px; border-radius: var(--r-full); background-color: var(--label); color: var(--bg); align-items: center; justify-content: center"><span class="icon icon-xs" data-symbol="checkmark"></span></span>
      </div>
      <div class="grow" style="height: 88px; border-radius: var(--corner-media); background-color: var(--bg-elevated)"></div>
    </div>
    <button class="btn btn-block" style="background-color: var(--gold); color: var(--gold-ink); border-radius: var(--r-full)">Continue</button>
  </div>
</div>
