<!-- pc {"title":"Result","lightStatusBar":true,"deviceId":"iphone-16-pro"} -->
<div class="screen" style="background-color: var(--bg)">
  <button data-slot="back" class="nav-round is-hollow" aria-label="Close">
    <span class="icon icon-sm" data-symbol="xmark"></span>
  </button>
  <span data-slot="title" class="nav-title">Result</span>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Report">
    <span class="icon icon-sm" data-symbol="flag"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="grow" style="min-height: 320px; border-radius: var(--corner-card); background-color: var(--bg-elevated)"></div>

    <div class="row" style="gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--corner-card); background-color: var(--card)">
      <span class="row" style="width: 44px; height: 44px; border-radius: var(--r-full); background-color: var(--bg-elevated); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="sparkles"></span></span>
      <span class="col grow" style="gap: 0">
        <span class="t-caption t-secondary">Decor style</span>
        <span class="t-headline">Luxury</span>
      </span>
    </div>

    <div class="row" style="gap: var(--s3); align-items: center">
      <button class="btn grow" style="background-color: var(--gold); color: var(--gold-ink); border-radius: var(--r-full)">
        <span class="row" style="gap: var(--s1); align-items: center">
          <span class="t-headline">Regenerate</span>
          <span class="icon icon-sm" data-symbol="plus"></span>
        </span>
      </button>
      <button class="nav-round is-hollow" aria-label="Share" style="width: 56px; height: 56px">
        <span class="icon icon-sm" data-symbol="square.and.arrow.up"></span>
      </button>
      <button class="nav-round is-hollow" aria-label="Download" style="width: 56px; height: 56px">
        <span class="icon icon-sm" data-symbol="download"></span>
      </button>
    </div>
  </div>
</div>
