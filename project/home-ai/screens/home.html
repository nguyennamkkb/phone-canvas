<!-- pc {"title":"Home","lightStatusBar":true,"deviceId":"iphone-16-pro"} -->
<div class="screen" data-tab-active="home" style="background-color: var(--bg)">
  <div data-slot="back" class="row" style="gap: var(--s2); align-items: center" aria-label="Home AI Interior">
    <span class="row" style="width: 40px; height: 40px; border-radius: var(--r-full); background-color: var(--bg-elevated); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="house"></span></span>
    <span class="col" style="gap: 0">
      <span class="t-headline">HOME</span>
      <span class="t-caption t-secondary">AI INTERIOR</span>
    </span>
  </div>
  <button data-slot="right" aria-label="Go premium" style="width: 44px; height: 44px; border-radius: var(--r-md); background-color: var(--gold); color: var(--gold-ink); border: 0">
    <span class="icon icon-sm" data-symbol="crown"></span>
  </button>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Settings">
    <span class="icon icon-sm" data-symbol="gear"></span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="row" style="gap: var(--s3); align-items: center">
      <div style="position: relative">
        <img class="art" src="/project/home-ai/assets/home-hero-left.jpg" width="63" height="220" alt="Stylist portrait" style="border-radius: var(--corner-media)" />
        <span class="row" style="position: absolute; left: var(--s2); bottom: var(--s2); width: 36px; height: 36px; border-radius: var(--r-full); background-color: var(--gold); color: var(--gold-ink); align-items: center; justify-content: center"><span class="icon icon-xs" data-symbol="robot"></span></span>
      </div>
      <div class="grow" style="position: relative">
        <img class="art" src="/project/home-ai/assets/home-hero-garden.jpg" width="256" height="220" alt="Garden design" style="border-radius: var(--corner-media)" />
        <div class="col" style="position: absolute; left: 0; right: 0; bottom: 0; gap: var(--s2); padding: var(--s3); border-radius: 0 0 var(--corner-media) var(--corner-media); background-color: var(--scrim)">
          <div class="t-title2">Garden Design</div>
          <div class="row" style="gap: var(--s1); align-items: center">
            <img class="art" src="/project/home-ai/assets/home-thumb-1.jpg" width="36" height="33" alt="Garden sample 1" style="border-radius: var(--s2)" />
            <img class="art" src="/project/home-ai/assets/home-thumb-2.jpg" width="36" height="33" alt="Garden sample 2" style="border-radius: var(--s2)" />
            <img class="art" src="/project/home-ai/assets/home-thumb-3.jpg" width="36" height="33" alt="Garden sample 3" style="border-radius: var(--s2)" />
            <span class="t-subhead">30+</span>
          </div>
        </div>
      </div>
      <img class="art" src="/project/home-ai/assets/home-hero-right.jpg" width="78" height="220" alt="Interior design" style="border-radius: var(--corner-media)" />
    </div>

    <div class="row" style="align-items: center">
      <div class="t-headline grow">Your workspace</div>
      <span class="row" style="width: 44px; height: 44px; align-items: center; justify-content: center; color: var(--label-2)"><span class="icon icon-sm" data-symbol="expand"></span></span>
    </div>

    <div class="col" style="gap: var(--s3); align-items: center; padding: var(--s5) var(--s4); border-radius: var(--corner-card); background-color: var(--card)">
      <div class="t-title3">Access to Photos</div>
      <div class="t-subhead t-secondary" style="text-align: center">Pick a room photo to start redesigning. We only access photos you choose.</div>
      <button class="btn btn-block" style="background-color: var(--gold); color: var(--gold-ink); border-radius: var(--r-full)">Continue</button>
    </div>

    <div class="t-headline">Special tools</div>
    <div class="row" style="gap: var(--s2)">
      <div class="col grow" style="gap: var(--s1); align-items: center">
        <span class="row" style="width: 56px; height: 56px; border-radius: var(--r-full); background-color: var(--bg-elevated); color: var(--gold); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="house"></span></span>
        <span class="t-caption" style="color: var(--gold)">Home</span>
      </div>
      <div class="col grow" style="gap: var(--s1); align-items: center">
        <span class="row" style="width: 56px; height: 56px; border-radius: var(--r-full); background-color: var(--bg-elevated); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="robot"></span></span>
        <span class="t-caption t-secondary">Helper AI</span>
      </div>
      <div class="col grow" style="gap: var(--s1); align-items: center">
        <span class="row" style="width: 56px; height: 56px; border-radius: var(--r-full); background-color: var(--bg-elevated); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="compass"></span></span>
        <span class="t-caption t-secondary">Discover</span>
      </div>
      <div class="col grow" style="gap: var(--s1); align-items: center">
        <span class="row" style="width: 56px; height: 56px; border-radius: var(--r-full); background-color: var(--bg-elevated); align-items: center; justify-content: center"><span class="icon icon-sm" data-symbol="person"></span></span>
        <span class="t-caption t-secondary">My Creation</span>
      </div>
    </div>
  </div>
  <!-- @component app-tabs -->
</div>
