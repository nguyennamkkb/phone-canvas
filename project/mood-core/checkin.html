<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4); align-items: center">
      <button class="close-btn" aria-label="Close">
        <span class="icon icon-xs" data-symbol="xmark"></span>
      </button>
      <div class="t-subhead">Check in</div>
      <div class="row" style="gap: var(--s1); align-items: center">
        <span class="icon icon-xs" data-symbol="clock" style="color: var(--clay)"></span>
        <span class="t-caption" style="color: var(--clay)">14:20</span>
      </div>
    </div>

    <div class="col" style="align-items: center; gap: var(--s1); padding-top: var(--s3); text-align: center">
      <h1 class="t-title2" style="text-align: center">How are you right now?</h1>
      <div class="t-footnote" style="color: var(--clay)">Tuesday, 16 September</div>
    </div>

    <div class="col" style="align-items: center; justify-content: center; padding-top: var(--s1)">
      <img class="art" src="/images/onb-checkin.png"
           data-asset="CheckinHeroGood" width="200" height="200"
           alt="Happy smartphone mascot checking in"
           style="object-fit: contain" />
    </div>

    <div class="col" style="align-items: center; gap: 2px; padding-top: var(--s2)">
      <div class="t-title1" style="color: var(--espresso)">Good</div>
      <div class="t-subhead" style="color: var(--clay)">Better than yesterday · Peaceful & light</div>
    </div>

    <div class="row" style="justify-content: space-between; padding-top: var(--s4); align-items: center">
      <div class="col" style="align-items: center; gap: var(--s1)">
        <img class="art" src="/images/mood-awful.svg" width="44" height="44" alt="Awful" style="opacity: 0.65" />
        <span class="t-caption" style="color: var(--clay)">Awful</span>
      </div>
      <div class="col" style="align-items: center; gap: var(--s1)">
        <img class="art" src="/images/mood-bad.svg" width="44" height="44" alt="Bad" style="opacity: 0.65" />
        <span class="t-caption" style="color: var(--clay)">Bad</span>
      </div>
      <div class="col" style="align-items: center; gap: var(--s1)">
        <img class="art" src="/images/mood-okay.svg" width="44" height="44" alt="Okay" style="opacity: 0.65" />
        <span class="t-caption" style="color: var(--clay)">Okay</span>
      </div>
      <div class="col" style="align-items: center; gap: var(--s1)">
        <div class="col" style="align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: var(--r-full); background: var(--sage-wash); border: 2px solid var(--sage-deep)">
          <img class="art" src="/images/mood-good.svg" width="44" height="44" alt="Good" />
        </div>
        <span class="t-caption" style="color: var(--espresso); font-weight: 600">Good</span>
      </div>
      <div class="col" style="align-items: center; gap: var(--s1)">
        <img class="art" src="/images/mood-great.svg" width="44" height="44" alt="Great" style="opacity: 0.65" />
        <span class="t-caption" style="color: var(--clay)">Great</span>
      </div>
    </div>

    <div class="col" style="gap: var(--s2); padding-top: var(--s4)">
      <div class="t-headline">What is behind it?</div>
      <div class="row" style="gap: var(--s2); align-items: flex-start; flex-wrap: wrap">
        <span class="chip is-active">
          <span class="icon icon-xs" data-symbol="moon"></span>
          Sleep
        </span>
        <span class="chip">
          <span class="icon icon-xs" data-symbol="folder"></span>
          Work
        </span>
        <span class="chip">
          <span class="icon icon-xs" data-symbol="person"></span>
          People
        </span>
        <span class="chip">
          <span class="icon icon-xs" data-symbol="heart"></span>
          Health
        </span>
        <span class="chip">
          <span class="icon icon-xs" data-symbol="sparkles"></span>
          Weather
        </span>
        <span class="chip">
          <span class="icon icon-xs" data-symbol="house"></span>
          Family
        </span>
      </div>
    </div>

    <div class="col" style="gap: var(--s2); padding-top: var(--s3)">
      <div class="t-headline">Add a note</div>
      <div class="text-field">Optional. A line is enough.</div>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s3) 0 var(--s4)">
      <button class="pill-sage" style="width: 100%">Save check-in</button>
    </div>
  </div>
</div>
