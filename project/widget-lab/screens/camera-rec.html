<!-- pc {"title":"Camera","deviceId":"widget-small"} -->
<style>
.wg-cm-cam {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: var(--r-full);
  background: var(--wg-wifi);
  color: var(--wg-card);
}
.wg-cm-name {
  font-family: var(--font);
  font-size: var(--t-headline);
  font-weight: 700;
  line-height: 22px;
  letter-spacing: -0.4px;
  color: var(--wg-ink);
}
.wg-cm-state {
  font-family: var(--font);
  font-size: var(--t-footnote);
  font-weight: 400;
  line-height: 18px;
  color: var(--wg-sub);
}
.wg-cm-tc {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 600;
  line-height: 20px;
  color: var(--wg-ink);
  white-space: nowrap;
}
/* Static record visual (display widget, no input) — 44pt red circle,
   white rounded-square stop glyph (CSS box, not an icon). */
.wg-cm-rec {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: var(--touch-min);
  border-radius: var(--r-full);
  background: var(--wg-habit);
}
.wg-cm-stop {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: var(--wg-card);
}
</style>
<div class="screen" style="background-color: var(--wg-card); padding: var(--s3); gap: var(--s1); justify-content: center">
  <div class="row" style="gap: var(--s2); align-items: center">
    <span class="wg-cm-cam" aria-hidden="true">
      <span class="icon icon-sm" data-symbol="camera"></span>
    </span>
    <div class="wg-cm-name" style="flex: 1 1 auto; min-width: 0">Camera</div>
  </div>
  <div class="wg-cm-state">Recording</div>
  <div class="row" style="gap: 0; align-items: center">
    <div class="wg-cm-tc" style="flex: 1 1 auto; min-width: 0">00.34.20</div>
    <span class="wg-cm-rec" role="img" aria-label="Recording">
      <span class="wg-cm-stop" aria-hidden="true"></span>
    </span>
  </div>
</div>
