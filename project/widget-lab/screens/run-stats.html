<!-- pc {"title":"Run Stats","deviceId":"widget-medium"} -->
<style>
.wg-rs-dist {
  font-family: var(--font);
  font-size: 28px;
  font-weight: 800;
  line-height: 32px;
  letter-spacing: -0.5px;
  color: var(--wg-ink);
}
.wg-rs-unit {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 400;
  line-height: 20px;
  color: var(--wg-ink);
}
.wg-rs-ring {
  position: relative;
  flex: 0 0 auto;
  width: 64px;
  height: 64px;
}
.wg-rs-mid {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  gap: 0;
}
.wg-rs-num {
  font-family: var(--font);
  font-size: var(--t-headline);
  font-weight: 800;
  line-height: 20px;
  color: var(--wg-ink);
}
.wg-rs-km {
  font-family: var(--font);
  font-size: var(--t-caption);
  font-weight: 400;
  line-height: 14px;
  color: var(--wg-ink);
}
.wg-rs-lab {
  font-family: var(--font);
  font-size: var(--t-caption);
  font-weight: 400;
  line-height: 16px;
  color: var(--wg-sub);
  white-space: nowrap;
}
.wg-rs-val {
  font-family: var(--font);
  font-size: var(--t-headline);
  font-weight: 700;
  line-height: 22px;
  color: var(--wg-ink);
  white-space: nowrap;
}
</style>
<div class="screen" style="background-color: var(--wg-card); padding: var(--s3) var(--s4); gap: var(--s2); justify-content: center">
  <div class="row" style="gap: var(--s2); align-items: center">
    <div class="row" style="gap: 2px; align-items: baseline; flex: 1 1 auto; min-width: 0">
      <span class="wg-rs-dist">2.8</span>
      <span class="wg-rs-unit">km</span>
    </div>
    <div class="wg-rs-ring">
      <img class="art" src="/images/wg-ring.svg" width="64" height="64" alt="Progress ring, 64 kilometers" />
      <div class="wg-rs-mid" aria-hidden="true">
        <span class="wg-rs-num">64</span>
        <span class="wg-rs-km">km</span>
      </div>
    </div>
  </div>
  <div class="row" style="gap: var(--s2)">
    <div class="col" style="gap: 0; flex: 1 1 auto; min-width: 0">
      <span class="wg-rs-lab">Duration</span>
      <span class="wg-rs-val">08:21</span>
    </div>
    <div class="col" style="gap: 0; flex: 1 1 auto; min-width: 0">
      <span class="wg-rs-lab">Avg. speed</span>
      <span class="wg-rs-val">18.4 km/h</span>
    </div>
    <div class="col" style="gap: 0; flex: 1 1 auto; min-width: 0">
      <span class="wg-rs-lab">Calories</span>
      <span class="wg-rs-val">134 kcal</span>
    </div>
  </div>
</div>
