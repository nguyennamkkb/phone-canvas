<!-- c02-welcome · S02 Welcome / Value Proposition -->
<div class="screen">
  <div class="body" style="gap: var(--s4)">
    <div class="hero">
      <span class="avatar" style="width: 72px; height: 72px; background: var(--success); color: var(--bg-elevated)">
        <span class="icon icon-lg" data-symbol="bolt.fill"></span>
      </span>
      <div class="col" style="align-items: center; gap: var(--s1)">
        <span class="t-title1">Log meals with a photo</span>
        <span class="t-subhead t-secondary">No typing. No guessing. Just eat.</span>
      </div>
    </div>
    <div class="col" style="gap: var(--s3); padding: 0 var(--s4)">
      <div class="list-row">
        <span class="chip-icon bg-white"><span class="icon icon-sm" data-symbol="photo"></span></span>
        <div class="col grow" style="gap: 2px">
          <span class="t-headline">Snap and go</span>
          <span class="t-footnote t-secondary">AI reads calories and macros in seconds.</span>
        </div>
      </div>
      <div class="list-row">
        <span class="chip-icon bg-white"><span class="icon icon-sm" data-symbol="sparkles"></span></span>
        <div class="col grow" style="gap: 2px">
          <span class="t-headline">Plans that adapt</span>
          <span class="t-subhead t-secondary">Targets tuned to your body and pace.</span>
        </div>
      </div>
      <div class="list-row">
        <span class="chip-icon bg-white"><span class="icon icon-sm" data-symbol="chart.bar"></span></span>
        <div class="col grow" style="gap: 2px">
          <span class="t-headline">Trends, not judgment</span>
          <span class="t-subhead t-secondary">Weight, habits and streaks at a glance.</span>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="bottom-cta">
    <button class="btn btn-primary btn-block" style="background: var(--success)">Continue</button>
    <span class="t-caption t-secondary" style="text-align: center">By continuing you agree to the Terms and Privacy Policy.</span>
  </div>
</div>
