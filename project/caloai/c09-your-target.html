<!-- c09-your-target · S09 Personalized Target — daily budget reveal -->
<div class="screen">
  <header class="navbar">
    <span class="nav-back"><span class="icon icon-sm" data-symbol="chevron.left"></span>Back</span>
    <span class="t-footnote t-secondary">Your plan</span>
  </header>
  <div class="body" style="gap: var(--s4)">
    <div class="col" style="align-items: center; gap: var(--s1); padding: var(--s4) var(--s4) 0">
      <span class="t-subhead t-secondary">YOUR DAILY BUDGET</span>
      <span class="t-large">1,820 kcal</span>
      <span class="chip">AI estimate · editable</span>
    </div>
    <div class="row" style="gap: var(--s3); padding: 0 var(--s4)">
      <div class="stat-card" style="background: var(--bg-grouped); border-radius: var(--r-lg)">
        <span class="t-caption t-secondary">PROTEIN</span>
        <span class="t-title2">110 g</span>
      </div>
      <div class="stat-card" style="background: var(--bg-grouped); border-radius: var(--r-lg)">
        <span class="t-caption t-secondary">CARBS</span>
        <span class="t-title2">180 g</span>
      </div>
      <div class="stat-card" style="background: var(--bg-grouped); border-radius: var(--r-lg)">
        <span class="t-caption t-secondary">FAT</span>
        <span class="t-title2">55 g</span>
      </div>
    </div>
    <div style="padding: 0 var(--s4)">
      <div class="paper-card">
        <span class="t-headline">How we calculated this</span>
        <div class="list-row" style="background: transparent; padding: var(--s2) 0">
          <span class="t-subhead grow">Base burn (BMR)</span>
          <span class="t-subhead">1,480 kcal</span>
        </div>
        <div class="list-row" style="background: transparent; padding: var(--s2) 0">
          <span class="t-subhead grow">Light activity</span>
          <span class="t-subhead">+520 kcal</span>
        </div>
        <div class="list-row" style="background: transparent; padding: var(--s2) 0">
          <span class="t-subhead grow">Steady deficit</span>
          <span class="t-subhead">−180 kcal</span>
        </div>
        <span class="t-footnote t-secondary">Mifflin-St Jeor · calculation v3 · weight from HealthKit.</span>
      </div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="bottom-cta">
    <div class="cta-bar">
      <button class="btn grow">Edit target</button>
      <button class="btn btn-primary grow" style="background: #16A34A">Continue</button>
    </div>
  </div>
</div>
