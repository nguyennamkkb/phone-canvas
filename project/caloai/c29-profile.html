<!-- C29 — Profile / Settings. Goal summary, units, diet prefs, integrations, subscription row; Profile tab active. -->
<div class="screen">
  <header class="navbar">
    <span class="nav-title">Profile</span>
    <button class="icon-btn" aria-label="Edit profile">
      <span class="icon icon-sm" data-symbol="pencil"></span>
    </button>
  </header>
  <div class="body" style="padding: var(--s4) var(--s5); gap: var(--s4)">
    <div class="row" style="gap: var(--s3)">
      <span class="avatar">LN</span>
      <div class="col grow" style="gap: var(--s1)">
        <span class="t-title2">Lena Nguyen</span>
        <span class="t-subhead t-secondary">Goal: lose 4 kg · 2,200 kcal/day</span>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <div class="row" style="justify-content: space-between">
        <span class="t-headline">Today's budget</span>
        <span class="t-subhead t-secondary">1,420 kcal left</span>
      </div>
      <div class="meter" aria-label="Calorie budget 35 percent used">
        <span class="meter-seg is-on"></span><span class="meter-seg is-on"></span><span class="meter-seg is-on"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span>
      </div>
    </div>

    <div class="col" style="gap: var(--s2)">
      <span class="t-section">Preferences</span>
      <div class="row-card"><span class="t-subhead grow">Units</span><span class="t-subhead t-secondary">Metric (kg, cm, ml)</span></div>
      <div class="row-card"><span class="t-subhead grow">Diet</span><span class="t-subhead t-secondary">High-protein</span></div>
      <div class="row-card"><span class="t-subhead grow">Excluded foods</span><span class="t-subhead t-secondary">Shellfish, cilantro</span></div>
    </div>

    <div class="col" style="gap: var(--s2)">
      <span class="t-section">Connected</span>
      <div class="row-card"><span class="t-subhead grow">Apple Health</span><span class="chip">Partial</span></div>
      <div class="row-card"><span class="t-subhead grow">Reminders</span><span class="chip">4 on</span></div>
      <div class="row-card"><span class="t-subhead grow">CaloAI Premium</span><span class="chip">Free plan</span></div>
    </div>

    <div class="col" style="gap: var(--s2)">
      <span class="t-section">More</span>
      <div class="row-card"><span class="t-subhead grow">Privacy + data export</span></div>
      <div class="row-card"><span class="t-subhead grow">Help center</span></div>
      <div class="row-card"><span class="t-subhead grow">Sign out</span></div>
    </div>

    <div class="spacer"></div>
    <nav class="tabbar" aria-label="Primary">
      <button class="tab" aria-selected="false">
        <span class="icon icon-sm" data-symbol="book"></span>
        Diary
      </button>
      <button class="tab" aria-selected="false">
        <span class="icon icon-sm" data-symbol="list.bullet"></span>
        Plans
      </button>
      <button class="tab" aria-selected="false">
        <span class="icon icon-sm" data-symbol="chart.bar"></span>
        Progress
      </button>
      <button class="tab is-active" aria-selected="true">
        <span class="icon icon-sm" data-symbol="person"></span>
        Profile
      </button>
    </nav>
  </div>
</div>
