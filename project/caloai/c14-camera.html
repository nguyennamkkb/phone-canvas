<!-- c14-camera · S14 AI Meal Camera — drawn in Ready state (framing guidance +
     capture row). Full machine: Idle → PermissionNeeded → Ready → Capturing →
     Uploading/Analyzing → Review → Confirmed; branches below as comments. -->
<div class="screen">
  <!-- BRANCH PermissionDenied: replace .hero with a PermissionExplainer card
       (what/why + "Open Settings" btn + "Use search instead" recovery action).
       Never block the S13 fallback paths. -->
  <!-- BRANCH Capturing/Analyzing: dim .hero, swap guidance for "Hold still…"
       + cancel control; keep Library/Torch reachable. -->
  <header class="navbar">
    <button class="icon-btn" aria-label="Cancel"><span class="icon icon-sm" data-symbol="xmark"></span></button>
    <span class="t-footnote t-secondary">AI Meal Camera</span>
    <button class="icon-btn" aria-label="How it works"><span class="icon icon-sm" data-symbol="questionmark.circle"></span></button>
  </header>
  <div class="body-fixed" style="gap: var(--s3)">
    <div class="hero" style="height: 380px">
      <div class="col" style="align-items: center; gap: var(--s2)">
        <span class="chip-icon bg-white"><span class="icon" data-symbol="square.grid.2x2"></span></span>
        <span class="t-headline">Center the meal in the frame</span>
        <span class="t-footnote t-secondary">Top-down, good light, one plate.</span>
      </div>
    </div>
    <div class="row" style="justify-content: space-between; padding: 0 var(--s6)">
      <button class="circle-btn" aria-label="Choose from Photos"><span class="icon icon-sm" data-symbol="square.on.square"></span></button>
      <button class="circle-btn is-dashed" style="width: 68px; height: 68px" aria-label="Capture meal">
        <span style="display: block; width: 52px; height: 52px; border-radius: 999px; background: #16A34A"></span>
      </button>
      <button class="circle-btn" aria-label="Toggle torch"><span class="icon icon-sm" data-symbol="bolt.fill"></span></button>
    </div>
    <span class="t-footnote t-secondary" style="text-align: center">Flash is off · photo stays on this device until you log it.</span>
    <div class="spacer"></div>
  </div>
</div>
<!-- STATE MAP (spec README §5): NotDetermined → system prompt once; denied/
     restricted → explainer above; interrupted (call) → resume draft, never lose
     the frame; camera unavailable (Simulator) → jump straight to Library. -->
