<!-- C16 — Meal Detail / Edit. Grilled salmon lunch: items + portions, macro summary, AI estimate provenance, Log CTA. -->
<div class="screen">
  <header class="navbar">
    <button class="icon-btn" aria-label="Back">
      <span class="icon icon-sm" data-symbol="chevron.left"></span>
    </button>
    <span class="nav-title">Lunch · 12:40 PM</span>
    <button class="icon-btn" aria-label="Duplicate meal">
      <span class="icon icon-sm" data-symbol="square.on.square"></span>
    </button>
  </header>
  <div class="body" style="padding: var(--s4) var(--s5); gap: var(--s4)">
    <div class="col" style="gap: var(--s1)">
      <div class="t-title2">Grilled salmon bowl</div>
      <div class="row" style="gap: var(--s2)">
        <span class="chip">Lunch</span>
        <span class="chip">AI estimate</span>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s3)">
      <div class="row-card">
        <div class="col grow" style="gap: var(--s1)">
          <span class="t-headline">Grilled salmon fillet</span>
          <span class="t-subhead t-secondary">150 g · 310 kcal</span>
        </div>
        <button class="icon-btn" aria-label="Edit salmon portion">
          <span class="icon icon-sm" data-symbol="pencil"></span>
        </button>
      </div>
      <div class="row-card">
        <div class="col grow" style="gap: var(--s1)">
          <span class="t-headline">Brown rice</span>
          <span class="t-subhead t-secondary">1 cup · 216 kcal</span>
        </div>
        <button class="icon-btn" aria-label="Edit rice portion">
          <span class="icon icon-sm" data-symbol="pencil"></span>
        </button>
      </div>
      <div class="row-card">
        <div class="col grow" style="gap: var(--s1)">
          <span class="t-headline">Steamed broccoli</span>
          <span class="t-subhead t-secondary">80 g · 28 kcal</span>
        </div>
        <button class="icon-btn" aria-label="Edit broccoli portion">
          <span class="icon icon-sm" data-symbol="pencil"></span>
        </button>
      </div>
      <button class="btn btn-block" style="border: 1px dashed var(--separator)">
        <span class="icon icon-sm" data-symbol="plus"></span>
        Add item
      </button>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <div class="row" style="justify-content: space-between">
        <span class="t-headline">Total</span>
        <span class="t-title2">554 kcal</span>
      </div>
      <div class="meter" aria-label="Protein 38 of 110 grams">
        <span class="meter-seg is-on"></span><span class="meter-seg is-on"></span><span class="meter-seg is-on"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span><span class="meter-seg"></span>
      </div>
      <div class="row" style="justify-content: space-between">
        <span class="t-subhead">Protein 38 g</span>
        <span class="t-subhead">Carbs 52 g</span>
        <span class="t-subhead">Fat 18 g</span>
      </div>
      <span class="t-footnote t-secondary">Some portions are AI-estimated — tap an item to correct.</span>
    </div>

    <div class="row" style="gap: var(--s2)">
      <span class="t-subhead t-secondary">Add a note…</span>
    </div>

    <div class="spacer"></div>
  </div>
  <div class="bottom-cta">
    <button class="btn btn-primary btn-block" style="background: var(--success)">Log meal · 554 kcal</button>
  </div>
</div>
