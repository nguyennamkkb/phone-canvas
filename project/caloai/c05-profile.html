<!-- c05-profile · S05 Body Profile — Step 3 of 6, unit toggle + HealthKit import -->
<div class="screen">
  <header class="navbar">
    <span class="nav-back"><span class="icon icon-sm" data-symbol="chevron.left"></span>Back</span>
    <span class="t-footnote t-secondary">Step 3 of 6</span>
  </header>
  <div class="dots" style="padding: var(--s2) 0">
    <span class="dot is-filled"></span><span class="dot is-filled"></span><span class="dot is-active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="body" style="gap: var(--s3)">
    <div class="col" style="gap: var(--s1); padding: 0 var(--s4)">
      <span class="t-title1">Your body profile</span>
      <span class="t-subhead t-secondary">Used once to estimate your daily burn.</span>
    </div>
    <div style="padding: 0 var(--s4)">
      <div class="segmented-light" role="radiogroup" aria-label="Units">
        <span class="seg is-on" role="radio" aria-checked="true">Metric · kg, cm</span>
        <span class="seg" role="radio" aria-checked="false">Imperial · lb, ft</span>
      </div>
    </div>
    <div class="col" style="gap: var(--s3); padding: 0 var(--s4)">
      <div class="list-row">
        <div class="col grow" style="gap: 2px">
          <span class="t-headline">Age</span>
          <span class="t-footnote t-secondary">32 years old</span>
        </div>
        <span class="icon icon-sm" data-symbol="chevron.right"></span>
      </div>
      <div class="list-row">
        <div class="col grow" style="gap: 2px">
          <span class="t-headline">Height</span>
          <span class="t-footnote t-secondary">165 cm</span>
        </div>
        <span class="icon icon-sm" data-symbol="chevron.right"></span>
      </div>
      <div class="list-row">
        <div class="col grow" style="gap: 2px">
          <span class="t-headline">Current weight</span>
          <span class="t-footnote t-secondary">72 kg · weighed Sep 22</span>
        </div>
        <span class="chip">HealthKit</span>
      </div>
      <div class="col" style="gap: var(--s2)">
        <span class="t-footnote t-secondary">Sex</span>
        <div class="segmented-light" role="radiogroup" aria-label="Sex">
          <span class="seg is-on" role="radio" aria-checked="true">Female</span>
          <span class="seg" role="radio" aria-checked="false">Male</span>
        </div>
      </div>
    </div>
    <span class="t-footnote t-secondary" style="padding: 0 var(--s4)">Weight imported from HealthKit · synced Sep 2026. Tap any row to edit.</span>
    <div class="spacer"></div>
  </div>
  <div class="bottom-cta">
    <button class="btn btn-primary btn-block" style="background: #16A34A">Continue</button>
  </div>
</div>
