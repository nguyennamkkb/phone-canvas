<!-- c05-profile · S05 Body Profile — Step 3 of 6, unit toggle + HealthKit import -->
<div class="screen">
  <header class="navbar">
    <span class="nav-back"><span class="icon icon-sm" data-symbol="chevron.left"></span>Back</span>
    <span class="t-footnote t-secondary">Step 3 of 6</span>
  </header>
  <div class="dots" style="padding: var(--s2) 0">
    <span class="dot is-filled"></span><span class="dot is-filled"></span><span class="dot is-active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="body" style="gap: var(--s4)">
    <span class="t-title1" style="padding: 0 var(--s4)">Profile</span>
    <div style="padding: 0 var(--s4)">
      <div class="segmented-light" role="radiogroup" aria-label="Units">
        <span class="seg is-on" role="radio" aria-checked="true">Metric</span>
        <span class="seg" role="radio" aria-checked="false">Imperial</span>
      </div>
    </div>
    <div style="padding: 0 var(--s4)">
      <div class="paper-card" style="gap: var(--s1)">
        <button class="action-row">
          <span class="chip-icon bg-white"><span class="icon icon-sm" data-symbol="calendar"></span></span>
          <span class="t-headline grow">Age</span>
          <span class="t-title2">32</span>
          <span class="icon icon-sm" data-symbol="chevron.right"></span>
        </button>
        <button class="action-row">
          <span class="chip-icon bg-white"><span class="icon icon-sm" data-symbol="ruler"></span></span>
          <span class="t-headline grow">Height</span>
          <span class="t-title2">165 <span class="t-footnote t-secondary">cm</span></span>
          <span class="icon icon-sm" data-symbol="chevron.right"></span>
        </button>
        <button class="action-row">
          <span class="chip-icon bg-white"><span class="icon icon-sm" data-symbol="person"></span></span>
          <div class="row grow" style="gap: var(--s2)">
            <span class="t-headline">Weight</span>
            <span class="chip">HealthKit</span>
          </div>
          <span class="t-title2">72 <span class="t-footnote t-secondary">kg</span></span>
          <span class="icon icon-sm" data-symbol="chevron.right"></span>
        </button>
        <div class="segmented-light" role="radiogroup" aria-label="Sex">
          <span class="seg is-on" role="radio" aria-checked="true">Female</span>
          <span class="seg" role="radio" aria-checked="false">Male</span>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="bottom-cta">
    <button class="btn btn-primary btn-block" style="background: var(--success)">Continue</button>
  </div>
</div>
