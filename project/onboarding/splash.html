<div class="screen app-mood">
  <div class="body-fixed" style="align-items: center; padding: 0 var(--s6)">
    <div class="spacer"></div>

    <div class="col" style="align-items: center; gap: var(--s4)">
      <span class="face-dot is-4" style="width: 120px; height: 120px">
        <span class="icon icon-lg" data-symbol="heart.fill"></span>
      </span>

      <div class="col" style="align-items: center; gap: var(--s2)">
        <div class="t-title1">Moodtracker</div>
        <p class="t-subhead" style="color: var(--clay); text-align: center">
          A few taps a day. No streaks to break.
        </p>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="paper-card" style="width: 100%; margin-bottom: var(--s6)">
      <div class="row" style="gap: var(--s3)">
        <span class="chip-icon" style="background: var(--sage-soft)">
          <span class="icon icon-sm" data-symbol="sparkles" style="color: var(--sage-deep)"></span>
        </span>
        <div class="grow col" style="gap: 1px">
          <div class="t-footnote" style="color: var(--clay)">Coming up</div>
          <div class="t-subhead">Your first check-in takes ten seconds</div>
        </div>
      </div>
    </div>
  </div>
</div>
