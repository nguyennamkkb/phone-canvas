<!-- pc {"title":"Cast · Sheet 1 Đã lên TV?"} -->
<!--
  Sheet 1/2 sau lần cast ảnh / video THÀNH CÔNG ĐẦU TIÊN (app nhận ack từ TV).
  Hỏi người dùng xác nhận bằng mắt — app biết đã gửi, chỉ người dùng biết
  TV có hiện hay không (sai input, TV ngủ, app TV chặn…).
  Dạng sheet nổi đơn giản (.cast-sheet, tokens.css): tiêu đề nhỏ + X →
  hình nhỏ giữa → tiêu đề đậm → mô tả → 2 nút viên thuốc.
  - Yes, I see it → đổi nội dung sang sheet 2 cast-photo-sale (cùng sheet,
    transition mờ dần). Đây là lúc hài lòng nhất → lúc mời mua.
  - No, it's not showing → màn khắc phục (cùng Wi-Fi, tắt VPN, chọn lại TV)
    — KHÔNG mời mua khi người dùng đang gặp lỗi.
  - X / kéo xuống = "để sau", không hỏi lại trong phiên.
  Chỉ hỏi 1 lần / TV (lần cast thành công đầu), không hỏi mỗi lần.
  Hình: ảnh MỚI cast_check_tv (đã duyệt, đã gắn; prompt ở docs/cast/cast-sheets.md) —
  thay TV vẽ bằng code chứa ảnh thật của người dùng (ghép ảnh thật vào khung
  TV nhỏ khó, ảnh dọc/ngang lệch tỉ lệ). Cùng cỡ + cùng TV với cast_sale_pro.
-->

  height: auto;

</style>
