<style>

.kb1-m1-quiz-option {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--s4);
  width: 100%;
  padding: var(--s2) var(--s4) var(--s2) var(--s2);
  border: 2px solid transparent;
  border-radius: var(--r-xl);
  background: var(--bg-grouped);
  color: var(--label);
  font-family: var(--font);
  text-align: left;
  cursor: pointer;
}
.kb1-m1-quiz-option.is-on {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.kb1-m1-quiz-thumb {
  flex: 0 0 auto;
  width: 96px;
  border-radius: var(--r-lg);
}

img.kb1-m1-quiz-thumb {

}
.kb1-m1-quiz-check {

  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border: 2px solid var(--accent-line);
  border-radius: var(--r-full);
  color: var(--on-accent);
}
.kb1-m1-quiz-option.is-on .kb1-m1-quiz-check {
