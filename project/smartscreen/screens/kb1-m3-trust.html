<!-- pc {"title":"KB1 · 3 Social Proof"} -->
<style>
/* Social proof: ảnh ngang 16:9 + thẻ điểm vắt mép dưới ảnh (overlay + offset),
   bức tường wordmark hãng TV, review xếp chồng (hai dải phía sau = các review
   kế tiếp, vuốt để lật). Số liệu (4.8, 5M+, review) là hằng số / remote config —
   chưa kiểm chứng. Sao dùng accent: gold chỉ dành cho khu Pro. */
.kb1-m3-trust-hero {
  aspect-ratio: 16 / 9;
}
.kb1-m3-trust-score {
  height: auto;
  gap: var(--s3);
  padding: var(--s2) var(--s4) var(--s2) var(--s3);
  border-radius: var(--r-lg);
}
.kb1-m3-trust-stars {
  display: flex;
  flex-direction: row;
  gap: 2px;
  color: var(--accent);
}
.kb1-m3-trust-wall {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--s4);
  margin-right: calc(-1 * var(--ob-gutter));
  color: var(--label-2);
  font-size: var(--t-title3);
  font-weight: 800;
  letter-spacing: -0.4px;
  white-space: nowrap;
}
.kb1-m3-trust-sep {
  width: 5px;
  height: 5px;
  flex: 0 0 auto;
  border-radius: var(--r-full);
  background: var(--accent-line);
}
/* chồng thẻ: dải sau hẹp dần, chỉ lộ mép trên */
.kb1-m3-trust-deck {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.kb1-m3-trust-back {
  height: 10px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.kb1-m3-trust-back.is-2 {
  width: 82%;
  background: var(--accent-line);
}
.kb1-m3-trust-back.is-1 {
  width: 91%;
  background: var(--accent-soft);
}
.kb1-m3-trust-quote {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  width: 100%;
  padding: var(--s5);
  border: 1.5px solid var(--accent-soft);
  border-radius: var(--r-xl);
  background: var(--bg);
  box-shadow: 0 12px 32px var(--ob-shadow);
}
.kb1-m3-trust-mark {
  color: var(--accent);
}
</style>
<div class="screen" style="background-color: var(--bg)">
  <div class="body-fixed" style="gap: 0">
    <div class="ob-steps" role="progressbar" aria-label="Step 3 of 8" aria-valuenow="3" aria-valuemin="1" aria-valuemax="8"><i class="ob-step is-done"></i><i class="ob-step is-done"></i><i class="ob-step is-done"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i><i class="ob-step"></i></div>

    <div class="ob-scroll" style="gap: var(--s5); padding-top: var(--s5)">
      <div class="ob-hero" style="padding-bottom: var(--s6)">
        <img class="art ob-hero-img kb1-m3-trust-hero" src="/images/ob_hero_trust.png" width="342" height="192" alt="ob_hero_trust" data-asset="ob_hero_trust" />
        <div class="ob-float kb1-m3-trust-score" style="bottom: 0; left: var(--s4)" aria-label="Rated 4.8 out of 5 on the App Store">
          <span class="t-stat">4.8</span>
          <div class="col" style="gap: 2px">
            <span class="kb1-m3-trust-stars">
              <span class="icon icon-xs" data-symbol="star.fill"></span>
              <span class="icon icon-xs" data-symbol="star.fill"></span>
              <span class="icon icon-xs" data-symbol="star.fill"></span>
              <span class="icon icon-xs" data-symbol="star.fill"></span>
              <span class="icon icon-xs" data-symbol="star.fill"></span>
            </span>
            <span class="t-caption t-secondary">App Store rating</span>
          </div>
        </div>
      </div>

      <h1 class="ob-display">Trusted by <span class="ob-hl">5M+</span> Happy Users Globally</h1>

      <div class="kb1-m3-trust-wall" aria-label="Works with Samsung, LG, Sony, Roku, Chromecast, Fire TV">
        <span>Samsung</span><i class="kb1-m3-trust-sep"></i>
        <span>LG</span><i class="kb1-m3-trust-sep"></i>
        <span>Sony</span><i class="kb1-m3-trust-sep"></i>
        <span>Roku</span><i class="kb1-m3-trust-sep"></i>
        <span>Chromecast</span><i class="kb1-m3-trust-sep"></i>
        <span>Fire TV</span>
      </div>

      <div class="kb1-m3-trust-deck">
        <i class="kb1-m3-trust-back is-2"></i>
        <i class="kb1-m3-trust-back is-1"></i>
        <div class="kb1-m3-trust-quote">
          <span class="icon icon-lg kb1-m3-trust-mark" data-symbol="text.quote"></span>
          <p class="t-body">Connecting to my Samsung TV is so smooth, and the whiteboard is perfect for teaching!</p>
          <span class="t-footnote t-secondary">Minh Anh · App Store review</span>
        </div>
      </div>
    </div>

    <div class="ob-foot">
      <button class="ob-cta">Start Connecting <span class="icon icon-sm" data-symbol="arrow.right"></span></button>
    </div>
  </div>
</div>
