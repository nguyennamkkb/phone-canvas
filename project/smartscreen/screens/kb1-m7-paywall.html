<style>
/* T5 – Paywall tối, giải phẫu lấy từ paywall-kit/ai-chat (Value Stack +

   blue500, gold chỉ ở nhãn Best Value). Hard paywall: không có [X].
   Khác ai-chat có chủ đích: giá tổng /year in to bằng giá chính (Guideline
   3.1.2), nút [X] hiện trễ, banner điện ảnh 21:9 tràn viền thay hero vuông, quyền lợi lưới 2×2,
   Restore nổi trên banner + Terms + Privacy đủ cả ba.
   [X] HIỆN TRỄ (lệch AI-UI-NOTES có chủ đích, đã duyệt): ẩn 3s đầu rồi mờ dần
   hiện ở góc trên trái, mờ 60%; chạm → Exit Offer (kb1-m7-exit-offer).
   Giá: TODO price — StoreKit; chưa có thì $—.——. */
.kb1-m7-paywall-close {
  position: absolute;
  top: var(--s2);
  left: var(--s4);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--r-full);
  background: var(--pro-scrim);
  color: var(--pro-ink-2);
  opacity: 0.6;
  cursor: pointer;
}
.kb1-m7-paywall-restore {
  position: absolute;
  top: var(--s2);
  right: var(--s4);
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--s4);
  border: 0;
  border-radius: var(--r-full);
  background: var(--pro-top); /* đặc: chi tiết ảnh không lộ sau chữ */
  color: var(--pro-ink-2);

  font-size: var(--t-subhead);
  cursor: pointer;
}
.kb1-m7-paywall-banner {
  margin: 0 calc(-1 * var(--ob-gutter));
}
.kb1-m7-paywall-hero {
  /* TRÀN VIỀN TRÊN. SwiftUI: Image("ob_hero_paywall_pro") .aspectFill
     .ignoresSafeArea(edges: .top) + mask LinearGradient mờ mép dưới về nền.
     Board không vẽ được dưới status bar (shell đặt nó ngoài viewport), nên ảnh
     ở /images/ là bản đã pha mép trên/dưới về đúng màu nền → nối liền status
     bar. Asset gốc cho app: project/smartscreen/assets/. Tạo 16:9, cắt 21:9. */
  width: 100%;
  height: auto;
  aspect-ratio: 21 / 9;
  object-fit: cover;
}
.kb1-m7-paywall-perk {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--s2);
  flex: 1 1 0;
  min-width: 0;
  font-size: var(--t-footnote);
  font-weight: 600;
  white-space: nowrap;
}
.kb1-m7-paywall-perk:first-child {
  flex: 0 0 42%;
}
.kb1-m7-paywall-hl {
  color: var(--accent-line);
}
.kb1-m7-paywall-check {
  color: var(--accent-line);
}
.kb1-m7-paywall-trial {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--s3);
  min-height: 44px;
}
.kb1-m7-paywall-toggle {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-end;
  flex: 0 0 auto;
  width: 51px;
  height: 31px;
  padding: 2px;
  border: 0;
  border-radius: var(--r-full);
  background: var(--accent);
}
.kb1-m7-paywall-knob {
  width: 27px;
  height: 27px;
  border-radius: var(--r-full);
  background: var(--pro-ink);
}
.kb1-m7-paywall-plan {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 72px;

  border: 1.5px solid var(--pro-line);
  border-radius: var(--r-lg);
  background: var(--pro-card);
  color: var(--pro-ink);
  font-family: var(--font);
  text-align: left;
  cursor: pointer;
}
.kb1-m7-paywall-plan.is-on {

}
/* nhãn vắt mép trên thẻ: absolute top 0 + margin âm nửa chiều cao (rule 5),

.kb1-m7-paywall-tag {

  right: var(--s4);

  color: var(--pro-top);
  font-size: var(--t-caption);
  font-weight: 700;
  white-space: nowrap;
}
.kb1-m7-paywall-price {

  line-height: 32px;
  letter-spacing: -0.4px;
  white-space: nowrap;
}
.kb1-m7-paywall-legal {

  align-items: center;
  min-height: 44px;

  background: transparent;
  color: var(--pro-ink-2);
  font-family: var(--font);
  font-size: var(--t-caption);
  text-decoration: underline;
  cursor: pointer;
}
