<style>
.wl-nm-x {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: var(--touch-min);
  color: var(--wl-card);
}
.wl-nm-sq {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 68px;
  height: 68px;
  border: 0;
  border-radius: var(--r-lg);
  background: var(--wl-yellow);
}
.wl-nm-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: var(--r-full);
  background: var(--wl-card);
}
.wl-nm-title {
  color: var(--wl-card);
  font-family: var(--font);
  font-size: var(--t-title3);
  font-weight: 800;
  line-height: 25px;
  text-align: center;
}
.wl-nm-by {
  color: var(--wl-dim);
  font-family: var(--font);
  font-size: var(--t-footnote);
  font-weight: 400;
  line-height: 18px;
  text-align: center;
}
</style>
<div class="screen" style="background-color: var(--wl-canvas); padding: var(--s1) var(--s3); gap: var(--s1)">
  <div class="col" style="gap: 0">
    <div class="row" style="gap: 0; justify-content: space-between; align-items: center">
      <span class="wl-nm-x" aria-label="Close">
        <span class="icon icon-xs" data-symbol="xmark"></span>
      </span>
      <span class="icon icon-xs" data-symbol="ellipsis" style="color: var(--wl-dim)"></span>
    </div>
  </div>

    <div class="wl-nm-sq">
      <span class="icon" data-symbol="envelope.fill" style="color: var(--wl-card); width: 40px; height: 40px"></span>
      <span class="wl-nm-badge" aria-hidden="true"></span>
    </div>
    <div class="col" style="gap: 0; align-items: center">
      <div class="wl-nm-title">New Mails!</div>
      <div class="wl-nm-by">by UlB, Dribbble, +3</div>
    </div>
  </div>
