<!-- pc {"title":"Contacts","deviceId":"watch-45","lightStatusBar":true} -->
<style>
.wl-cl-back {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: 32px;
  color: var(--wl-ink);
}
.wl-cl-title {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 600;
  line-height: 20px;
  color: var(--wl-ink);
  text-align: center;
  white-space: nowrap;
}
.wl-cl-more {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: 32px;
  color: var(--wl-ink);
}
.wl-cl-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--s2);
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--s1) var(--s2);
  border: 0;
  border-radius: var(--r-md);
  background: var(--wl-key);
  cursor: pointer;
  text-align: left;
}
/* Honest placeholders: collage avatars unreadable at build size — tinted
   initials discs, declared in handback. */
.wl-cl-disc {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: var(--r-md);
  font-family: var(--font);
  font-size: var(--t-footnote);
  font-weight: 700;
  line-height: 18px;
}
.wl-cl-disc.is-a {
  background: var(--wl-purple);
  color: var(--wl-card);
}
.wl-cl-disc.is-s {
  background: var(--wl-yellow);
  color: var(--wl-ink);
}
.wl-cl-disc.is-d {
  background: var(--wl-gray);
  color: var(--wl-ink);
}
.wl-cl-name {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 600;
  line-height: 20px;
  color: var(--wl-ink);
  white-space: nowrap;
}
.wl-cl-dots {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: var(--s1);
}
.wl-cl-dot {
  flex: 0 0 auto;
  width: 4px;
  height: 4px;
  border-radius: var(--r-full);
  background: var(--wl-dots);
}
.wl-cl-dot.is-on {
  background: var(--wl-ink);
}
</style>
<div class="screen" style="background-color: var(--wl-card); padding: var(--s1) var(--s2); gap: 0">
  <div class="row" style="gap: 0; align-items: center">
    <span class="wl-cl-back" aria-hidden="true">
      <span class="icon icon-xs" data-symbol="chevron.left"></span>
    </span>
    <div class="wl-cl-title" style="flex: 1 1 auto; min-width: 0">Your Contacts</div>
    <span class="wl-cl-more" aria-hidden="true">
      <span class="icon icon-xs" data-symbol="ellipsis"></span>
    </span>
  </div>
  <div class="col" style="flex: 1 1 auto; min-height: 0; gap: var(--s2); justify-content: center">
    <button class="wl-cl-row" aria-label="Allan Simmon">
      <span class="wl-cl-disc is-a" aria-hidden="true">AS</span>
      <span class="wl-cl-name">Allan Simmon</span>
    </button>
    <button class="wl-cl-row" aria-label="Scott Warne">
      <span class="wl-cl-disc is-s" aria-hidden="true">SW</span>
      <span class="wl-cl-name">Scott Warne</span>
    </button>
    <button class="wl-cl-row" aria-label="Dama McBrown">
      <span class="wl-cl-disc is-d" aria-hidden="true">DM</span>
      <span class="wl-cl-name">Dama McBrown</span>
    </button>
  </div>
  <div class="wl-cl-dots" aria-hidden="true">
    <span class="wl-cl-dot is-on"></span>
    <span class="wl-cl-dot"></span>
    <span class="wl-cl-dot"></span>
    <span class="wl-cl-dot"></span>
  </div>
</div>
