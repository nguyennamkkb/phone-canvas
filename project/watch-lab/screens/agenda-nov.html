<!-- pc {"title":"November Agenda","deviceId":"watch-45","lightStatusBar":true} -->
<style>
.wl-title {
  flex: 0 0 auto;
  white-space: nowrap;
  color: var(--wl-card);
  font-family: var(--font);
  font-size: var(--t-footnote);
  font-weight: 600;
}
.wl-event {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: var(--s1) var(--s2);
  border: 0;
  border-radius: var(--r-md);
  background: var(--wl-pill);
  gap: var(--s1);
}
.wl-event.is-accent {
  background: var(--wl-accent);
  padding: var(--s3) var(--s2);
}
.wl-when {
  color: var(--wl-card);
  font-family: var(--font);
  font-size: var(--t-caption);
  font-weight: 600;
  line-height: 15px;
  white-space: nowrap;
}
.wl-what {
  color: var(--wl-card);
  font-family: var(--font);
  font-size: var(--t-caption);
  font-weight: 400;
  line-height: 15px;
  white-space: nowrap;
}
.wl-what.is-bold {
  font-weight: 700;
}
.wl-what.is-faint {
  color: var(--wl-dim);
}
.wl-event.is-accent .wl-when,
.wl-event.is-accent .wl-what {
  color: var(--wl-accent-ink);
}
.dot.wl-page {
  background: var(--wl-dim);
}
.dot.wl-page.is-on {
  background: var(--wl-card);
}
</style>
<div class="screen" style="background-color: var(--wl-canvas); padding: var(--s1) var(--s3); gap: var(--s1)">
  <div class="row" style="gap: 0; align-items: center; justify-content: space-between">
    <span class="icon icon-xs" data-symbol="chevron.left" style="color: var(--wl-card)"></span>
    <span class="wl-title">2. November</span>
    <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--wl-card)"></span>
  </div>
  <div class="col" style="gap: var(--s1); flex: 1 1 auto; min-height: 0; justify-content: center">
    <div class="wl-event">
      <div class="grow col" style="gap: 0">
        <div class="wl-when">8:30 AM</div>
        <div class="wl-what is-bold">Meeting</div>
      </div>
      <span class="icon icon-xs" data-symbol="ellipsis" style="color: var(--wl-dim)"></span>
    </div>
    <div class="wl-event">
      <div class="grow col" style="gap: 0">
        <div class="wl-when">9:00 AM</div>
        <div class="wl-what is-faint">Call</div>
      </div>
      <span class="icon icon-xs" data-symbol="ellipsis" style="color: var(--wl-dim)"></span>
    </div>
    <div class="wl-event">
      <div class="grow col" style="gap: 0">
        <div class="wl-when">11:45 AM</div>
        <div class="wl-what">Breakfast with friend</div>
      </div>
      <span class="icon icon-xs" data-symbol="ellipsis" style="color: var(--wl-dim)"></span>
    </div>
    <div class="wl-event is-accent">
      <div class="wl-when" style="flex: 1 1 0">7:00 PM</div>
      <span class="icon icon-xs" data-symbol="ellipsis" style="color: var(--wl-accent-ink)"></span>
    </div>
  </div>
  <div class="dots" aria-hidden="true">
    <span class="dot wl-page is-on"></span>
    <span class="dot wl-page"></span>
    <span class="dot wl-page"></span>
    <span class="dot wl-page"></span>
  </div>
</div>
