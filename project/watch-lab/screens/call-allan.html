<!-- pc {"title":"Voice Call","deviceId":"watch-45","lightStatusBar":true} -->
<style>
.wl-vc-close {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: 32px;
  color: var(--wl-card);
}
.wl-vc-more {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: 32px;
  color: var(--wl-card);
}
/* Honest placeholder: photo unreadable at build size — initials disc,
   same wl-disc pattern as contact-allan, declared. */
.wl-vc-disc {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: var(--r-lg);
  background: var(--wl-disc);
  color: var(--wl-card);
  font-family: var(--font);
  font-size: var(--t-title3);
  font-weight: 700;
}
.wl-vc-name {
  font-family: var(--font);
  font-size: 19px;
  font-weight: 700;
  line-height: 24px;
  letter-spacing: -0.4px;
  color: var(--wl-card);
  text-align: center;
}
.wl-vc-dur {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 400;
  line-height: 20px;
  color: var(--wl-dim);
  text-align: center;
}
.wl-vc-btn {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: var(--touch-min);
  padding: 0;
  border: 0;
  border-radius: var(--r-full);
  background: var(--wl-pill);
  color: var(--wl-card);
  cursor: pointer;
}
.wl-vc-btn.is-end {
  background: var(--wl-yellow);
  color: var(--wl-ink);
}
.wl-vc-dots {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: var(--s1);
}
.wl-vc-dot {
  flex: 0 0 auto;
  width: 4px;
  height: 4px;
  border-radius: var(--r-full);
  background: var(--wl-pill);
}
.wl-vc-dot.is-on {
  background: var(--wl-card);
}
</style>
<div class="screen" style="background-color: var(--wl-canvas); padding: var(--s1) var(--s3); gap: 0">
  <div class="row" style="gap: 0; align-items: center">
    <button class="wl-vc-close" aria-label="Close" style="background: transparent; border: 0; padding: 0; cursor: pointer; height: var(--touch-min)">
      <span class="icon icon-xs" data-symbol="xmark"></span>
    </button>
    <span style="flex: 1 1 auto; min-width: 0" aria-hidden="true"></span>
    <span class="wl-vc-more" aria-hidden="true">
      <span class="icon icon-xs" data-symbol="ellipsis"></span>
    </span>
  </div>
  <div class="col" style="flex: 1 1 auto; min-height: 0; gap: var(--s1); align-items: center; justify-content: center">
    <div class="wl-vc-disc" aria-label="Allan Simmon">AS</div>
    <div class="wl-vc-name">Allan Simmon</div>
    <div class="wl-vc-dur">3:40 min</div>
    <div class="row" style="gap: var(--s2); justify-content: center; margin-top: var(--s1)">
      <button class="wl-vc-btn" aria-label="Keypad">
        <span class="icon icon-xs" data-symbol="keypad"></span>
      </button>
      <button class="wl-vc-btn" aria-label="Mute">
        <span class="icon icon-xs" data-symbol="mic.off"></span>
      </button>
      <button class="wl-vc-btn is-end" aria-label="End call">
        <span class="icon icon-xs" data-symbol="phone.down"></span>
      </button>
    </div>
  </div>
  <div class="wl-vc-dots" aria-hidden="true">
    <span class="wl-vc-dot is-on"></span>
    <span class="wl-vc-dot"></span>
    <span class="wl-vc-dot"></span>
    <span class="wl-vc-dot"></span>
  </div>
</div>
