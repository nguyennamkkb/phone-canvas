<!-- pc {"title":"Weather","deviceId":"watch-45","lightStatusBar":true} -->
<style>
.wl-w-back {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: 32px;
  color: var(--wl-card);
}
.wl-w-title {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 600;
  line-height: 20px;
  color: var(--wl-card);
  text-align: center;
  white-space: nowrap;
}
.wl-w-more {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--touch-min);
  height: 32px;
  color: var(--wl-card);
}
.wl-w-sun {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--wl-yellow);
}
.wl-w-temp {
  font-family: var(--font);
  font-size: 40px;
  font-weight: 800;
  line-height: 44px;
  letter-spacing: -1px;
  color: var(--wl-card);
  text-align: center;
}
.wl-w-city {
  font-family: var(--font);
  font-size: var(--t-subhead);
  font-weight: 400;
  line-height: 20px;
  color: var(--wl-dim);
  text-align: center;
}
/* Honest read of the crop: 3 mini glyphs, no labels under them. */
.wl-w-bar {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: var(--s5);
  width: 100%;
  padding: var(--s2) 0;
  border: 0;
  border-radius: var(--r-md);
  background: var(--wl-yellow);
  color: var(--wl-card);
}
</style>
<div class="screen" style="background-color: var(--wl-canvas); padding: var(--s1) var(--s3); gap: 0">
  <div class="row" style="gap: 0; align-items: center">
    <span class="wl-w-back" aria-hidden="true">
      <span class="icon icon-xs" data-symbol="chevron.left"></span>
    </span>
    <div class="wl-w-title" style="flex: 1 1 auto; min-width: 0">Weather</div>
    <span class="wl-w-more" aria-hidden="true">
      <span class="icon icon-xs" data-symbol="ellipsis"></span>
    </span>
  </div>
  <div class="col" style="flex: 1 1 auto; min-height: 0; gap: var(--s1); align-items: center; justify-content: center">
    <div class="wl-w-sun" aria-hidden="true">
      <span class="icon" data-symbol="sun" style="width: 44px; height: 44px"></span>
    </div>
    <div class="wl-w-temp">17&deg; C</div>
    <div class="wl-w-city">Berlin, Germany</div>
  </div>
  <div class="row" style="gap: 0">
    <button class="wl-w-bar" aria-label="Forecast: sunny, cloudy, sunny" style="flex: 1 1 auto; min-height: var(--touch-min); cursor: pointer">
      <span style="display: flex; flex-direction: row; gap: var(--s5); align-items: center; justify-content: center">
        <span class="icon icon-sm" data-symbol="sun"></span>
        <span class="icon icon-sm" data-symbol="cloud"></span>
        <span class="icon icon-sm" data-symbol="sun"></span>
      </span>
    </button>
  </div>
</div>
