<!-- pc {"title":"Home"} -->
<div class="screen" data-tab-active="home" style="background-color: var(--bg)">
  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="row" style="align-items: center">
      <div class="hy-tile" style="border-radius: var(--r-full); background: var(--surface)">
        <span class="t-headline">BS</span>
      </div>
      <div class="grow col" style="gap: 0">
        <div class="t-footnote" style="color: var(--label-2)">Good Morning</div>
        <div class="t-headline">Brooklyn Simmons</div>
      </div>
      <div class="hy-tile" style="border-radius: var(--r-full); background: var(--surface)">
        <span class="icon icon-sm" data-symbol="bell"></span>
      </div>
    </div>

    <div class="row" style="gap: var(--s3)">
      <div class="grow row" style="gap: var(--s2); padding: var(--s3) var(--s4); border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--divider); align-items: center">
        <span class="icon icon-sm" data-symbol="magnifyingglass" style="color: var(--label-2)"></span>
        <span class="t-subhead" style="color: var(--label-2)">Search..</span>
      </div>
      <div class="hy-tile" style="background: var(--surface)">
        <span class="icon icon-sm" data-symbol="calendar"></span>
      </div>
    </div>

    <div class="hy-card-tint">
      <div class="t-headline">Today, 21 May 2025</div>
      <div class="row" style="gap: var(--s2)">
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Sun</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--surface); text-align: center; width: 100%">20</span>
        </div>
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Mon</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--label); color: var(--bg); text-align: center; width: 100%">21</span>
        </div>
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Tue</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--surface); text-align: center; width: 100%">22</span>
        </div>
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Wed</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--surface); text-align: center; width: 100%">23</span>
        </div>
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Thu</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--surface); text-align: center; width: 100%">24</span>
        </div>
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Fri</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--surface); text-align: center; width: 100%">25</span>
        </div>
        <div class="col" style="gap: var(--s1); align-items: center; flex: 1 1 0; min-width: 0">
          <span class="t-caption" style="color: var(--label-2)">Sat</span>
          <span class="t-subhead" style="padding: var(--s2) 0; border-radius: var(--r-full); background: var(--surface); text-align: center; width: 100%">26</span>
        </div>
      </div>
      <div class="row" style="gap: var(--s3)">
        <div class="grow col" style="gap: var(--s1); padding: var(--s3); border-radius: var(--r-lg); background: var(--surface)">
          <div class="row" style="align-items: center">
            <span class="icon icon-sm" data-symbol="flame"></span>
            <span class="grow"></span>
            <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--label-2)"></span>
          </div>
          <div class="t-headline">140 kcal</div>
          <div class="t-caption" style="color: var(--label-2)">Calories Burn</div>
        </div>
        <div class="grow col" style="gap: var(--s1); padding: var(--s3); border-radius: var(--r-lg); background: var(--surface)">
          <div class="row" style="align-items: center">
            <span class="icon icon-sm" data-symbol="feather"></span>
            <span class="grow"></span>
            <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--label-2)"></span>
          </div>
          <div class="t-headline">200 bpm</div>
          <div class="t-caption" style="color: var(--label-2)">Heart Rate</div>
        </div>
        <div class="grow col" style="gap: var(--s1); padding: var(--s3); border-radius: var(--r-lg); background: var(--surface)">
          <div class="row" style="align-items: center">
            <span class="icon icon-sm" data-symbol="clock"></span>
            <span class="grow"></span>
            <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--label-2)"></span>
          </div>
          <div class="t-headline">03.00 min</div>
          <div class="t-caption" style="color: var(--label-2)">Workout Time</div>
        </div>
      </div>
    </div>

    <div class="hy-card">
      <div class="row" style="align-items: center">
        <div class="grow col" style="gap: var(--s1)">
          <div class="hy-title">Daily Drink Target</div>
          <div class="t-subhead" style="color: var(--label-2)">400ml water(2 Glass)</div>
        </div>
        <div class="ring" style="--ring-size: 132px">
          <img class="ring-arcs" src="/project/hydro/assets/ring-daily.svg" width="132" height="132" alt="Daily drink progress ring" />
          <div class="col" style="align-items: center; gap: 0">
            <span class="t-headline">2210ml</span>
            <span class="t-caption" style="color: var(--label-2)">400ml</span>
          </div>
        </div>
      </div>
      <div class="row" style="gap: var(--s3); align-items: center">
        <div class="grow t-headline" style="padding: var(--s3) var(--s4); border-radius: var(--r-full); background: var(--surface-variant)">Drink 200 ml</div>
        <div class="hy-tile" style="border-radius: var(--r-full)">
          <img class="art" src="/project/hydro/assets/cup.svg" width="24" height="24" alt="Cup" />
        </div>
      </div>
    </div>

    <div class="hy-card">
      <div class="row" style="align-items: center">
        <div class="grow hy-title">Hydration Stats</div>
        <div class="row" style="gap: var(--s1); align-items: center">
          <span class="t-caption" style="color: var(--label-2)">This Week</span>
          <span class="icon icon-xs" data-symbol="chevron.down" style="color: var(--label-2)"></span>
        </div>
      </div>
      <div class="chart is-compact">
        <div class="chart-col"><div class="bar" style="height: 34%; background: var(--accent)"></div></div>
        <div class="chart-col"><div class="bar" style="height: 52%; background: var(--accent)"></div></div>
        <div class="chart-col"><div class="bar" style="height: 88%; background: var(--accent)"></div></div>
        <div class="chart-col"><div class="bar" style="height: 58%; background: var(--accent)"></div></div>
        <div class="chart-col"><div class="bar" style="height: 72%; background: var(--accent)"></div></div>
      </div>
    </div>
  </div>

  <button class="hy-tab" data-tab="home">
    <span class="icon" data-symbol="house"></span>
    <span>Home</span>
  </button>
  <button class="hy-tab" data-tab="alarm">
    <span class="icon" data-symbol="clock"></span>
    <span>Alarm</span>
  </button>
  <button class="hy-tab" data-tab="statistics">
    <span class="icon" data-symbol="chart.bar"></span>
    <span>Statistics</span>
  </button>
  <button class="hy-tab" data-tab="settings">
    <span class="icon" data-symbol="gear"></span>
    <span>Settings</span>
  </button>
</div>
