<!-- pc {"title":"Reminders"} -->
<div class="screen" data-tab-active="alarm" style="background-color: var(--bg)">
  <button data-slot="back" aria-label="Back" style="min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0">
    <span style="display: flex; padding: var(--s2); border: 1px solid var(--control-border); border-radius: var(--r-sm)">
      <span class="icon icon-sm" data-symbol="chevron.left"></span>
    </span>
  </button>
  <span data-slot="title" class="t-headline">Reminders</span>
  <button data-slot="right" aria-label="More options" style="min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0">
    <span style="display: flex; padding: var(--s2); border: 1px solid var(--control-border); border-radius: var(--r-sm)">
      <span class="icon icon-sm" data-symbol="ellipsis"></span>
    </span>
  </button>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="row" style="align-items: center">
      <span class="hy-tile" style="border-radius: var(--r-full); background: var(--surface)">
        <span class="icon icon-sm" data-symbol="heart.fill"></span>
      </span>
      <div class="grow ring" style="--ring-size: 220px">
        <img class="ring-arcs" src="/project/hydro/assets/ring-today-base.svg" width="220" height="220" alt="Today intake track and level" />
        <img class="ring-arcs" src="/project/hydro/assets/ring-today-arc.svg" width="220" height="220" alt="Today intake progress arc, 800 of 2210 ml" />
        <span style="position: absolute; left: 83.1%; top: 77.7%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: var(--r-full); background: var(--accent); border: 4px solid var(--surface)"></span>
        <div class="col" style="align-items: center; gap: 0">
          <span class="t-title3">800/2210ml</span>
        </div>
      </div>
      <span class="hy-tile" style="border-radius: var(--r-full); background: var(--surface)">
        <span class="icon icon-sm" data-symbol="drop.fill"></span>
      </span>
    </div>

    <div class="col" style="gap: var(--s2); align-items: center">
      <div class="row" style="gap: var(--s1); align-items: center">
        <span class="t-headline">Today</span>
        <span class="icon icon-xs" data-symbol="chevron.down"></span>
      </div>
      <div class="row" style="gap: var(--s2); align-items: center">
        <span class="t-subhead" style="padding: var(--s2) var(--s4); border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--divider)">09:00 AM</span>
        <span class="t-caption" style="color: var(--label-2)">–</span>
        <span class="t-subhead" style="padding: var(--s2) var(--s4); border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--divider)">2h</span>
        <span class="t-caption" style="color: var(--label-2)">–</span>
        <span class="t-subhead" style="padding: var(--s2) var(--s4); border-radius: var(--r-full); background: var(--surface); border: 1px solid var(--divider)">11:00 PM</span>
      </div>
    </div>

    <div class="hy-title">Today's records</div>
    <div class="hy-card">
      <div class="row" style="align-items: center">
        <span class="hy-tile">
          <span class="icon" data-symbol="hourglass"></span>
        </span>
        <div class="grow col" style="gap: 0">
          <span class="t-headline">05:00 PM</span>
          <span class="t-footnote" style="color: var(--label-2)">Next time</span>
        </div>
        <span class="t-headline">200 ml</span>
        <span class="icon icon-sm" data-symbol="hourglass" style="color: var(--label-2)"></span>
      </div>
    </div>
    <div class="hy-card">
      <div class="row" style="align-items: center">
        <span class="hy-tile">
          <span class="icon" data-symbol="drop.fill"></span>
        </span>
        <div class="grow col" style="gap: 0">
          <span class="t-headline">03:00 PM</span>
          <span class="t-footnote" style="color: var(--label-2)">Water</span>
        </div>
        <span class="t-headline">200 ml</span>
        <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--label-2)"></span>
      </div>
    </div>
    <div class="hy-card">
      <div class="row" style="align-items: center">
        <span class="hy-tile">
          <img class="art" src="/project/hydro/assets/cup.svg" width="24" height="24" alt="Cup" />
        </span>
        <div class="grow col" style="gap: 0">
          <span class="t-headline">01:00 PM</span>
          <span class="t-footnote" style="color: var(--label-2)">Coffee</span>
        </div>
        <span class="t-headline">200 ml</span>
        <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--label-2)"></span>
      </div>
    </div>
  </div>

  <button class="hy-tab" data-tab="home">
    <span class="icon" data-symbol="house"></span>
    <span>Home</span>
  </button>
  <button class="hy-tab" data-tab="alarm">
    <span class="icon" data-symbol="clock"></span>
    <span>Alarm</span>
  </button>
  <button class="hy-tab" data-tab="statistics">
    <span class="icon" data-symbol="chart.bar"></span>
    <span>Statistics</span>
  </button>
  <button class="hy-tab" data-tab="settings">
    <span class="icon" data-symbol="gear"></span>
    <span>Settings</span>
  </button>
</div>
