<!-- pc {"title":"AI result confirm"} -->
<div class="screen app-mood" style="background-color: var(--bg)">
  <div class="body-fixed" style="padding: var(--s4) var(--s4) var(--s5); gap: var(--s4)">
    <div class="navbar" style="padding: 0">
      <button class="pill-ghost" style="border-color: transparent; height: auto; padding-top: var(--s3); padding-bottom: var(--s3)">Hủy</button>
      <span class="t-headline">Xác nhận món ăn</span>
      <button class="nav-round is-hollow" aria-label="Chụp lại ảnh">
        <span class="icon icon-sm" data-symbol="camera"></span>
      </button>
    </div>

    <div class="row-card">
      <img class="art" src="/project/calo-ai/assets/pho.svg" width="56" height="56" alt="Pho bo" style="border-radius: var(--r-md)" />
      <div class="grow col" style="gap: 0">
        <div class="t-headline">Phở bò · ~520 kcal</div>
        <div class="t-subhead t-secondary">2 món · Bánh phở, thịt bò</div>
      </div>
      <span class="pill-soft">
        <span class="icon icon-xs" data-symbol="sparkles"></span>
        Chắc 82%
      </span>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Thành phần · 2 món</span>
      <div class="col" style="gap: var(--s2)">
        <div class="row" style="justify-content: space-between; align-items: center">
          <div class="t-headline">Bánh phở · 180 kcal</div>
          <button style="display: flex; flex: 0 0 auto; min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2)" aria-label="Xóa bánh phở">
            <span class="icon icon-sm" data-symbol="xmark" style="color: var(--faint)"></span>
          </button>
        </div>
        <div class="row" style="justify-content: space-between; align-items: center">
          <button class="nav-round is-hollow" aria-label="Giảm 10 gam bánh phở">
            <span class="icon icon-sm" data-symbol="minus"></span>
          </button>
          <div class="t-title3">200g</div>
          <button class="nav-round is-hollow" aria-label="Tăng 10 gam bánh phở">
            <span class="icon icon-sm" data-symbol="plus"></span>
          </button>
        </div>
      </div>
      <div class="col" style="gap: var(--s2)">
        <div class="row" style="justify-content: space-between; align-items: center">
          <div class="t-headline">Thịt bò · 250 kcal</div>
          <button style="display: flex; flex: 0 0 auto; min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2)" aria-label="Xóa thịt bò">
            <span class="icon icon-sm" data-symbol="xmark" style="color: var(--faint)"></span>
          </button>
        </div>
        <div class="row" style="justify-content: space-between; align-items: center">
          <button class="nav-round is-hollow" aria-label="Giảm 10 gam thịt bò">
            <span class="icon icon-sm" data-symbol="minus"></span>
          </button>
          <div class="t-title3">120g</div>
          <button class="nav-round is-hollow" aria-label="Tăng 10 gam thịt bò">
            <span class="icon icon-sm" data-symbol="plus"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Khẩu phần</span>
      <div class="segmented-light" role="group" aria-label="Mức khẩu phần">
        <button class="seg" style="height: auto; padding-top: var(--s2); padding-bottom: var(--s2)">Ít</button>
        <button class="seg is-on" style="height: auto; padding-top: var(--s2); padding-bottom: var(--s2)">Vừa</button>
        <button class="seg" style="height: auto; padding-top: var(--s2); padding-bottom: var(--s2)">Nhiều</button>
      </div>
    </div>

    <button class="row-card" style="width: 100%" aria-label="Chọn bữa, đang là bữa trưa">
      <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
        <span class="icon icon-sm" data-symbol="clock"></span>
      </span>
      <div class="grow col" style="gap: 0; align-items: flex-start">
        <div class="t-headline">Bữa trưa</div>
        <div class="t-subhead t-secondary">Chạm để đổi bữa</div>
      </div>
      <span class="icon icon-sm" data-symbol="chevron.down" style="color: var(--faint)"></span>
    </button>

    <div class="spacer"></div>
    <button class="btn btn-primary btn-block">Lưu vào nhật ký</button>
  </div>
</div>
