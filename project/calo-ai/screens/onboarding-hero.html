<!-- pc {"title":"Onboarding Hero"} -->
<div class="screen" style="background-color: var(--bg)">
  <div class="body-fixed" style="padding-top: var(--s4); padding-bottom: var(--s4); gap: var(--s3)">
    <div class="row" style="justify-content: space-between; padding: 0 var(--s5)">
      <div class="dots">
        <i class="dot is-filled"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
      </div>
      <span class="t-caption t-secondary">1 of 4</span>
    </div>

    <div class="col" style="gap: 0; padding: 0 var(--s4)">
      <img class="art" src="/project/calo-ai/assets/meal-bowl.svg" width="358" height="280" alt="Meal bowl" style="border-radius: var(--r-xl)" />
      <div class="row above" style="justify-content: center; margin-top: calc(var(--s6) * -1)">
        <span class="chip" style="background-color: var(--bg-elevated); border: 1px solid var(--separator)">
          <i class="swatch" style="background-color: var(--protein)"></i><span>P · 38g</span>
        </span>
        <span class="chip" style="background-color: var(--bg-elevated); border: 1px solid var(--separator)">
          <i class="swatch" style="background-color: var(--carbs)"></i><span>C · 52g</span>
        </span>
        <span class="chip" style="background-color: var(--bg-elevated); border: 1px solid var(--separator)">
          <span class="icon icon-xs" data-symbol="sparkles"></span><span>540 kcal</span>
        </span>
      </div>
    </div>

    <div class="col" style="gap: var(--s2); padding: 0 var(--s8)">
      <h1 class="t-display">Point at your meal. Know what’s on your plate.</h1>
      <p class="t-subhead t-secondary">Calo estimates calories and macros so logging takes seconds.</p>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s2); padding: 0 var(--s5)">
      <button class="btn btn-block" style="height: 52px; background-color: var(--accent); color: var(--label)" aria-label="Build my plan">
        <span>Build my plan</span>
        <span class="icon icon-sm" data-symbol="arrow.right"></span>
      </button>
      <button class="t-subhead" style="background: transparent; border: 0; color: var(--label-2); height: 44px; font-family: var(--font); cursor: pointer">I’ll explore first</button>
    </div>
  </div>
</div>
