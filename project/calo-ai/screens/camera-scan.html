<!-- pc {"title":"Camera Scan","lightStatusBar":true} -->
<div class="screen" style="background-color: #000">
  <div class="body-fixed" style="padding-top: var(--s2); padding-bottom: var(--s6); gap: var(--s2)">
    <div class="row" style="justify-content: space-between; padding: 0 var(--s4)">
      <button class="icon-btn" style="color: var(--stage-ink)" aria-label="Close scanner">
        <span class="icon icon-sm" data-symbol="xmark"></span>
      </button>
      <div class="row" style="gap: var(--s4)">
        <button class="icon-btn" style="color: var(--stage-ink)" aria-label="Toggle flash">
          <span class="icon icon-sm" data-symbol="bolt.fill"></span>
        </button>
        <button class="icon-btn" style="color: var(--stage-ink)" aria-label="Scan history">
          <span class="icon icon-sm" data-symbol="clock"></span>
        </button>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s4); align-items: center; padding: 0 var(--s8)">
      <div class="col" style="gap: 0; align-items: center; width: 280px; height: 210px; border: 2px solid var(--stage-line); border-radius: var(--r-full)">
        <div class="spacer"></div>
        <span class="chip" style="height: 32px; margin-bottom: calc(var(--s6) * -1); background-color: var(--stage-fill); color: var(--stage-ink)">Detecting plate…</span>
      </div>
      <span class="t-subhead" style="color: var(--stage-ink)">Fit the whole plate in frame</span>
    </div>

    <div class="spacer"></div>

    <div class="row" style="gap: 0; padding: 0 var(--s10)">
      <img class="art" src="/project/calo-ai/assets/thumb-breakfast.svg" width="44" height="44" alt="Last scan" style="border-radius: var(--r-md)" />
      <div class="spacer"></div>
      <button style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; padding: 0; border: 4px solid var(--stage-ink); border-radius: var(--r-full); background: transparent; cursor: pointer" aria-label="Capture meal photo">
        <span style="display: block; width: 60px; height: 60px; border-radius: var(--r-full); background-color: var(--stage-ink)"></span>
      </button>
      <div class="spacer"></div>
      <button class="icon-btn" style="width: 44px; height: 44px; background-color: var(--stage-fill); color: var(--stage-ink)" aria-label="Flip camera">
        <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath"></span>
      </button>
    </div>
  </div>
</div>
