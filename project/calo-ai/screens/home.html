<!-- pc {"title":"Home"} -->
<div class="screen app-mood" data-tab-active="home" style="background-color: var(--bg)">
  <button data-slot="back" style="display: flex; flex-direction: row; align-items: center; gap: var(--s1); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2) var(--s1)" aria-label="Đổi ngày">
    <span class="icon icon-sm" data-symbol="chevron.left" style="color: var(--faint)"></span>
    <span class="t-headline">Hôm nay</span>
    <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
  </button>
  <div data-slot="right" class="row" style="gap: var(--s2); align-items: center">
    <button class="pill-soft" aria-label="Chuỗi 5 ngày">
      <span class="icon icon-xs" data-symbol="flame"></span>
      5 ngày
    </button>
    <button class="nav-round is-hollow" style="width: 44px; height: 44px" aria-label="Settings">
      <span class="icon icon-sm" data-symbol="gear"></span>
    </button>
  </div>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="hero-card">
      <div class="row" style="gap: var(--s4); align-items: center">
        <div class="bubble" style="border-color: var(--success)">
          <div class="col" style="align-items: center; gap: 0">
            <span class="t-stat">600</span>
            <span class="t-caption t-secondary">kcal còn lại</span>
          </div>
        </div>
        <div class="grow col" style="gap: var(--s2)">
          <div class="row" style="justify-content: space-between">
            <span class="t-footnote t-secondary">Đã nạp 1.250 / 1.850</span>
          </div>
          <div class="col" style="gap: var(--s1)">
            <div class="row" style="justify-content: space-between">
              <span class="t-footnote t-secondary">Đạm</span>
              <span class="t-footnote">82g/120g</span>
            </div>
            <div class="meter">
              <i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg"></i><i class="meter-seg"></i><i class="meter-seg"></i>
            </div>
          </div>
          <div class="col" style="gap: var(--s1)">
            <div class="row" style="justify-content: space-between">
              <span class="t-footnote t-secondary">Bột</span>
              <span class="t-footnote">140g/200g</span>
            </div>
            <div class="meter">
              <i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg is-on"></i><i class="meter-seg"></i><i class="meter-seg"></i><i class="meter-seg"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="paper-card">
    <div class="row" style="gap: var(--s1)">
      <button class="grow" style="display: flex; flex-direction: column; align-items: center; gap: var(--s1); background: transparent; border: 0; padding: var(--s2) 0" aria-label="Chụp món ăn">
        <span class="chip-icon bg-sun">
          <span class="icon icon-sm" data-symbol="camera"></span>
        </span>
        <span class="t-caption">Chụp</span>
      </button>
      <button class="grow" style="display: flex; flex-direction: column; align-items: center; gap: var(--s1); background: transparent; border: 0; padding: var(--s2) 0" aria-label="Tìm món ăn">
        <span class="chip-icon" style="background: var(--blue-tint)">
          <span class="icon icon-sm" data-symbol="magnifyingglass"></span>
        </span>
        <span class="t-caption">Tìm</span>
      </button>
      <button class="grow" style="display: flex; flex-direction: column; align-items: center; gap: var(--s1); background: transparent; border: 0; padding: var(--s2) 0" aria-label="Quét mã vạch">
        <span class="chip-icon" style="background: var(--peach-tint)">
          <span class="icon icon-sm" data-symbol="barcode"></span>
        </span>
        <span class="t-caption">Quét mã</span>
      </button>
      <button class="grow" style="display: flex; flex-direction: column; align-items: center; gap: var(--s1); background: transparent; border: 0; padding: var(--s2) 0" aria-label="Gõ hoặc nói món ăn">
        <span class="chip-icon" style="background: var(--lavender)">
          <span class="icon icon-sm" data-symbol="textformat"></span>
        </span>
        <span class="t-caption">Gõ / Nói</span>
      </button>
      </div>
    </div>

    <div class="col" style="gap: var(--s3)">
      <span class="t-section">Bữa hôm nay</span>
      <button class="row-card" style="width: 100%" aria-label="Sáng, phở bò, 1 tô, 520 kilocalo">
        <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
          <span class="icon icon-sm" data-symbol="clock"></span>
        </span>
        <div class="grow col" style="gap: 0; align-items: flex-start">
          <div class="t-headline">Sáng · Phở bò</div>
          <div class="t-subhead t-secondary">1 tô · 520 kcal</div>
        </div>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
      </button>
      <button class="row-card" style="width: 100%" aria-label="Trưa, cơm tấm, 1 dĩa, 730 kilocalo">
        <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
          <span class="icon icon-sm" data-symbol="clock"></span>
        </span>
        <div class="grow col" style="gap: 0; align-items: flex-start">
          <div class="t-headline">Trưa · Cơm tấm</div>
          <div class="t-subhead t-secondary">1 dĩa · 730 kcal</div>
        </div>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
      </button>
      <div class="row-card">
        <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
          <span class="icon icon-sm" data-symbol="clock"></span>
        </span>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Tối · Chưa log</div>
          <div class="t-subhead t-secondary">Còn 600 kcal cho bữa tối</div>
        </div>
        <button class="pill-sage">+ Thêm</button>
      </div>
      <div class="row-card">
        <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
          <span class="icon icon-sm" data-symbol="drop.fill"></span>
        </span>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Nước · 1.250/2.000 ml</div>
          <div class="t-subhead t-secondary">Còn 3 cốc nữa là đủ</div>
        </div>
        <button class="pill-sage">+ 1 cốc</button>
      </div>
      <div class="band is-sun">
        <div class="row" style="justify-content: space-between; align-items: center">
          <div class="t-headline">Health Score · 82</div>
          <button style="display: flex; flex: 0 0 auto; min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2)" aria-label="Health Score là gì">
            <span class="icon icon-sm" data-symbol="info.circle" style="color: var(--espresso)"></span>
          </button>
        </div>
        <div class="t-subhead">Đủ đạm, thiếu rau xanh. Thêm 1 đĩa salad là lên 90.</div>
      </div>
    </div>

    <div class="spacer"></div>
  </div>

  <!-- Bộ destination dùng chung: project/calo-ai/components/app-tabs.html.
       Màn chỉ nói destination nào đang mở (data-tab-active trên .screen). -->
  <!-- @component app-tabs -->
</div>
