<!-- pc {"title":"Add Meal"} -->
<div class="screen" style="background-color: var(--bg-elevated)">
  <div class="body-fixed" style="gap: 0">
    <div class="scrim"></div>
    <div class="spacer"></div>

    <div class="sheet-panel">
      <div class="row" style="justify-content: center">
        <i class="grabber"></i>
      </div>

      <div class="sheet-head">
        <span class="t-section">Add your meal</span>
        <button class="close-btn" aria-label="Close">
          <span class="icon icon-xs" data-symbol="xmark"></span>
        </button>
      </div>

      <button class="row" style="gap: var(--s3); height: 76px; padding: 0 var(--s4); border: 0; border-radius: var(--r-xl); background-color: var(--cta); color: var(--label); font-family: var(--font); text-align: left; cursor: pointer" aria-label="Scan meal">
        <span class="icon icon-lg" data-symbol="photo"></span>
        <span class="col grow" style="gap: 0">
          <span class="t-headline">Scan meal</span>
          <span class="t-footnote">Point at your plate</span>
        </span>
        <span class="icon icon-sm" data-symbol="chevron.right"></span>
      </button>

      <div class="row" style="gap: var(--s3)">
        <button class="row grow" style="gap: var(--s2); height: 64px; padding: 0 var(--s3); border: 1px solid var(--separator); border-radius: var(--r-lg); background-color: var(--bg-elevated); color: var(--label); font-family: var(--font); font-size: var(--t-subhead); font-weight: 600; cursor: pointer" aria-label="Type or speak">
          <span class="icon icon-sm" data-symbol="textformat"></span>
          <span>Type / speak</span>
        </button>
        <button class="row grow" style="gap: var(--s2); height: 64px; padding: 0 var(--s3); border: 1px solid var(--separator); border-radius: var(--r-lg); background-color: var(--bg-elevated); color: var(--label); font-family: var(--font); font-size: var(--t-subhead); font-weight: 600; cursor: pointer" aria-label="Search food">
          <span class="icon icon-sm" data-symbol="magnifyingglass"></span>
          <span>Search</span>
        </button>
      </div>
      <div class="row" style="gap: var(--s3)">
        <button class="row grow" style="gap: var(--s2); height: 64px; padding: 0 var(--s3); border: 1px solid var(--separator); border-radius: var(--r-lg); background-color: var(--bg-elevated); color: var(--label); font-family: var(--font); font-size: var(--t-subhead); font-weight: 600; cursor: pointer" aria-label="Scan barcode">
          <span class="icon icon-sm" data-symbol="square.grid.2x2"></span>
          <span>Barcode</span>
        </button>
        <button class="row grow" style="gap: var(--s2); height: 64px; padding: 0 var(--s3); border: 1px solid var(--separator); border-radius: var(--r-lg); background-color: var(--bg-elevated); color: var(--label); font-family: var(--font); font-size: var(--t-subhead); font-weight: 600; cursor: pointer" aria-label="Recent meals">
          <span class="icon icon-sm" data-symbol="clock"></span>
          <span>Recent</span>
        </button>
      </div>
    </div>
  </div>
</div>
