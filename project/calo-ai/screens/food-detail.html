<!-- pc {"title":"Chi tiết món"} -->
<div class="screen app-mood" style="background-color: var(--bg)">
  <!-- @component app-nav -->
  <span data-slot="title" class="t-headline">Phở bò</span>
  <button data-slot="right" class="nav-round is-hollow" aria-label="Lưu vào yêu thích" aria-pressed="false">
    <span class="icon icon-sm" data-symbol="heart"></span>
  </button>

  <div class="body" style="padding: var(--s4) var(--s4) var(--s5); gap: var(--s4)">
    <div class="row-card">
      <img class="art art-food" src="/project/calo-ai/assets/pho.svg" width="56" height="56" alt="Pho bo" />
      <div class="grow col" style="gap: 0">
        <div class="t-headline">Phở bò</div>
        <div class="t-subhead t-secondary">1 tô ~ 520 kcal</div>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s3)">
      <span class="t-section">Đạm · Bột · Béo</span>
      <div class="col" style="gap: var(--s1)">
        <div class="row" style="justify-content: space-between; align-items: center">
          <div class="t-headline">P · 25g</div>
        </div>
        <div style="height: 8px; border-radius: var(--r-full); background: var(--track)">
          <div style="width: 36%; height: 100%; border-radius: var(--r-full); background: var(--cta)"></div>
        </div>
      </div>
      <div class="col" style="gap: var(--s1)">
        <div class="row" style="justify-content: space-between; align-items: center">
          <div class="t-headline">C · 70g</div>
        </div>
        <div style="height: 8px; border-radius: var(--r-full); background: var(--track)">
          <div style="width: 100%; height: 100%; border-radius: var(--r-full); background: var(--cta)"></div>
        </div>
      </div>
      <div class="col" style="gap: var(--s1)">
        <div class="row" style="justify-content: space-between; align-items: center">
          <div class="t-headline">F · 15g</div>
        </div>
        <div style="height: 8px; border-radius: var(--r-full); background: var(--track)">
          <div style="width: 21%; height: 100%; border-radius: var(--r-full); background: var(--cta)"></div>
        </div>
      </div>
      <div class="row" style="gap: var(--s2); align-items: center">
        <span class="icon icon-sm" data-symbol="info.circle" style="color: var(--faint)"></span>
        <div class="t-subhead t-secondary">Nguồn: VN DB v1</div>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Suất ăn</span>
      <div class="segmented-light" role="group" aria-label="Suất ăn">
        <button class="seg">0.5</button>
        <button class="seg is-on">1.0</button>
        <button class="seg">1.5</button>
      </div>
    </div>

    <button class="row-card" style="width: 100%" aria-label="Chọn bữa, đang là bữa trưa">
      <span class="chip-icon chip-food">
        <span class="icon icon-sm" data-symbol="clock"></span>
      </span>
      <div class="grow col" style="gap: 0; align-items: flex-start">
        <div class="t-headline">Bữa trưa</div>
        <div class="t-subhead t-secondary">Chạm để đổi bữa</div>
      </div>
      <span class="icon icon-sm" data-symbol="chevron.down" style="color: var(--faint)"></span>
    </button>

    <div class="spacer"></div>
    <button class="btn btn-primary btn-block">Log vào nhật ký</button>
  </div>
</div>
