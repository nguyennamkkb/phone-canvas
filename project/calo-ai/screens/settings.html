<!-- pc {"title":"Cài đặt"} -->
<div class="screen app-mood" data-tab-active="me" style="background-color: var(--bg)">
  <span data-slot="title" class="t-headline">Cài đặt</span>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <button class="row-card" style="width: 100%" aria-label="Tài khoản user@mail, gói Pro">
      <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
        <span class="icon icon-sm" data-symbol="person"></span>
      </span>
      <div class="grow col" style="gap: 0; align-items: flex-start">
        <div class="t-headline">user@mail</div>
        <div class="t-subhead t-secondary">Gói Pro · đồng bộ HealthKit</div>
      </div>
      <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
    </button>

    <div class="paper-card" style="gap: 0">
      <span class="t-section" style="padding-bottom: var(--s2)">Mục tiêu</span>
      <button class="action-row" style="width: 100%" aria-label="Sửa mục tiêu calo, đang 1.850">
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Mục tiêu calo</div>
          <div class="t-subhead t-secondary">1.850 kcal/ngày</div>
        </div>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
      </button>
      <button class="action-row" style="width: 100%" aria-label="Sửa cân nặng mục tiêu, đang 65 kg">
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Cân nặng mục tiêu</div>
          <div class="t-subhead t-secondary">65 kg · còn 3 kg</div>
        </div>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
      </button>
      <div class="action-row">
        <div class="grow col" style="gap: 0">
          <div class="t-headline">HealthKit</div>
          <div class="t-subhead t-secondary">đồng bộ cân và bước chân</div>
        </div>
        <button class="toggle" role="switch" aria-checked="true" aria-label="Bật đồng bộ HealthKit">
          <span class="toggle-knob"></span>
        </button>
      </div>
    </div>

    <div class="paper-card" style="gap: 0">
      <span class="t-section" style="padding-bottom: var(--s2)">Thông báo</span>
      <div class="action-row">
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Nhắc bữa tối</div>
          <div class="t-subhead t-secondary">19:30 mỗi ngày</div>
        </div>
        <button class="toggle" role="switch" aria-checked="true" aria-label="Bật nhắc bữa tối">
          <span class="toggle-knob"></span>
        </button>
      </div>
      <div class="action-row">
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Nhắc uống nước</div>
          <div class="t-subhead t-secondary">mỗi 2 giờ</div>
        </div>
        <button class="toggle is-off" role="switch" aria-checked="false" aria-label="Bật nhắc uống nước">
          <span class="toggle-knob"></span>
        </button>
      </div>
    </div>

    <div class="paper-card" style="gap: 0">
      <span class="t-section" style="padding-bottom: var(--s2)">Hỗ trợ</span>
      <button class="action-row" style="width: 100%" aria-label="Hướng dẫn hủy gói">
        <div class="grow t-headline">Hủy gói</div>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
      </button>
      <button class="action-row" style="width: 100%" aria-label="Xuất dữ liệu">
        <div class="grow t-headline">Xuất dữ liệu</div>
        <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
      </button>
    </div>

    <div class="paper-card" style="gap: 0">
      <button class="action-row is-danger" style="width: 100%; justify-content: center" aria-label="Xóa tài khoản">
        <div class="t-headline">Xóa tài khoản</div>
      </button>
    </div>
  </div>

  <!-- @component app-tabs -->
</div>
