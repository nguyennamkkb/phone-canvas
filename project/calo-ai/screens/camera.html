<!-- pc {"title":"Camera scan"} -->
<div class="screen app-mood" style="background-color: var(--bg)">
  <div class="body-fixed" style="padding: var(--s4) var(--s5) var(--s5); gap: var(--s4)">
    <div class="navbar" style="padding: 0">
      <button class="nav-round is-hollow" style="width: 44px; height: 44px" aria-label="Đóng camera">
        <span class="icon icon-sm" data-symbol="xmark"></span>
      </button>
      <span class="pill-soft">
        <span class="icon icon-xs" data-symbol="sparkles"></span>
        Còn 2 scans
      </span>
      <button class="nav-round is-hollow" style="width: 44px; height: 44px" aria-label="Bật đèn flash">
        <span class="icon icon-sm" data-symbol="bolt.fill"></span>
      </button>
    </div>

    <div class="paper-card" style="flex: 1 1 auto; align-items: center; justify-content: center; gap: var(--s3); padding: var(--s10) var(--s5)">
      <span class="circle-btn is-dashed" style="width: 88px; height: 88px; border-color: var(--clay); color: var(--clay)">
        <span class="icon" data-symbol="camera"></span>
      </span>
      <div class="t-headline">Đặt món vào khung</div>
      <p class="t-subhead t-secondary" style="text-align: center">Chụp rõ cả tô/chén, đủ sáng.<br />Khung hình minh họa — máy ảnh thật khi chạy app.</p>
    </div>

    <p class="t-footnote t-secondary" style="text-align: center">AI trả kết quả trong ~5 giây sau khi chụp</p>

    <div class="bottom-cta" style="flex-direction: row; justify-content: space-between; align-items: center">
      <button style="display: flex; flex: 0 0 auto; min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2)" aria-label="Chọn ảnh từ thư viện">
        <span class="chip-icon" style="background: var(--card)">
          <span class="icon icon-sm" data-symbol="photo"></span>
        </span>
      </button>
      <button class="circle-btn" style="width: 80px; height: 80px" aria-label="Chụp ảnh món ăn">
        <span class="circle-btn" style="width: 64px; height: 64px; background: var(--success); border-color: var(--success)"></span>
      </button>
      <button style="display: flex; flex: 0 0 auto; min-width: var(--touch-min); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2)" aria-label="Đổi camera trước sau">
        <span class="chip-icon" style="background: var(--card)">
          <span class="icon icon-sm" data-symbol="arrow.triangle.2.circlepath"></span>
        </span>
      </button>
    </div>
  </div>
</div>
