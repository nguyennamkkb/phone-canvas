<!-- pc {"title":"Diary"} -->
<div class="screen app-mood" data-tab-active="diary" style="background-color: var(--bg)">
  <button data-slot="back" style="display: flex; flex-direction: row; align-items: center; gap: var(--s1); min-height: var(--touch-min); background: transparent; border: 0; padding: var(--s2) var(--s1)" aria-label="Đổi ngày">
    <span class="icon icon-sm" data-symbol="chevron.left" style="color: var(--faint)"></span>
    <span class="t-headline">Hôm nay</span>
    <span class="icon icon-sm" data-symbol="chevron.right" style="color: var(--faint)"></span>
  </button>
  <span data-slot="right" class="t-footnote t-secondary">1.250/1.850 kcal</span>

  <div class="body" style="padding: var(--s4); gap: var(--s4)">
    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Sáng · 520 kcal</span>
      <div class="row" style="gap: var(--s3); align-items: center">
        <img class="art" src="/project/calo-ai/assets/pho.svg" width="56" height="56" alt="Pho bo" style="border-radius: var(--r-md)" />
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Phở bò</div>
          <div class="t-subhead t-secondary">1 tô · 520 kcal · P25 / C70 / F15</div>
        </div>
        <button style="display: flex; background: transparent; border: 0; padding: var(--s3)" aria-label="Sửa phở bò">
          <span class="icon icon-sm" data-symbol="pencil" style="color: var(--faint)"></span>
        </button>
        <button style="display: flex; background: transparent; border: 0; padding: var(--s3)" aria-label="Xóa phở bò">
          <span class="icon icon-sm" data-symbol="trash" style="color: var(--alarm)"></span>
        </button>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Trưa · 730 kcal</span>
      <div class="row" style="gap: var(--s3); align-items: center">
        <img class="art" src="/project/calo-ai/assets/com-tam.svg" width="56" height="56" alt="Com tam" style="border-radius: var(--r-md)" />
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Cơm tấm sườn bì chả</div>
          <div class="t-subhead t-secondary">1 dĩa · 730 kcal</div>
        </div>
        <button style="display: flex; background: transparent; border: 0; padding: var(--s3)" aria-label="Sửa cơm tấm">
          <span class="icon icon-sm" data-symbol="pencil" style="color: var(--faint)"></span>
        </button>
        <button style="display: flex; background: transparent; border: 0; padding: var(--s3)" aria-label="Xóa cơm tấm">
          <span class="icon icon-sm" data-symbol="trash" style="color: var(--alarm)"></span>
        </button>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Tối · chưa log</span>
      <div class="row" style="gap: var(--s3); align-items: center">
        <div class="grow col" style="gap: 0">
          <div class="t-headline">Chưa có món nào</div>
          <div class="t-subhead t-secondary">Còn 600 kcal cho bữa tối</div>
        </div>
        <button class="pill-sage">+ Thêm</button>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Nước · 1.250/2.000 ml</span>
      <div class="row" style="gap: var(--s3); align-items: center">
        <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
          <span class="icon icon-sm" data-symbol="drop.fill"></span>
        </span>
        <div class="grow t-headline">5 cốc hôm nay</div>
        <button class="nav-round is-hollow" aria-label="Bớt 1 cốc nước">
          <span class="icon icon-sm" data-symbol="minus"></span>
        </button>
        <button class="nav-round is-hollow" aria-label="Thêm 1 cốc nước">
          <span class="icon icon-sm" data-symbol="plus"></span>
        </button>
      </div>
    </div>

    <div class="paper-card" style="gap: var(--s2)">
      <span class="t-section">Vận động · +180 kcal</span>
      <div class="row" style="gap: var(--s3); align-items: center">
        <span class="chip-icon" style="background: var(--sun-soft); color: var(--espresso)">
          <span class="icon icon-sm" data-symbol="figure.walk"></span>
        </span>
        <div class="grow col" style="gap: 0">
          <div class="t-headline">3.200 bước · HealthKit</div>
          <div class="t-subhead t-secondary">Tự động cộng vào ngân sách</div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
  </div>

  <!-- Bộ destination dùng chung: project/calo-ai/components/app-tabs.html. -->
  <!-- @component app-tabs -->
</div>
