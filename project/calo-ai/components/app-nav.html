<!-- @anatomy name="app-nav" purpose="Nav mac dinh cho man modal: nut Huy + slot title, slot thang khi man khai de." anatomy="button[data-slot=back].pill-ghost &quot;Huy&quot; + span[data-slot=title].nav-title" variants="khong co — mot dang duy nhat" states="default; khong co pressed/loading trong HTML tinh" tokens="--s3" regions="nav-slot (back/title); khong dung trong body/tab-list" platforms="phone(modal); tablet(sidebar thay nav) / watch / widget khong dung" interaction="tap Huy >=44pt, dong modal; title khong tuong tac" a11y="aria-label thieu — bo sung khi dung that; chu Huy la nhan hien thi" examples="dung: man modal include + khai data-slot title; sai: man tu ve nut Huy rieng" -->
<!-- Nav mặc định cho màn dạng modal (confirm, textvoice): quay lại bằng nút
     "Hủy" thay vì chevron, đúng quy ước modal của app.

     Màn include file này rồi GHI ĐÈ từng slot: khai `data-slot="title"` của
     riêng màn là slot đó thắng mặc định ở đây, còn back vẫn lấy từ đây nên
     markup "Hủy" chỉ tồn tại ở một chỗ.

     Màn có nav riêng (home, diary, camera) thì KHÔNG include file này. -->
<button data-slot="back" class="pill-ghost" style="height: auto; padding-top: var(--s3); padding-bottom: var(--s3)">Hủy</button>
<span data-slot="title" class="nav-title"></span>
