<!-- @anatomy name="app-tabs" purpose="Bo destination duy nhat cua calo-ai; man chi khai data-tab-active, shell suy is-active." anatomy="button[data-tab=<slug>].tab > span.icon[data-symbol] + span Label (x4: home/scan/diary/me)" variants="is-active do shell suy, khong khai tay" states="default/is-active; khong co disabled/loading" tokens="khong dung var — icon + text ke thua" regions="tab list (shell); khong dung trong body/nav" platforms="phone day du 4 tab; cover cam tab ngang (chuyen rail-doc); watch/widget khong dung" interaction="tap chuyen destination, target la .tab (>=44pt theo touch floor)" a11y="aria-current/aria-label do shell suy tu vi tri; moi tab co icon + nhan chu" examples="dung: man khai data-tab-active; sai: copy danh sach tab vao man" -->
<!-- Bộ destination của calo-ai — MỘT nguồn duy nhất.
     Màn không chép lại danh sách này; màn chỉ khai destination đang mở bằng
     `data-tab-active="<slug>"` trên `.screen`. Shell suy ra `is-active`,
     `aria-current="page"`, `aria-label` và thứ tự "tab N trên M" từ vị trí
     thật trong bộ, nên thêm hay xếp lại destination không phải sửa màn nào.

     Slug là danh tính của destination (`data-tab="home"`), không phải chuỗi
     hiển thị: đổi slug là đổi hợp đồng với mọi màn đang trỏ tới nó. -->
<button data-tab="home" class="tab">
  <span class="icon" data-symbol="house"></span>
  <span>Home</span>
</button>
<button data-tab="scan" class="tab">
  <span class="icon" data-symbol="camera"></span>
  <span>Scan</span>
</button>
<button data-tab="diary" class="tab">
  <span class="icon" data-symbol="list.bullet"></span>
  <span>Diary</span>
</button>
<button data-tab="me" class="tab">
  <span class="icon" data-symbol="person"></span>
  <span>Me</span>
</button>
