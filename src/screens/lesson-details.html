<div class="screen" style="background: linear-gradient(170deg, #c08cf0, #a463e4)">
  <div class="body-fixed">
    <div class="row" style="justify-content: space-between; padding: var(--s3) var(--s5) 0">
      <button class="nav-round" aria-label="Back">
        <span class="icon icon-sm" data-symbol="chevron.left"></span>
      </button>
      <div class="row" style="gap: 0; color: #ffffff">
        <span class="t-subhead">Lesson Details</span>
      </div>
      <button class="nav-round" aria-label="Share">
        <span class="icon icon-sm" data-symbol="square.and.arrow.up"></span>
      </button>
    </div>

    <div class="row" style="justify-content: center; padding-top: var(--s4)">
      <img class="art" src="/images/lesson-hero.svg" width="140" height="140" alt="Lesson" />
    </div>

    <div class="col" style="align-items: center; gap: var(--s3); padding: var(--s4) var(--s8) var(--s5)">
      <div class="pill-tag">Beginner</div>
      <h1 class="t-hero">Mastering Everyday Conversations</h1>
    </div>

    <div class="sheet">
      <div class="row" style="gap: var(--s3)">
        <div class="stat-card bg-blue-tint">
          <span class="icon icon-sm" data-symbol="book.fill" style="color: #3b82f6"></span>
          <div class="t-stat">20</div>
          <div class="t-caption" style="color: var(--slate)">Lessons</div>
        </div>
        <div class="stat-card bg-peach-tint">
          <span class="icon icon-sm" data-symbol="doc.text" style="color: #f97316"></span>
          <div class="t-stat">12</div>
          <div class="t-caption" style="color: var(--slate)">Quizzes</div>
        </div>
        <div class="stat-card bg-violet-tint">
          <span class="icon icon-sm" data-symbol="clock" style="color: var(--violet)"></span>
          <div class="t-stat">5.0</div>
          <div class="t-caption" style="color: var(--slate)">Hours</div>
        </div>
      </div>

      <p class="t-subhead" style="color: var(--slate)">
        Enhance your daily communication skills with practical lessons and engaging quizzes.
        Master common phrases, improve pronunciation.
      </p>

      <div class="t-section">Lessons</div>

      <div class="row-card">
        <span class="chip-icon bg-white">
          <span class="icon icon-sm" data-symbol="book.fill" style="color: #3b82f6"></span>
        </span>
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Greeting &amp; Introducing</div>
          <div class="t-footnote" style="color: var(--slate)">5 mins 20 sec</div>
        </div>
        <span class="chip-icon bg-violet">
          <span class="icon icon-xs" data-symbol="checkmark" style="color: #ffffff"></span>
        </span>
      </div>

      <div class="spacer"></div>

      <div class="cta-bar">
        <button class="nav-round is-hollow" aria-label="Save">
          <span class="icon icon-sm" data-symbol="bookmark"></span>
        </button>
        <button class="btn-dark">Start Lessons</button>
      </div>
    </div>
  </div>
</div>
