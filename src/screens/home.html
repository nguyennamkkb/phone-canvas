<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s5)">
      <div class="row" style="gap: var(--s3)">
        <img class="art avatar-round" src="/images/avatar.svg" width="46" height="46" alt="Your profile" />
        <div class="col" style="gap: 1px">
          <div class="t-footnote" style="color: var(--clay)">Good morning</div>
          <div class="t-headline">Olive</div>
        </div>
      </div>
      <button class="icon-btn-soft" aria-label="Notifications">
        <span class="icon icon-sm" data-symbol="bell"></span>
      </button>
    </div>

    <div class="hero-card" style="margin-top: var(--s5)">
      <div class="row" style="gap: var(--s4)">
        <img class="art" src="/images/mascot-happy.svg" data-asset="MascotHappy" width="76" height="79" alt="" />
        <div class="grow col" style="gap: var(--s1)">
          <div class="t-hand" style="font-size: 24px; line-height: 30px">How are you right now?</div>
          <div class="t-footnote" style="color: var(--espresso); opacity: 0.65">Tuesday, 16 September</div>
        </div>
      </div>

      <div class="row" style="gap: var(--s1)">
        <span class="mood-orb">
          <img class="art" src="/images/mood-awful.svg" data-asset="MoodAwful" width="54" height="54" alt="Awful" />
        </span>
        <span class="mood-orb">
          <img class="art" src="/images/mood-bad.svg" data-asset="MoodBad" width="54" height="54" alt="Bad" />
        </span>
        <span class="mood-orb">
          <img class="art" src="/images/mood-okay.svg" data-asset="MoodOkay" width="54" height="54" alt="Okay" />
        </span>
        <span class="mood-orb is-on">
          <img class="art" src="/images/mood-good.svg" data-asset="MoodGood" width="54" height="54" alt="Good" />
        </span>
        <span class="mood-orb">
          <img class="art" src="/images/mood-great.svg" data-asset="MoodGreat" width="54" height="54" alt="Great" />
        </span>
      </div>
    </div>

    <div class="paper-card" style="margin-top: var(--s3)">
      <div class="row" style="justify-content: space-between">
        <div class="t-headline">This week</div>
        <span class="pill-soft">6 of 7 days</span>
      </div>
      <div class="mood-row">
        <div class="mood-day">
          <span class="mood-dot fill-4"></span>
          <span class="t-caption" style="color: var(--clay)">M</span>
        </div>
        <div class="mood-day">
          <span class="mood-dot fill-3"></span>
          <span class="t-caption" style="color: var(--clay)">T</span>
        </div>
        <div class="mood-day">
          <span class="mood-dot fill-5"></span>
          <span class="t-caption" style="color: var(--clay)">W</span>
        </div>
        <div class="mood-day">
          <span class="mood-dot fill-2"></span>
          <span class="t-caption" style="color: var(--clay)">T</span>
        </div>
        <div class="mood-day">
          <span class="mood-dot fill-3"></span>
          <span class="t-caption" style="color: var(--clay)">F</span>
        </div>
        <div class="mood-day">
          <span class="mood-dot fill-4"></span>
          <span class="t-caption" style="color: var(--clay)">S</span>
        </div>
        <div class="mood-day">
          <span class="mood-dot is-empty"></span>
          <span class="t-caption" style="color: var(--clay)">S</span>
        </div>
      </div>
    </div>

    <div class="row" style="gap: var(--s3); padding-top: var(--s3)">
      <div class="stat-tile is-sage">
        <span class="icon icon-sm" data-symbol="flame"></span>
        <div class="t-stat">6</div>
        <div class="t-caption" style="opacity: 0.7">day streak</div>
      </div>
      <div class="stat-tile is-lilac">
        <span class="icon icon-sm" data-symbol="trend"></span>
        <div class="t-stat">3.9</div>
        <div class="t-caption" style="opacity: 0.7">average mood</div>
      </div>
    </div>

    <div class="band is-sun" style="margin-top: var(--s3)">
      <div class="row" style="gap: var(--s3)">
        <span class="chip-icon" style="background: var(--card)">
          <span class="icon icon-sm" data-symbol="sparkles"></span>
        </span>
        <div class="grow col" style="gap: 1px">
          <div class="t-subhead">Your mornings are lighter</div>
          <div class="t-footnote" style="color: var(--clay)">
            You log “good” before 10am twice as often.
          </div>
        </div>
        <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--clay)"></span>
      </div>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s4) 0 var(--s2)">
      <nav class="dock">
        <span class="dock-item is-on"><span class="icon" data-symbol="house"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="book"></span></span>
        <span class="dock-item">
          <span class="dock-plus"><span class="icon icon-sm" data-symbol="plus"></span></span>
        </span>
        <span class="dock-item"><span class="icon" data-symbol="chart.bar"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="person"></span></span>
      </nav>
    </div>
  </div>
</div>
