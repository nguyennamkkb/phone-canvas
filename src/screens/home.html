<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <span class="pill-ghost" style="height: 32px">
        <span class="icon icon-xs" data-symbol="calendar"></span>
        Tue. 25 Jan 2025
      </span>
      <button class="nav-round" aria-label="Notifications">
        <span class="icon icon-sm" data-symbol="bell"></span>
      </button>
    </div>

    <div class="row" style="gap: var(--s3); padding-top: var(--s3)">
      <img class="art avatar-round" src="/images/avatar.svg" width="48" height="48" alt="Shinomiya" />
      <div class="t-title2">Hi, Shinomiya!</div>
    </div>

    <div class="row" style="gap: var(--s2); padding-top: var(--s3)">
      <span class="chip">
        <span class="icon icon-xs" data-symbol="star" style="color: var(--sage-deep)"></span>
        Pro Member
      </span>
      <span class="chip">
        <span class="icon icon-xs" data-symbol="sparkles" style="color: var(--lilac)"></span>
        80%
      </span>
      <span class="chip">
        <span class="icon icon-xs" data-symbol="heart.fill" style="color: var(--ember)"></span>
        Happy
      </span>
    </div>

    <div class="searchbar" style="margin-top: var(--s3)">
      <span class="t-subhead" style="color: var(--clay)">Search anything…</span>
      <div class="spacer"></div>
      <span class="icon icon-sm" data-symbol="magnifyingglass" style="color: var(--espresso)"></span>
    </div>

    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <div class="t-headline">Mental Health Metrics</div>
      <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--clay)"></span>
    </div>

    <div class="row" style="gap: var(--s3); padding-top: var(--s2)">
      <div class="stat-tile is-sage">
        <div class="row" style="gap: var(--s1)">
          <span class="icon icon-xs" data-symbol="heart" style="color: var(--card)"></span>
          <span class="t-footnote">Freud Score</span>
        </div>
        <div class="bubble is-sm" style="border-color: var(--card); background: transparent; align-self: center">
          <div class="t-stat">80</div>
          <div class="t-caption">Healthy</div>
        </div>
      </div>
      <div class="stat-tile is-ember">
        <div class="row" style="gap: var(--s1)">
          <span class="face-dot is-2" style="width: 20px; height: 20px">
            <span class="icon" data-symbol="heart.fill" style="width: 12px; height: 12px"></span>
          </span>
          <span class="t-footnote">Mood</span>
        </div>
        <div class="t-stat">Sad</div>
        <div class="minibars">
          <span class="minibar" style="height: 30%"></span>
          <span class="minibar" style="height: 45%"></span>
          <span class="minibar" style="height: 60%"></span>
          <span class="minibar" style="height: 40%"></span>
          <span class="minibar" style="height: 75%"></span>
          <span class="minibar" style="height: 55%"></span>
          <span class="minibar" style="height: 90%"></span>
          <span class="minibar" style="height: 65%"></span>
        </div>
      </div>
    </div>

    <div class="stat-tile is-lilac" style="margin-top: var(--s3)">
      <div class="row" style="gap: var(--s4)">
        <div class="grow col" style="gap: var(--s1)">
          <div class="row" style="gap: var(--s1)">
            <span class="icon icon-xs" data-symbol="book"></span>
            <span class="t-footnote">Health Journal</span>
          </div>
          <div class="t-stat">31/365</div>
        </div>
        <div class="col" style="gap: var(--s2); width: 112px">
          <div class="row" style="gap: var(--s2)">
            <span class="dotcell"></span><span class="dotcell"></span><span class="dotcell"></span><span class="dotcell is-dim"></span>
          </div>
          <div class="row" style="gap: var(--s2)">
            <span class="dotcell"></span><span class="dotcell"></span><span class="dotcell is-dim"></span><span class="dotcell"></span>
          </div>
          <div class="row" style="gap: var(--s2)">
            <span class="dotcell"></span><span class="dotcell is-dim"></span><span class="dotcell"></span><span class="dotcell"></span>
          </div>
          <div class="row" style="gap: var(--s2)">
            <span class="dotcell is-dim"></span><span class="dotcell"></span><span class="dotcell"></span><span class="dotcell is-dim"></span>
          </div>
          <div class="row" style="gap: var(--s2)">
            <span class="dotcell"></span><span class="dotcell"></span><span class="dotcell is-dim"></span><span class="dotcell"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <div class="t-headline">Mindful Tracker</div>
      <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--clay)"></span>
    </div>

    <div class="row-card" style="margin-top: var(--s2)">
      <span class="chip-icon" style="background: var(--sage-soft)">
        <span class="icon icon-sm" data-symbol="clock" style="color: var(--sage-deep)"></span>
      </span>
      <div class="grow col" style="gap: 1px">
        <div class="t-headline">Mindful Hours</div>
        <div class="t-footnote" style="color: var(--clay)">2.5h/8h</div>
      </div>
      <span class="icon icon-sm" data-symbol="trend" style="color: var(--sage-deep)"></span>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s4) 0 var(--s2)">
      <nav class="dock">
        <span class="dock-item is-on"><span class="icon" data-symbol="house"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="bubble.left"></span></span>
        <span class="dock-item">
          <span class="dock-plus" style="background: var(--espresso); color: var(--paper)">
            <span class="icon icon-sm" data-symbol="plus"></span>
          </span>
        </span>
        <span class="dock-item"><span class="icon" data-symbol="chart.bar"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="person"></span></span>
      </nav>
    </div>
  </div>
</div>
