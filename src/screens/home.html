<div class="screen app-mood">
  <div class="body-fixed">
    <section class="hero-bleed">
      <div class="row" style="justify-content: space-between">
        <div class="row" style="gap: var(--s3)">
          <img class="art avatar-round" src="/images/avatar.svg" width="44" height="44" alt="Your profile" />
          <div class="col" style="gap: 1px">
            <div class="t-footnote" style="color: var(--espresso); opacity: 0.6">Good morning</div>
            <div class="t-headline">Olive</div>
          </div>
        </div>
        <button class="icon-btn-soft" style="background: var(--card)" aria-label="Notifications">
          <span class="icon icon-sm" data-symbol="bell"></span>
        </button>
      </div>

      <div class="row" style="gap: var(--s3); align-items: flex-end">
        <div class="grow col" style="gap: var(--s1)">
          <div class="t-footnote" style="color: var(--espresso); opacity: 0.62">
            TUESDAY · ONE HONEST TAP
          </div>
          <div class="t-hand" style="font-size: 27px; line-height: 32px">How is your heart today?</div>
        </div>
        <img class="art" src="/images/mascot-happy.svg" data-asset="MascotHappy" width="84" height="87" alt="" />
      </div>

      <div class="row" style="gap: var(--s1)">
        <span class="mood-orb">
          <img class="art" src="/images/mood-awful.svg" data-asset="MoodAwful" width="54" height="54" alt="Awful" />
        </span>
        <span class="mood-orb">
          <img class="art" src="/images/mood-bad.svg" data-asset="MoodBad" width="54" height="54" alt="Bad" />
        </span>
        <span class="mood-orb">
          <img class="art" src="/images/mood-okay.svg" data-asset="MoodOkay" width="54" height="54" alt="Okay" />
        </span>
        <span class="mood-orb is-on">
          <img class="art" src="/images/mood-good.svg" data-asset="MoodGood" width="54" height="54" alt="Good" />
        </span>
        <span class="mood-orb">
          <img class="art" src="/images/mood-great.svg" data-asset="MoodGreat" width="54" height="54" alt="Great" />
        </span>
      </div>
    </section>

    <div class="inset" style="padding: var(--s3) var(--s5) 0">
      <div class="paper-card">
        <div class="row" style="justify-content: space-between">
          <div class="t-headline">This week</div>
          <span class="pill-soft">a warm week</span>
        </div>
        <div class="row" style="gap: var(--s2); align-items: flex-end">
          <div class="week-col">
            <span class="week-bar fill-4" style="height: 62%"></span>
            <span class="t-caption" style="color: var(--clay)">M</span>
          </div>
          <div class="week-col">
            <span class="week-bar fill-3" style="height: 50%"></span>
            <span class="t-caption" style="color: var(--clay)">T</span>
          </div>
          <div class="week-col">
            <span class="week-bar fill-5" style="height: 75%"></span>
            <span class="t-caption" style="color: var(--clay)">W</span>
          </div>
          <div class="week-col">
            <span class="week-bar fill-2" style="height: 36%"></span>
            <span class="t-caption" style="color: var(--clay)">T</span>
          </div>
          <div class="week-col">
            <span class="week-bar fill-3" style="height: 50%"></span>
            <span class="t-caption" style="color: var(--clay)">F</span>
          </div>
          <div class="week-col">
            <span class="week-bar fill-4" style="height: 62%"></span>
            <span class="t-caption" style="color: var(--clay)">S</span>
          </div>
          <div class="week-col">
            <span class="week-bar is-missing"></span>
            <span class="t-caption" style="color: var(--clay)">S</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row" style="gap: var(--s3); padding: var(--s3) var(--s5) 0">
      <div class="stat-tile is-sage">
        <div class="t-caption" style="opacity: 0.7">Day streak</div>
        <div class="row" style="gap: var(--s2); align-items: baseline">
          <span class="icon icon-xs" data-symbol="flame" style="color: var(--ember)"></span>
          <div class="t-stat">6</div>
          <span class="t-footnote" style="opacity: 0.7">days</span>
        </div>
        <div class="row" style="gap: 3px">
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill"></span>
        </div>
      </div>

      <div class="stat-tile is-lilac">
        <div class="t-caption" style="opacity: 0.7">Average mood</div>
        <div class="row" style="gap: var(--s2); align-items: baseline">
          <span class="icon icon-xs" data-symbol="sparkles" style="color: var(--espresso)"></span>
          <div class="t-stat">3.9</div>
          <span class="t-footnote" style="opacity: 0.7">of 5</span>
        </div>
        <div class="row" style="gap: 3px">
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill is-on"></span>
          <span class="streak-pill"></span>
          <span class="streak-pill"></span>
        </div>
      </div>
    </div>

    <div class="inset" style="padding: var(--s3) var(--s5) 0">
      <div class="band is-sun">
        <div class="row" style="gap: var(--s3)">
          <img class="art" src="/images/mascot-calm.svg" data-asset="MascotCalm" width="54" height="55" alt="" />
          <div class="grow col" style="gap: 1px">
            <div class="t-subhead">Wednesday carried your week</div>
            <div class="t-footnote" style="color: var(--clay)">
              Thursday wobbled, but mornings keep forgiving you.
            </div>
          </div>
          <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--clay)"></span>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="inset" style="padding: var(--s4) var(--s5) var(--s2)">
      <nav class="dock">
        <span class="dock-item is-on"><span class="icon" data-symbol="house"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="book"></span></span>
        <span class="dock-item">
          <span class="dock-plus"><span class="icon icon-sm" data-symbol="plus"></span></span>
        </span>
        <span class="dock-item"><span class="icon" data-symbol="chart.bar"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="person"></span></span>
      </nav>
    </div>
  </div>
</div>
