<div class="screen" style="background: var(--cream)">
  <div class="body-fixed">
    <div class="row" style="padding: var(--s6) var(--s6) 0">
      <button class="circle-btn is-dashed" aria-label="Back">
        <span class="icon icon-sm" data-symbol="arrow.left"></span>
      </button>
    </div>

    <div class="row" style="justify-content: center; padding-top: var(--s5)">
      <div class="ring">
        <img class="ring-arcs" src="/images/health-ring.svg" width="256" height="256" alt="Health score" />

        <div class="col" style="gap: var(--s1); align-items: center">
          <div class="t-score">8.8</div>
          <div class="row" style="gap: var(--s1); color: var(--muted)">
            <span class="t-footnote">your health score</span>
            <span class="icon icon-xs" data-symbol="info.circle"></span>
          </div>
        </div>

        <span class="badge bg-sun" style="left: 50%; top: 5.625%">
          <span class="icon icon-xs" data-symbol="shield.fill"></span>
        </span>
        <span class="badge bg-olive" style="left: 85.9%; top: 23.916%">
          <span class="icon icon-xs" data-symbol="leaf.fill"></span>
        </span>
        <span class="badge bg-blossom" style="left: 91.699%; top: 65.177%">
          <span class="icon icon-xs" data-symbol="heart.fill"></span>
        </span>
        <span class="badge bg-sky" style="left: 46.905%; top: 94.267%">
          <span class="icon icon-xs" data-symbol="staroflife.fill"></span>
        </span>
        <span class="badge bg-olive" style="left: 7.344%; top: 62.231%">
          <span class="icon icon-xs" data-symbol="pills.fill"></span>
        </span>
        <span class="badge bg-sun" style="left: 7.344%; top: 37.769%">
          <span class="icon icon-xs" data-symbol="figure.walk"></span>
        </span>
        <span class="badge bg-sky" style="left: 20.306%; top: 17.025%">
          <span class="icon icon-xs" data-symbol="dumbbell.fill"></span>
        </span>
        <span class="badge bg-blossom" style="left: 34.823%; top: 8.301%">
          <span class="icon icon-xs" data-symbol="drop.fill"></span>
        </span>
      </div>
    </div>

    <div class="row" style="justify-content: center; gap: var(--s3); padding-top: var(--s4)">
      <button class="pill">Plan check-up</button>
      <button class="circle-btn" aria-label="Consult">
        <span class="icon icon-sm" data-symbol="stethoscope"></span>
      </button>
      <button class="circle-btn" aria-label="Reports">
        <span class="icon icon-sm" data-symbol="doc.text"></span>
      </button>
      <button class="circle-btn" aria-label="Send">
        <span class="icon icon-sm" data-symbol="paperplane.fill"></span>
      </button>
    </div>

    <div class="inset" style="padding: var(--s4) var(--s6) 0">
      <div class="card-assistant">
        <img class="card-mark" src="/images/heart-mark.svg" width="128" height="117" alt="" />
        <div class="col above" style="gap: var(--s2)">
          <div class="t-label">Intelly assistant</div>
          <div class="t-subhead">
            Taigo, your health score goes down
            <span style="color: var(--alert); font-weight: 700">28%</span>
            last week
          </div>
          <div class="row">
            <button class="pill pill-sm">Let's discuss</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row" style="justify-content: space-between; padding: var(--s5) var(--s6) 0">
      <div class="t-section">Health systems</div>
      <button class="pill pill-sm">
        All
        <span class="icon icon-xs" data-symbol="chevron.down"></span>
      </button>
    </div>

    <div class="col" style="gap: var(--s2); padding: var(--s3) var(--s6) 0">
      <div class="row" style="gap: var(--s3)">
        <span class="chip-icon bg-sun">
          <span class="icon icon-sm" data-symbol="pills.fill"></span>
        </span>
        <div class="grow t-subhead">Endocrine system</div>
        <div class="row" style="gap: var(--s1); align-items: baseline">
          <div class="t-section">8.3</div>
          <div class="t-footnote" style="color: var(--muted)">of 10</div>
        </div>
      </div>
      <div class="meter">
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg is-on"></span>
        <span class="meter-seg"></span>
        <span class="meter-seg"></span>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="inset" style="padding: 0 var(--s5) var(--s2)">
      <nav class="tabbar-dark">
        <span class="tab-slot is-on">
          <span class="icon" data-symbol="heart"></span>
        </span>
        <span class="tab-slot">
          <span class="icon" data-symbol="calendar"></span>
        </span>
        <span class="tab-slot">
          <span class="plus-btn">
            <span class="icon icon-sm" data-symbol="plus"></span>
          </span>
        </span>
        <span class="tab-slot">
          <span class="icon" data-symbol="bubble.left"></span>
        </span>
        <span class="tab-slot">
          <span class="icon" data-symbol="person"></span>
        </span>
      </nav>
    </div>
  </div>
</div>
