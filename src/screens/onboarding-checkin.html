<div class="screen app-mood">
  <div class="body-fixed">
    <div class="row" style="justify-content: flex-end; padding: var(--s4) var(--s5) 0">
      <button class="pill-ghost">Skip</button>
    </div>

    <div class="row" style="justify-content: center; align-items: flex-end; flex: 1 1 auto; padding-top: var(--s4); padding-bottom: var(--s2)">
      <img class="art" src="/images/onb-checkin.svg" data-asset="OnbCheckin" width="300" height="231" alt="Five moods to choose from" />
    </div>

    <div class="col" style="align-items: center; gap: var(--s3); padding: var(--s6) var(--s8) 0">
      <div style="font-size: 28px; font-weight: 700; line-height: 34px; letter-spacing: -0.6px; text-align: center">
        One tap, a few times a day
      </div>
      <p class="t-subhead" style="color: var(--clay); text-align: center">
        Five faces, no scale to interpret. Add a note only when you want to.
      </p>
    </div>

    <div class="col" style="align-items: center; gap: var(--s5); padding: var(--s6) var(--s6)">
      <div class="dots">
        <i class="dot"></i>
        <i class="dot is-filled"></i>
        <i class="dot"></i>
        <i class="dot"></i>
      </div>
      <button class="pill-sage" style="width: 100%">Continue</button>
    </div>
  </div>
</div>
