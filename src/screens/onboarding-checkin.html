<div class="screen app-mood">
  <div class="body-fixed">
    <div class="row" style="justify-content: flex-end; padding: var(--s4) var(--s5) 0">
      <button class="pill-ghost">Skip</button>
    </div>

    <div class="paper-card" style="margin: var(--s5) var(--s6) 0">
      <div class="row" style="justify-content: space-between">
        <div class="t-headline">Mood History</div>
        <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--clay)"></span>
      </div>
      <div class="row" style="gap: var(--s1)">
        <div class="face-cell">
          <span class="face-dot is-3"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Mon</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-5"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Tue</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-1"><span class="icon icon-xs" data-symbol="xmark"></span></span>
          <span class="t-caption" style="color: var(--clay)">Wed</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-3"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Thu</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-2"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Fri</span>
        </div>
      </div>
    </div>

    <div class="col" style="align-items: center; gap: var(--s3); padding: var(--s6) var(--s8) 0">
      <div class="t-title1" style="text-align: center">
        One tap, a few times a day
      </div>
      <p class="t-subhead" style="color: var(--clay); text-align: center">
        Five faces, no scale to interpret. Add a note only when you want to.
      </p>
    </div>

    <div class="spacer"></div>

    <div class="col" style="align-items: center; gap: var(--s5); padding: 0 var(--s6) var(--s6)">
      <div class="dots">
        <i class="dot"></i>
        <i class="dot is-filled"></i>
        <i class="dot"></i>
        <i class="dot"></i>
      </div>
      <button class="pill-sage" style="width: 100%">Continue</button>
    </div>
  </div>
</div>
