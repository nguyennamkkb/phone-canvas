<div class="screen app-mood">
  <div class="body-fixed">
    <div class="row" style="justify-content: flex-end; padding: var(--s4) var(--s5) 0">
      <button class="pill-ghost">Skip</button>
    </div>

    <div class="paper-card" style="margin: var(--s5) var(--s6) 0; align-items: center">
      <div class="row" style="gap: var(--s2)">
        <span class="face-dot is-1" style="width: 48px; height: 48px">
          <span class="icon icon-sm" data-symbol="xmark"></span>
        </span>
        <span class="face-dot is-2" style="width: 48px; height: 48px">
          <span class="icon icon-sm" data-symbol="heart.fill"></span>
        </span>
        <span class="face-dot is-3" style="width: 48px; height: 48px">
          <span class="icon icon-sm" data-symbol="heart.fill"></span>
        </span>
        <span class="face-dot is-4" style="width: 48px; height: 48px">
          <span class="icon icon-sm" data-symbol="heart.fill"></span>
        </span>
        <span class="face-dot is-5" style="width: 48px; height: 48px">
          <span class="icon icon-sm" data-symbol="heart.fill"></span>
        </span>
      </div>
      <div class="t-footnote" style="color: var(--clay)">Five moods, no scale to interpret</div>
    </div>

    <div class="col" style="align-items: center; gap: var(--s3); padding: var(--s6) var(--s8) 0">
      <div class="t-title1" style="text-align: center">
        Notice how you actually feel
      </div>
      <p class="t-subhead" style="color: var(--clay); text-align: center">
        Most days blur together. Two taps is enough to keep the shape of them.
      </p>
    </div>

    <div class="spacer"></div>

    <div class="col" style="align-items: center; gap: var(--s5); padding: 0 var(--s6) var(--s6)">
      <div class="dots">
        <i class="dot is-filled"></i>
        <i class="dot"></i>
        <i class="dot"></i>
        <i class="dot"></i>
      </div>
      <button class="pill-sage" style="width: 100%">Continue</button>
    </div>
  </div>
</div>
