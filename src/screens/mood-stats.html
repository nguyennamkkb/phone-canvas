<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <button class="nav-round" aria-label="Back">
        <span class="icon icon-sm" data-symbol="chevron.left"></span>
      </button>
      <button class="nav-round is-dark" aria-label="Statistics">
        <span class="icon icon-sm" data-symbol="chart.bar"></span>
      </button>
    </div>

    <div class="col" style="gap: var(--s1); padding-top: var(--s3)">
      <div class="t-title1">Mood Stats</div>
      <div class="t-footnote" style="color: var(--clay)">See your mood through the day.</div>
    </div>

    <div class="segmented-light" style="margin-top: var(--s3)">
      <div class="seg is-dark">All</div>
      <div class="seg">Days</div>
      <div class="seg">Weeks</div>
      <div class="seg">Months</div>
      <div class="seg">Years</div>
    </div>

    <div class="paper-card" style="margin-top: var(--s3)">
      <img class="art" src="/images/mood-wave.svg" data-asset="MoodWave" width="318" height="209" alt="Mood wave through the day" />
      <div class="row" style="gap: var(--s1)">
        <div class="chart-label">Mon</div>
        <div class="chart-label">Tue</div>
        <div class="chart-label">Wed</div>
        <div class="chart-label">Thu</div>
        <div class="chart-label">Fri</div>
        <div class="chart-label">Sat</div>
        <div class="chart-label">Sun</div>
      </div>
    </div>

    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <div class="t-headline">AI Mood Predictions</div>
      <span class="pill-ghost" style="height: 32px">
        <span class="icon icon-xs" data-symbol="calendar"></span>
        Next 1w
        <span class="icon icon-xs" data-symbol="chevron.down"></span>
      </span>
    </div>

    <div class="paper-card" style="margin-top: var(--s3)">
      <div class="row" style="gap: var(--s1)">
        <div class="face-cell">
          <span class="face-dot is-3"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Mon</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-5"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Tue</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-2"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Wed</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-3"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Thu</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-quiet"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Fri</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-quiet"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Sat</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-2"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Sun</span>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s4) 0 var(--s2)">
      <nav class="dock">
        <span class="dock-item"><span class="icon" data-symbol="house"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="bubble.left"></span></span>
        <span class="dock-item">
          <span class="dock-plus"><span class="icon icon-sm" data-symbol="plus"></span></span>
        </span>
        <span class="dock-item is-on"><span class="icon" data-symbol="chart.bar"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="person"></span></span>
      </nav>
    </div>
  </div>
</div>
