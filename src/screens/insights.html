<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <button class="nav-round" aria-label="Back">
        <span class="icon icon-sm" data-symbol="chevron.left"></span>
      </button>
      <div class="t-subhead">Insights</div>
      <button class="icon-btn-soft" aria-label="Share">
        <span class="icon icon-sm" data-symbol="square.and.arrow.up"></span>
      </button>
    </div>

    <div class="row" style="gap: var(--s5); align-items: center; padding-top: var(--s5)">
      <div class="bubble">
        <div class="t-score" style="font-size: 38px; line-height: 40px">78</div>
        <div class="t-caption" style="color: var(--clay)">of 100</div>
      </div>
      <div class="grow col" style="gap: var(--s2)">
        <div class="t-title3">A steady month</div>
        <div class="row" style="gap: var(--s1)">
          <span class="icon icon-xs" data-symbol="trend" style="color: var(--sage-deep)"></span>
          <span class="t-footnote" style="color: var(--sage-deep)">up 12% on August</span>
        </div>
        <div class="t-footnote" style="color: var(--clay)">3.9 average across 24 entries</div>
      </div>
    </div>

    <div class="paper-card" style="margin-top: var(--s4); gap: var(--s2)">
      <div class="row" style="justify-content: space-between">
        <div class="t-headline">Last 14 days</div>
        <span class="pill-soft">Mood</span>
      </div>
      <div class="chart" style="height: 96px; gap: var(--s1); align-items: flex-end">
        <div class="chart-col"><div class="bar" style="height: 62%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 48%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 74%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 40%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 56%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 84%"></div></div>
        <div class="chart-col"><div class="bar is-peak" style="height: 100%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 66%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 44%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 58%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 78%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 52%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 70%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 88%"></div></div>
      </div>
      <div class="row" style="justify-content: space-between">
        <span class="t-caption" style="color: var(--clay)">02 Sept</span>
        <span class="t-caption" style="color: var(--clay)">16 Sept</span>
      </div>
    </div>

    <div class="row" style="gap: var(--s3); padding-top: var(--s3)">
      <div class="stat-tile is-sage-soft">
        <span class="icon icon-sm" data-symbol="trend" style="color: var(--sage-deep)"></span>
        <div class="t-caption" style="color: var(--clay)">Best day</div>
        <div class="t-headline">Saturday</div>
      </div>
      <div class="stat-tile is-ember-soft">
        <span class="icon icon-sm" data-symbol="trend" style="color: var(--ember)"></span>
        <div class="t-caption" style="color: var(--clay)">Hardest day</div>
        <div class="t-headline">Thursday</div>
      </div>
    </div>

    <div class="t-title3" style="padding-top: var(--s5)">What shows up</div>

    <div class="row" style="gap: var(--s2); align-items: flex-start; flex-wrap: wrap; padding-top: var(--s3)">
      <span class="chip">Sleep · 18</span>
      <span class="chip">Work · 14</span>
      <span class="chip">People · 9</span>
      <span class="chip">Health · 6</span>
    </div>

    <div class="spacer"></div>

    <div class="paper-card" style="background: var(--lilac-soft); margin-bottom: var(--s3)">
      <div class="row" style="gap: var(--s3)">
        <span class="chip-icon" style="background: var(--card)">
          <span class="icon icon-sm" data-symbol="sparkles"></span>
        </span>
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Thursday is your dip</div>
          <div class="t-footnote" style="color: var(--clay)">
            Four of the last five Thursdays landed below your average.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
