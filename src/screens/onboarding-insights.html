<div class="screen app-mood">
  <div class="body-fixed">
    <div class="row" style="justify-content: flex-end; padding: var(--s4) var(--s5) 0">
      <button class="pill-ghost">Skip</button>
    </div>

    <div class="paper-card" style="margin: var(--s5) var(--s6) 0">
      <div class="row" style="justify-content: space-between">
        <div class="t-headline">Last 14 days</div>
        <span class="pill-soft">Mood</span>
      </div>
      <div class="chart" style="height: 96px; gap: var(--s1)">
        <div class="chart-col"><div class="bar" style="height: 55%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 70%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 45%"></div></div>
        <div class="chart-col"><div class="bar is-neg" style="height: 60%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 80%"></div></div>
        <div class="chart-col"><div class="bar is-peak" style="height: 100%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 65%"></div></div>
      </div>
    </div>

    <div class="col" style="align-items: center; gap: var(--s3); padding: var(--s6) var(--s8) 0">
      <div class="t-title1" style="text-align: center">
        See the pattern, not just the day
      </div>
      <p class="t-subhead" style="color: var(--clay); text-align: center">
        After a couple of weeks the app can tell you what your week actually looks like.
      </p>
    </div>

    <div class="spacer"></div>

    <div class="col" style="align-items: center; gap: var(--s5); padding: 0 var(--s6) var(--s6)">
      <div class="dots">
        <i class="dot"></i>
        <i class="dot"></i>
        <i class="dot is-filled"></i>
        <i class="dot"></i>
      </div>
      <button class="pill-sage" style="width: 100%">Continue</button>
    </div>
  </div>
</div>
