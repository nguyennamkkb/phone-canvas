<div class="screen" style="background: var(--bg-elevated)">
  <div class="body-fixed">
    <div class="scrim"></div>
    <div class="spacer"></div>

    <div class="sheet-panel">
      <div class="row" style="justify-content: center">
        <i class="grabber"></i>
      </div>

      <div class="sheet-head">
        <div class="t-section">Greeting &amp; Introducing</div>
        <button class="close-btn" aria-label="Close">
          <span class="icon icon-xs" data-symbol="xmark"></span>
        </button>
      </div>

      <div class="row" style="gap: var(--s2)">
        <span class="chip is-active">Beginner</span>
        <span class="chip">5 mins 20 sec</span>
        <span class="chip">12 phrases</span>
      </div>

      <p class="t-subhead" style="color: var(--slate)">
        Open a conversation without freezing. You will practise three openers, the
        pause that follows them, and how to hand the turn back.
      </p>

      <div class="row" style="gap: var(--s3)">
        <span class="chip-icon bg-blue-tint">
          <span class="icon icon-sm" data-symbol="book.fill" style="color: #3b82f6"></span>
        </span>
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Lesson 3 of 20</div>
          <div class="t-footnote" style="color: var(--slate)">Last opened 2 days ago</div>
        </div>
      </div>

      <div class="row" style="gap: var(--s3)">
        <span class="chip-icon bg-sun">
          <span class="icon icon-sm" data-symbol="figure.walk"></span>
        </span>
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Progress saved</div>
          <div class="t-footnote" style="color: var(--slate)">You stopped mid-quiz</div>
        </div>
      </div>

      <div class="cta-bar">
        <button class="nav-round is-hollow" aria-label="Save">
          <span class="icon icon-sm" data-symbol="bookmark"></span>
        </button>
        <button class="btn-dark">Start lesson</button>
      </div>
    </div>
  </div>
</div>
