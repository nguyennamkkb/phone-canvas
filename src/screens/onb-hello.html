<div class="screen app-mood" style="background: var(--card)">
  <div class="body-fixed" style="padding-top: var(--s10); padding-bottom: var(--s4)">
    <div class="art-block">
      <img class="art" src="/images/onb-hello.svg"
           data-asset="OnbHello" width="320" height="320" alt="A happy mood surrounded by feelings" />
    </div>

    <div class="col" style="gap: var(--s3); padding: 0 var(--s8); align-items: center; text-align: center">
      <h1 class="t-display" style="text-align: center">Meet how you really feel</h1>
      <p class="t-subhead t-secondary" style="text-align: center">Every feeling counts, even the small ones. Say hello to all of them.</p>
    </div>

    <div class="spacer"></div>

    <div class="row" style="justify-content: space-between; padding: 0 var(--s8)">
      <div class="dots">
        <i class="dot is-filled"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
      </div>
      <button class="sq-btn is-dark" aria-label="Next">
        <span class="icon icon-sm" data-symbol="arrow.right"></span>
      </button>
    </div>
  </div>
</div>
