<div class="screen" style="background: var(--bg-elevated)">
  <div class="body-fixed">
    <div class="scrim"></div>
    <div class="spacer"></div>

    <div class="sheet-panel">
      <div class="row" style="justify-content: center">
        <i class="grabber"></i>
      </div>

      <div class="sheet-head">
        <div class="t-section">New entry</div>
        <button class="close-btn" aria-label="Close">
          <span class="icon icon-xs" data-symbol="xmark"></span>
        </button>
      </div>

      <div class="segmented-light">
        <div class="seg is-on">Text</div>
        <div class="seg">Voice</div>
        <div class="seg">Photo</div>
      </div>

      <div class="col" style="gap: var(--s2)">
        <div class="t-footnote" style="color: var(--slate)">How was it?</div>
        <div class="row" style="gap: var(--s2)">
          <span class="chip is-active">Calm</span>
          <span class="chip">Focused</span>
          <span class="chip">Tired</span>
        </div>
      </div>

      <div class="col" style="gap: var(--s2)">
        <div class="t-footnote" style="color: var(--slate)">Note</div>
        <div class="text-field">Write a line about today…</div>
      </div>

      <div class="cta-bar">
        <button class="btn">Cancel</button>
        <button class="btn-dark">Save entry</button>
      </div>
    </div>
  </div>
</div>
