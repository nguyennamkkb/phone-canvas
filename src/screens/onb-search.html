<div class="screen app-mood" style="background: var(--card)">
  <div class="body-fixed" style="padding-top: var(--s10); padding-bottom: var(--s4)">
    <div class="art-block">
      <img class="art" src="/images/onb-search.svg"
           data-asset="OnbSearch" width="320" height="320" alt="Searching through journal entries with a magnifier" />
    </div>

    <div class="col" style="gap: var(--s3); padding: 0 var(--s8); align-items: center; text-align: center">
      <h1 class="t-display" style="text-align: center">Find any feeling fast</h1>
      <p class="t-subhead t-secondary" style="text-align: center">Search every entry, tag and note from all over your days.</p>
    </div>

    <div class="spacer"></div>

    <div class="row" style="justify-content: space-between; padding: 0 var(--s8)">
      <div class="row" style="gap: var(--s5)">
        <button class="sq-btn" aria-label="Back">
          <span class="icon icon-sm" data-symbol="arrow.left"></span>
        </button>
      </div>
      <div class="dots">
        <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot is-filled"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
      </div>
      <div class="row" style="gap: var(--s5)">
        <button class="sq-btn is-dark" aria-label="Next">
          <span class="icon icon-sm" data-symbol="arrow.right"></span>
        </button>
      </div>
    </div>
  </div>
</div>
