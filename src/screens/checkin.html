<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <button class="close-btn" aria-label="Close">
        <span class="icon icon-xs" data-symbol="xmark"></span>
      </button>
      <div class="t-subhead">Check in</div>
      <span class="icon icon-sm" data-symbol="clock" style="color: var(--clay)"></span>
    </div>

    <div class="col" style="align-items: center; gap: var(--s1); padding-top: var(--s5)">
      <div class="t-title2">How are you right now?</div>
      <div class="t-footnote" style="color: var(--clay)">Tuesday, 16 September · 14:20</div>
    </div>

    <div class="row" style="gap: var(--s2); padding-top: var(--s5)">
      <span class="face-dot is-1" style="width: 52px; height: 52px">
        <span class="icon icon-sm" data-symbol="heart.fill"></span>
      </span>
      <span class="face-dot is-2" style="width: 52px; height: 52px">
        <span class="icon icon-sm" data-symbol="heart.fill"></span>
      </span>
      <span class="face-dot is-3" style="width: 52px; height: 52px">
        <span class="icon icon-sm" data-symbol="heart.fill"></span>
      </span>
      <span class="face-dot is-4" style="width: 52px; height: 52px; border: 2px solid var(--espresso)">
        <span class="icon icon-sm" data-symbol="heart.fill"></span>
      </span>
      <span class="face-dot is-5" style="width: 52px; height: 52px">
        <span class="icon icon-sm" data-symbol="heart.fill"></span>
      </span>
    </div>

    <div class="col" style="align-items: center; gap: 1px; padding-top: var(--s3)">
      <div class="t-title3">Good</div>
      <div class="t-footnote" style="color: var(--clay)">Better than yesterday</div>
    </div>

    <div class="col" style="gap: var(--s3); padding-top: var(--s5)">
      <div class="t-headline">What is behind it?</div>
      <div class="row" style="gap: var(--s2); align-items: flex-start; flex-wrap: wrap">
        <span class="chip is-active">Sleep</span>
        <span class="chip">Work</span>
        <span class="chip">People</span>
        <span class="chip">Health</span>
        <span class="chip">Weather</span>
        <span class="chip">Family</span>
      </div>
    </div>

    <div class="col" style="gap: var(--s3); padding-top: var(--s5)">
      <div class="t-headline">Add a note</div>
      <div class="text-field">Optional. A line is enough.</div>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s4) 0 var(--s5)">
      <button class="pill-sage" style="width: 100%">Save check-in</button>
    </div>
  </div>
</div>
