<div class="screen" style="background: var(--mist)">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s5)">
      <img class="art avatar-round" src="/images/avatar.svg" width="46" height="46" alt="Your profile" />
      <button class="icon-btn-soft" aria-label="More">
        <span class="icon icon-sm" data-symbol="ellipsis"></span>
      </button>
    </div>

    <div class="row" style="justify-content: space-between; align-items: flex-start; padding-top: var(--s4)">
      <h1 class="t-page">Learning Overview</h1>
      <button class="pill-light" style="margin-top: var(--s2)">
        Weekly
        <span class="icon icon-xs" data-symbol="chevron.down"></span>
      </button>
    </div>

    <div class="panel" style="margin-top: var(--s5)">
      <div class="chart">
        <div class="chart-col"><div class="bar" style="height: 88%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 68%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 68%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 54%"></div></div>
        <div class="chart-col">
          <div class="tooltip">4 hours</div>
          <div class="bar is-peak" style="height: 74%"></div>
        </div>
        <div class="chart-col"><div class="bar" style="height: 68%"></div></div>
        <div class="chart-col"><div class="bar" style="height: 78%"></div></div>
      </div>
      <div class="chart-labels">
        <div class="chart-label">Mon</div>
        <div class="chart-label">Tue</div>
        <div class="chart-label">Wed</div>
        <div class="chart-label">Thu</div>
        <div class="chart-label is-on">Fri</div>
        <div class="chart-label">Sat</div>
        <div class="chart-label">Sun</div>
      </div>
    </div>

    <div class="row" style="gap: var(--s3); padding-top: var(--s4)">
      <div class="feature-card bg-violet-grad">
        <img class="art" src="/images/stat-clipboard.svg" width="52" height="52" alt="" />
        <div class="spacer"></div>
        <div class="t-footnote" style="opacity: 0.9">Weekly learning time</div>
        <div class="t-stat">3h 45m</div>
      </div>
      <div class="feature-card bg-sky">
        <img class="art" src="/images/stat-rocket.svg" width="52" height="52" alt="" />
        <div class="spacer"></div>
        <div class="t-footnote" style="opacity: 0.9">Skill Master Chart</div>
        <div class="t-stat">Voca 80%</div>
      </div>
    </div>

    <div class="row-card" style="margin-top: var(--s4); padding: var(--s4); background: #ffffff">
      <span class="icon" data-symbol="bolt.fill" style="color: var(--bolt)"></span>
      <div class="grow col" style="gap: 2px">
        <div class="t-footnote" style="color: var(--slate)">Streak tracker</div>
        <div class="t-headline">10-day learning streak!</div>
      </div>
      <span class="icon icon-sm" data-symbol="chevron.right"></span>
    </div>

    <div class="spacer"></div>

    <nav class="tabbar-light">
      <div class="tab-item">
        <span class="icon icon-sm" data-symbol="house"></span>
        <span>Home</span>
      </div>
      <div class="tab-item">
        <span class="icon icon-sm" data-symbol="book"></span>
        <span>Lesson</span>
      </div>
      <div class="tab-item is-on">
        <span class="icon icon-sm" data-symbol="chart.bar"></span>
        <span>Statistics</span>
      </div>
      <div class="tab-item">
        <span class="icon icon-sm" data-symbol="person"></span>
        <span>Profile</span>
      </div>
    </nav>
  </div>
</div>
