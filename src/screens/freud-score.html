<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <button class="nav-round" aria-label="Back">
        <span class="icon icon-sm" data-symbol="chevron.left"></span>
      </button>
      <button class="nav-round is-dark" aria-label="About this score">
        <span class="icon icon-sm" data-symbol="info.circle"></span>
      </button>
    </div>

    <div class="col" style="gap: var(--s1); padding-top: var(--s3)">
      <div class="t-title1">Freud Score</div>
      <div class="t-footnote" style="color: var(--clay)">See your mental score insights</div>
    </div>

    <div class="row" style="gap: var(--s3); align-items: center; padding-top: var(--s3)">
      <div class="row" style="gap: var(--s1)">
        <span class="swatch" style="background: var(--sage-deep)"></span>
        <span class="t-caption">Positive</span>
      </div>
      <div class="row" style="gap: var(--s1)">
        <span class="swatch" style="background: var(--ember)"></span>
        <span class="t-caption">Negative</span>
      </div>
      <div class="spacer"></div>
      <button class="pill-ghost" style="height: 32px">
        <span class="icon icon-xs" data-symbol="calendar"></span>
        Monthly
        <span class="icon icon-xs" data-symbol="chevron.down"></span>
      </button>
    </div>

    <div class="paper-card" style="margin-top: var(--s3)">
      <div class="chart is-compact" style="gap: var(--s1)">
        <div class="chart-col"><span class="bar is-pos" style="height: 62%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 48%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 74%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 88%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 80%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 58%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-neg" style="height: 44%"></span><span class="bar-dot is-neg"></span></div>
        <div class="chart-col"><span class="bar is-neg" style="height: 52%"></span><span class="bar-dot is-neg"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 60%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 46%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 56%"></span><span class="bar-dot"></span></div>
        <div class="chart-col"><span class="bar is-pos" style="height: 40%"></span><span class="bar-dot"></span></div>
      </div>
      <div class="timeline">
        <span class="timeline-knob"></span>
        <span class="timeline-line"></span>
        <span class="timeline-knob"></span>
      </div>
      <div class="row" style="justify-content: space-between">
        <span class="t-caption" style="color: var(--clay)">09 Jan</span>
        <span class="t-caption" style="color: var(--clay)">09 Feb</span>
      </div>
    </div>

    <div class="paper-card" style="margin-top: var(--s3)">
      <div class="row" style="justify-content: space-between">
        <div class="t-headline">Mood History</div>
        <span class="icon icon-sm" data-symbol="ellipsis" style="color: var(--clay)"></span>
      </div>
      <div class="row" style="gap: var(--s1)">
        <div class="face-cell">
          <span class="face-dot is-3"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Mon</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-5"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Tue</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-1"><span class="icon icon-xs" data-symbol="xmark"></span></span>
          <span class="t-caption" style="color: var(--clay)">Wed</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-3"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Thu</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-2"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Fri</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-quiet"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Sat</span>
        </div>
        <div class="face-cell">
          <span class="face-dot is-4"><span class="icon icon-xs" data-symbol="heart.fill"></span></span>
          <span class="t-caption" style="color: var(--clay)">Sun</span>
        </div>
      </div>
    </div>

    <div class="row-card" style="margin-top: var(--s3)">
      <span class="chip-icon" style="background: var(--sage-soft)">
        <span class="icon icon-sm" data-symbol="heart.fill" style="color: var(--sage-deep)"></span>
      </span>
      <div class="grow t-headline">Recommendations</div>
      <span class="t-footnote" style="color: var(--clay)">78+</span>
      <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--clay)"></span>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s4) 0 var(--s2)">
      <nav class="dock">
        <span class="dock-item is-on"><span class="icon" data-symbol="house"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="bubble.left"></span></span>
        <span class="dock-item">
          <span class="dock-plus"><span class="icon icon-sm" data-symbol="plus"></span></span>
        </span>
        <span class="dock-item"><span class="icon" data-symbol="chart.bar"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="person"></span></span>
      </nav>
    </div>
  </div>
</div>
