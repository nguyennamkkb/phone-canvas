<div class="screen">
  <div class="body-fixed">
    <div class="hero">
      <img class="art" src="/images/notebook.svg" width="88" height="88" alt="Notebook" />
      <div class="t-title2" style="color: var(--accent)">Write it down</div>
    </div>

    <div class="col" style="gap: var(--s3); padding: var(--s8) var(--s6) 0; align-items: center">
      <div class="t-large" style="text-align: center">A quieter place for your thinking</div>
      <div class="t-body t-secondary" style="text-align: center">
        One entry a day. No streaks, no scores, no feed. Just the page and
        whatever you brought with you.
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="gap: var(--s5); padding: 0 var(--s6) var(--s6); align-items: center">
      <div class="dots">
        <div class="dot is-active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <button class="btn btn-primary btn-block">Start writing</button>
      <div class="t-footnote t-secondary">You can delete everything later.</div>
    </div>
  </div>
</div>
