<div class="screen app-mood">
  <div class="body-fixed" style="padding: 0 var(--s5)">
    <div class="row" style="justify-content: space-between; padding-top: var(--s4)">
      <button class="nav-round" aria-label="Back">
        <span class="icon icon-sm" data-symbol="chevron.left"></span>
      </button>
      <div class="t-subhead">History</div>
      <button class="icon-btn-soft" aria-label="Jump to month">
        <span class="icon icon-sm" data-symbol="calendar"></span>
      </button>
    </div>

    <div class="row" style="justify-content: space-between; padding-top: var(--s5)">
      <div class="t-title3">September 2025</div>
      <button class="pill-ghost" style="height: 32px">
        2025
        <span class="icon icon-xs" data-symbol="chevron.down"></span>
      </button>
    </div>

    <div class="paper-card" style="margin-top: var(--s3); gap: var(--s2)">
      <div class="cal-row">
        <div class="cal-head">M</div>
        <div class="cal-head">T</div>
        <div class="cal-head">W</div>
        <div class="cal-head">T</div>
        <div class="cal-head">F</div>
        <div class="cal-head">S</div>
        <div class="cal-head">S</div>
      </div>

      <div class="cal-row">
        <div class="cal-cell is-4">1</div>
        <div class="cal-cell is-4">2</div>
        <div class="cal-cell is-3">3</div>
        <div class="cal-cell is-5">4</div>
        <div class="cal-cell is-3">5</div>
        <div class="cal-cell is-2">6</div>
        <div class="cal-cell is-4">7</div>
      </div>
      <div class="cal-row">
        <div class="cal-cell is-4">8</div>
        <div class="cal-cell is-3">9</div>
        <div class="cal-cell is-2">10</div>
        <div class="cal-cell is-3">11</div>
        <div class="cal-cell is-4">12</div>
        <div class="cal-cell is-5">13</div>
        <div class="cal-cell is-4">14</div>
      </div>
      <div class="cal-row">
        <div class="cal-cell is-3">15</div>
        <div class="cal-cell is-today is-4">16</div>
        <div class="cal-cell is-quiet">17</div>
        <div class="cal-cell is-quiet">18</div>
        <div class="cal-cell is-quiet">19</div>
        <div class="cal-cell is-quiet">20</div>
        <div class="cal-cell is-quiet">21</div>
      </div>
      <div class="cal-row">
        <div class="cal-cell is-quiet">22</div>
        <div class="cal-cell is-quiet">23</div>
        <div class="cal-cell is-quiet">24</div>
        <div class="cal-cell is-quiet">25</div>
        <div class="cal-cell is-quiet">26</div>
        <div class="cal-cell is-quiet">27</div>
        <div class="cal-cell is-quiet">28</div>
      </div>
      <div class="cal-row">
        <div class="cal-cell is-quiet">29</div>
        <div class="cal-cell is-quiet">30</div>
        <div class="cal-cell"></div>
        <div class="cal-cell"></div>
        <div class="cal-cell"></div>
        <div class="cal-cell"></div>
        <div class="cal-cell"></div>
      </div>
    </div>

    <div class="row" style="gap: var(--s3); padding-top: var(--s3)">
      <div class="stat-tile is-sage-soft">
        <div class="t-caption" style="color: var(--clay)">Entries</div>
        <div class="t-stat">15</div>
      </div>
      <div class="stat-tile is-lilac">
        <div class="t-caption" style="color: var(--espresso); opacity: 0.72">Average</div>
        <div class="t-stat">3.7</div>
      </div>
      <div class="stat-tile is-ember-soft">
        <div class="t-caption" style="color: var(--clay)">Best day</div>
        <div class="t-stat">13th</div>
      </div>
    </div>

    <div class="t-title3" style="padding-top: var(--s5)">September so far</div>

    <div class="col" style="gap: var(--s2); padding-top: var(--s3)">
      <div class="row-card">
        <span class="face-dot is-5" style="width: 36px; height: 36px">
          <span class="icon icon-xs" data-symbol="heart.fill"></span>
        </span>
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Long walk, no phone</div>
          <div class="t-footnote" style="color: var(--clay)">Sat 13 Sept · 18:40</div>
        </div>
        <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--clay)"></span>
      </div>
      <div class="row-card">
        <span class="face-dot is-2" style="width: 36px; height: 36px">
          <span class="icon icon-xs" data-symbol="heart.fill"></span>
        </span>
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Slept badly, everything felt loud</div>
          <div class="t-footnote" style="color: var(--clay)">Thu 11 Sept · 09:10</div>
        </div>
        <span class="icon icon-xs" data-symbol="chevron.right" style="color: var(--clay)"></span>
      </div>
    </div>

    <div class="spacer"></div>

    <div style="padding: var(--s4) 0 var(--s2)">
      <nav class="dock">
        <span class="dock-item"><span class="icon" data-symbol="house"></span></span>
        <span class="dock-item is-on"><span class="icon" data-symbol="book"></span></span>
        <span class="dock-item">
          <span class="dock-plus"><span class="icon icon-sm" data-symbol="plus"></span></span>
        </span>
        <span class="dock-item"><span class="icon" data-symbol="chart.bar"></span></span>
        <span class="dock-item"><span class="icon" data-symbol="person"></span></span>
      </nav>
    </div>
  </div>
</div>
