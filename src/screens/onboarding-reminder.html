<div class="screen app-mood">
  <div class="body-fixed">
    <div class="paper-card" style="margin: var(--s5) var(--s6) 0; align-items: center">
      <span class="chip-icon" style="background: var(--ember-soft); width: 56px; height: 56px">
        <span class="icon" data-symbol="bell" style="color: var(--ember)"></span>
      </span>
      <div class="t-footnote" style="color: var(--clay)">Gentle, never nagging</div>
    </div>

    <div class="col" style="align-items: center; gap: var(--s3); padding: var(--s5) var(--s8) 0">
      <div class="t-title1" style="text-align: center">
        Three gentle reminders
      </div>
      <p class="t-subhead" style="color: var(--clay); text-align: center">
        Pick the moments you are usually free. You can change them any time.
      </p>
    </div>

    <div class="paper-card" style="margin: var(--s6) var(--s6) 0">
      <div class="row" style="justify-content: space-between">
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Morning</div>
          <div class="t-footnote" style="color: var(--clay)">After you wake up</div>
        </div>
        <div class="row" style="gap: var(--s2)">
          <span class="pill-soft">08:30</span>
          <span class="toggle"><i class="toggle-knob"></i></span>
        </div>
      </div>
      <div class="row" style="justify-content: space-between">
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Midday</div>
          <div class="t-footnote" style="color: var(--clay)">A pause between things</div>
        </div>
        <div class="row" style="gap: var(--s2)">
          <span class="pill-soft">13:00</span>
          <span class="toggle"><i class="toggle-knob"></i></span>
        </div>
      </div>
      <div class="row" style="justify-content: space-between">
        <div class="grow col" style="gap: 2px">
          <div class="t-headline">Evening</div>
          <div class="t-footnote" style="color: var(--clay)">Before the day closes</div>
        </div>
        <div class="row" style="gap: var(--s2)">
          <span class="pill-soft">21:30</span>
          <span class="toggle"><i class="toggle-knob"></i></span>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="col" style="align-items: center; gap: var(--s4); padding: 0 var(--s6) var(--s6)">
      <button class="pill-sage" style="width: 100%">
        <span class="icon icon-sm" data-symbol="bell"></span>
        Turn on reminders
      </button>
      <button class="pill-ghost" style="width: 100%; height: 44px">Not now</button>
    </div>
  </div>
</div>
